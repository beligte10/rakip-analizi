<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Başvuru — KT Stratejik Kokpit</title>
<style>
:root {
  --bg: #f8f9fa;
  --panel: #ffffff;
  --border: #e1e4e8;
  --text: #1f2933;
  --muted: #6b7280;
  --kt-green: #016B4E;
  --kt-green-dark: #014a37;
  --error: #b91c1c;
  --error-bg: #fee2e2;
  --success: #047857;
  --success-bg: #d1fae5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, var(--kt-green), var(--kt-green-dark));
  color: var(--text);
}
.card {
  background: var(--panel);
  border-radius: 12px;
  padding: 36px 32px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.25);
}
.brand { text-align: center; margin-bottom: 24px; }
.brand .logo-chip { display: inline-block; background: linear-gradient(135deg, var(--kt-green), var(--kt-green-dark)); padding: 10px 18px; border-radius: 8px; }
.brand .brand-logo { display: block; height: 26px; width: auto; }
.brand .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 6px; }
input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  font-family: inherit;
}
input:focus { outline: 2px solid var(--kt-green); outline-offset: -1px; }
.hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
button {
  width: 100%;
  margin-top: 20px;
  padding: 11px;
  background: var(--kt-green);
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
button:hover { background: var(--kt-green-dark); }
button:disabled { opacity: 0.6; cursor: default; }
.msg { margin-top: 14px; padding: 10px 12px; border-radius: 6px; font-size: 13px; display: none; }
.msg.error { display: block; background: var(--error-bg); color: var(--error); }
.msg.success { display: block; background: var(--success-bg); color: var(--success); }
.footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
.footer-link a { color: var(--kt-green); text-decoration: none; font-weight: 500; }
.footer-link a:hover { text-decoration: underline; }
</style>
</head>

      <div class="sub">KT Stratejik Kokpit — Üyelik Başvurusu</div>
    </div>
    <form id="signupForm">
      <label for="name">Ad Soyad</label>
      <input type="text" id="name" required autocomplete="name">
      <label for="email">E-posta</label>
      <input type="email" id="email" required autocomplete="username" placeholder="ad.soyad@kuveytturk.com.tr">
      <div class="hint">Sadece kuveytturk.com.tr uzantılı kurumsal e-posta kabul edilir</div>
      <label for="password">Şifre</label>
      <input type="password" id="password" required minlength="8" autocomplete="new-password">
      <div class="hint">En az 8 karakter</div>
      <div id="msg" class="msg"></div>
      <button type="submit" id="submitBtn">Başvur</button>
    </form>
    <div class="footer-link">Zaten onaylı bir hesabınız var mı? <a href="/login">Giriş yapın</a></div>
  </div>

<script>
const form = document.getElementById('signupForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';
  msg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Gönderiliyor…';
  try {
    const r = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || 'Başvuru başarısız');
    msg.textContent = data.message || 'Başvurunuz alındı, admin onayı bekleniyor.';
    msg.className = 'msg success';
    msg.style.display = 'block';
    form.reset();
    btn.textContent = 'Başvuru Alındı ✓';
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'msg error';
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Başvur';
  }
});
</script>
