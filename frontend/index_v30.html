  // Catmull-Rom → kübik Bezier dönüşümü: düz çizgi yerine yumuşak eğri
  // (premium grafik dili — ekonbulten.html referansı, 2026-09-10). pts
  // boşluklu (null atlanmış) noktalardan oluşur, gerilim 1/6 sabiti.
  // Monoton kübik interpolasyon (Fritsch–Carlson): eğri veri noktalarını yumuşakça birleştirir
  // ama iki nokta arasında değerin dışına taşmaz (Catmull-Rom'daki sahte tepe/çukur yok).
  function smoothPathFromPoints(pts) {
    var n = pts.length;
    if (n === 0) return '';
    if (n === 1) return 'M' + pts[0].x + ',' + pts[0].y;
    var dx = [], m = [], t = [], i;
    for (i = 0; i < n - 1; i++) {
      dx[i] = (pts[i + 1].x - pts[i].x) || 1e-6;
      m[i] = (pts[i + 1].y - pts[i].y) / dx[i];
    }
    t[0] = m[0]; t[n - 1] = m[n - 2];
    for (i = 1; i < n - 1; i++) t[i] = (m[i - 1] * m[i] <= 0) ? 0 : (m[i - 1] + m[i]) / 2;
    for (i = 0; i < n - 1; i++) {
      if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
      var a = t[i] / m[i], b = t[i + 1] / m[i], k = a * a + b * b;
      if (k > 9) { var tau = 3 / Math.sqrt(k); t[i] = tau * a * m[i]; t[i + 1] = tau * b * m[i]; }
    }
    var d = 'M' + pts[0].x + ',' + pts[0].y + ' ';
    for (i = 0; i < n - 1; i++) {
      var h3 = dx[i] / 3;
      d += 'C' + (pts[i].x + h3) + ',' + (pts[i].y + t[i] * h3) + ' ' +
           (pts[i + 1].x - h3) + ',' + (pts[i + 1].y - t[i + 1] * h3) + ' ' +
           pts[i + 1].x + ',' + pts[i + 1].y + ' ';
    }
    return d;
  }
  // Dolu zemin üzerinde okunur yazı rengi (WCAG göreli parlaklık).
  function readableOn(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return '#fff';
    var v = parseInt(m[1], 16), c = [v >> 16 & 255, v >> 8 & 255, v & 255].map(function(x) {
      x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
    });
    return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) > 0.45 ? '#0f1f2f' : '#fff';
  }
  function smoothAreaPath(pts, bottomY) {
    if (pts.length < 2) return '';
    return smoothPathFromPoints(pts) +
      ' L' + pts[pts.length - 1].x + ',' + bottomY +
      ' L' + pts[0].x + ',' + bottomY + ' Z';
  }

          h('span', { className: 'tv-bolum-sayi' + (secili ? ' var' : '') }, secili ? secili + ' / ' + toplam : String(toplam)),
          h('span', { className: 'tv-bolum-ok', 'aria-hidden': 'true' }, ikon('asagi', 14))),

    function katla(t) {
      return String(t || '').toLocaleLowerCase('tr-TR').replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u')

    var q = katla(araSt[0]);
    var allBanks = props.allBanks.filter(function(b){ return !q || katla(b).indexOf(q) >= 0; });
    var allGroups = DATA.meta.group_order.filter(function(g){ return !q || katla(EN ? g + ' ' + cevir(g) : g).indexOf(q) >= 0; });
    var katilim = allBanks.filter(function(b){ return bankTypeMap[b] === 'Katılım'; });
    var mevduat = allBanks.filter(function(b){ return bankTypeMap[b] !== 'Katılım'; });
    function cip(b) {

      }, h('span', { className: 'tv-cip-nokta', 'aria-hidden': 'true' }), b);

    // PDF özet şeridi için seçimlerin düz metni (bkz. pdfKontrolOzeti → data-ozet)

      : gorunenBanka.join(', ')]);
    if (selection.groups.length) ozet.push(['Gruplar', selection.groups.join(', ')]);
    (props.ozetEk || []).forEach(function(p){ ozet.push(p); });
    // Kompozisyon sekmesi de bu paneli kullanır (2026-10-03): başlık ve erişilebilir ad parametreli.
    return h('aside', { className: 'trend-controls tv-panel' + (panelAcik ? '' : ' kapali'), ref: props.controlsRef, 'aria-label': props.ariaLabel || 'Trend serileri' },
      h('div', { className: 'tv-ozet-veri', hidden: true, 'data-ozet': JSON.stringify(ozet) }),
      h('div', { className: 'tv-panel-ust' },
        h('button', { type: 'button', className: 'tv-panel-baslik tv-panel-toggle', 'aria-expanded': panelAcik,
          title: panelAcik ? 'Paneli daralt' : 'Paneli genişlet', onClick: function(){ panelSt[1](!panelAcik); } },
          h('span', null, props.baslik || 'Seriler'),
          h('span', { className: 'tv-panel-ok' + (panelAcik ? ' acik' : ''), 'aria-hidden': 'true' }, ikon('asagi', 15))),
        h('span', { className: 'tv-panel-sayi' }, (selection.banks.length + selection.groups.length) + ' seçili'),
        (selection.banks.length + selection.groups.length) > 0 && h('button', {
          type: 'button', className: 'tv-link', onClick: function(){ setSelection({ banks: [], groups: [] }); }
        }, 'Temizle')
      ),
      panelAcik && h('div', { className: 'tv-ara-kutu' },
        h('input', { className: 'tv-ara', type: 'search', placeholder: 'Banka veya grup ara…', value: araSt[0],
                     'aria-label': 'Banka veya grup ara', onChange: function(e){ araSt[1](e.target.value); } })),
      panelAcik && h('div', { className: 'tv-akordeon' },
        bolum('katilim', 'Katılım bankaları', katilim.length ? katilim.map(cip) : null,
              katilim.filter(function(b){ return selection.banks.indexOf(b) >= 0; }).length, katilim.length),
        bolum('mevduat', 'Mevduat bankaları', mevduat.length ? mevduat.map(cip) : null,
              mevduat.filter(function(b){ return selection.banks.indexOf(b) >= 0; }).length, mevduat.length),
        allBanks.length === 0 && h('div', { className: 'tv-bos' }, 'Eşleşen banka yok'),
        bolum('grup', 'Banka grupları', allGroups.length ? allGroups.map(function(g) {
            var sel = selection.groups.indexOf(g) >= 0;
            return h('button', { key: g, type: 'button', 'aria-pressed': sel,
              className: 'chip group-style tv-cip tv-cip-grup' + (sel ? ' selected' : ''),

              h('span', { className: 'tv-cip-nokta tv-cip-kesik', 'aria-hidden': 'true' }), groupLabelShort(g));
          }) : null,

  }

  function TrendView(props) {
    var isMobile = useIsMobileChart();
    var svgWrapRef = useRef(null);
    var controlsRef = useRef(null);
    var measure = DATA.catalog.filter(function(m){return m.id === props.activeMeasure;})[0];
    if (!measure) return h('div', { className:'empty-state' }, 'Ölçü seçin');

    var isRasyo = measure.tip === 'rasyo';
    // Yalnız ölçünün verisi olan dönemler (veri olmayan yıllar eksen/seçicilerde yer almaz).
    var allDates = olcuVeriTarihleri(measure.id);

    // Hover tooltip state — hangi tarih index'inin üzerindeyiz
    var hoverState = useState(null);  // null veya { i: number, x: number, y: number }
    var hoverIdx = hoverState[0];
    var setHoverIdx = hoverState[1];
    var svgRef = useRef(null);
    useTouchDismiss(!!(hoverIdx && hoverIdx.touch), svgWrapRef, function(){ setHoverIdx(null); });

    // 2026-09-08: seçimler App'te tutuluyor (props.ui) — sekme değiştirip
    // geri dönüldüğünde sıfırlanmasın diye. Trend ve Kompozisyon KENDİ
    // seçimlerini ayrı ayrı hatırlar (kullanıcı kararı).
    var ui = props.ui;
    function patchUi(patch) {
      props.setUi(function(prev){ return Object.assign({}, prev, patch); });
    }

    var selection = ui.selection;

    // Görünüm modu: value | ytd | yoy | qoq | ms
    // Rasyolarda sadece 'value' geçerli; diğer modlar disabled.
    var viewMode = ui.viewMode;
    function setViewMode(v) { patchUi({ viewMode: v }); }
    // Rasyo seçilirse mode'u value'ya zorla
    var effectiveMode = isRasyo ? 'value' : viewMode;

    // Yılsonu modu
    var yearEnd = ui.yearEnd;

    var range = ui.range;
    function setRange(v) { patchUi({ range: v }); }
    // Ölçü değişince aralık, ölçünün veri dönemlerine çekilir.
    useEffect(function() {
      var ilk = allDates[0], son = allDates[allDates.length - 1];
      var ns = range.start, ne = range.end;
      if (allDates.indexOf(ns) < 0) ns = allDates.filter(function(d){ return d >= ns; })[0] || ilk;
      if (allDates.indexOf(ne) < 0) { var oncekiler = allDates.filter(function(d){ return d <= ne; }); ne = oncekiler.length ? oncekiler[oncekiler.length - 1] : son; }
      if (ns > ne) { ns = ilk; ne = son; }
      if (ns !== range.start || ne !== range.end) setRange({ start: ns, end: ne });
    }, [measure.id]);

    // Yılsonu toggle değiştiğinde range'i de uyarla
    useEffect(function() {
      if (yearEnd) {
        // Range'in start ve end'ini en yakın yıl sonuna çek
        var yEnds = allDates.filter(function(d){ return d.endsWith('-12-31'); });
        if (yEnds.length === 0) return;
        var newStart = range.start;
        var newEnd = range.end;
        if (!newStart.endsWith('-12-31')) {
          // Range.start'a en yakın geriye gidip 12-31 bul
          var sy = parseInt(newStart.split('-')[0]);
          var candidate = (sy - 1) + '-12-31';
          while (yEnds.indexOf(candidate) < 0 && sy > 2010) {
            sy--; candidate = (sy - 1) + '-12-31';
          }
          newStart = yEnds.indexOf(candidate) >= 0 ? candidate : yEnds[0];
        }
        if (!newEnd.endsWith('-12-31')) {
          var ey = parseInt(newEnd.split('-')[0]);
          var candE = (ey - 1) + '-12-31';
          while (yEnds.indexOf(candE) < 0 && ey > 2010) {
            ey--; candE = (ey - 1) + '-12-31';
          }
          newEnd = yEnds.indexOf(candE) >= 0 ? candE : yEnds[yEnds.length - 1];
        }
        if (newStart !== range.start || newEnd !== range.end) {
          setRange({ start: newStart, end: newEnd });
        }
      }
    }, [yearEnd]);


    // filteredDates: kullanıcı aralığı + yılsonu filtresi
    var startIdx = allDates.indexOf(range.start);
    var endIdx = allDates.indexOf(range.end);
    if (startIdx < 0) startIdx = 0;
    if (endIdx < 0) endIdx = allDates.length - 1;
    if (startIdx > endIdx) { var tmp = startIdx; startIdx = endIdx; endIdx = tmp; }
    var rawFiltered = allDates.slice(startIdx, endIdx + 1);
    var filteredDates = yearEnd
      ? rawFiltered.filter(function(d){ return d.endsWith('-12-31'); })
      : rawFiltered;

    var series = [];
    selection.banks.forEach(function(b) {
      if (bankaGizli(b)) return;   // görünümden çıkarıldı
      var vals = filteredDates.map(function(d){
        return trendValue(measure.id, b, d, effectiveMode, false);
      });
      series.push({ name: b, type:'bank', color: bankColor(b), textColor: bankTextColor(b), values: vals });
    });
    selection.groups.forEach(function(g) {
      var vals = filteredDates.map(function(d){
        return trendValue(measure.id, g, d, effectiveMode, true);
      });
      var color = DATA.meta.group_colors[g] || '#559D87';
      series.push({ name: g + ' (grup toplamı)', type:'group', color: color, textColor: darkSafeColor(color), values: vals, dashed: true });
    });

    var many_ok = filteredDates.length <= 14 && series.length <= 6;   // kısa aralık + az seride tüm noktalar işaretlenir
    var W = 1000, H = 420;
    // padR 80 -> 200 (2026-09-08): seri adları artık sol üstteki lejantta
    // değil, çizginin bittiği yerde değerin yanında yazılıyor.
    var padL = 60, padR = 200, padT = 30, padB = 50;
    // Sağ pay çizgi sonu etiketlerinin en uzununa göre (tek seride boşuna 200 birim ayrılmaz)
    var etiketKar = 0;
    series.forEach(function(s) {
      var kn = groupLabelShort(s.name.replace(' (grup toplamı)', ''));
      etiketKar = Math.max(etiketKar, Math.min(kn.length, 22) + 8);
    });
    padR = Math.max(120, Math.min(210, Math.round(etiketKar * 6.4 + 30)));
    // Mobil: viewBox telefon genişliğine yakın (≈1 birim = 1 px), seri
    // adları çizgi sonunda değil grafiğin altındaki lejantta.
    var FS = 10;
    if (isMobile) { W = 330; H = 360; padL = 54; padR = 10; padT = 14; padB = 30; FS = 12.5; }
    var chartW = W - padL - padR;
    var chartH = H - padT - padB;

    var allVals = [];
    series.forEach(function(s){
      s.values.forEach(function(v){ if (v != null) allVals.push(v); });
    });

    var noData = allVals.length === 0;
    var min, max, range_v, scale, stepX;
    if (!noData) {
      min = Math.min.apply(null, allVals);
      max = Math.max.apply(null, allVals);
      var dataMin = min;
      range_v = max - min || 1;
      min = min - range_v * 0.08;
      max = max + range_v * 0.08;
      // 2026-09-08: tüm değerler pozitifken eksen NEGATİFE inmesin. Alt pay
      // (%8) dar aralıklı serilerde tabanı sıfırın altına itebiliyordu —
      // "eksi büyüklük" diye bir şey olmadığı için yanıltıcıydı. Tabanı 0'a
      // kırpıyoruz; veri zaten sıfırdan uzaksa eksen veriye yakın kalır,
      // yani dar bantlı rasyolarda trend farkı ezilmez.
      if (dataMin >= 0 && min < 0) min = 0;
      range_v = max - min;
      stepX = filteredDates.length > 1 ? chartW / (filteredDates.length - 1) : chartW;
      scale = function(v){ return padT + chartH - ((v - min) / range_v) * chartH; };
    }

    // Y ekseni format: mode'a göre değişir
    // - 'value' + büyüklük → mn/mlr/T
    // - 'value' + rasyo   → measure birimine göre (%, kat, TL, adet)
    // - 'ytd'/'yoy'/'qoq'/'ms' → her zaman % (bunlar DEĞİŞİM oranları,
    //   measure'ın kendi biriminden bağımsızdır)
    var isValueMode = (effectiveMode === 'value');
    var isPercentMode = !isValueMode || isRasyo;
    function formatY(v) {
      if (isValueMode && isRasyo) return fmtMeasure(v, measure, 1);
      if (isPercentMode) return fmtPct(v, 1);
      var abs = Math.abs(v);
      if (abs >= 1e12) return ond((v/1e12).toFixed(1)) + 'T';
      if (abs >= 1e9) return (v/1e9).toFixed(0) + B_MLR;
      if (abs >= 1e6) return (v/1e6).toFixed(0) + ' mn';
      return fmtNum(v, 0);
    }
    function formatFinal(v) {
      if (isValueMode && isRasyo) return fmtMeasure(v, measure, 2);
      if (isPercentMode) return fmtPctPlain(v, 1);
      var abs = Math.abs(v);
      if (abs >= 1e12) return ond((v/1e12).toFixed(2)) + 'T';
      if (abs >= 1e9) return (v/1e9).toFixed(0) + B_MLR;
      if (abs >= 1e6) return (v/1e6).toFixed(0) + ' mn';
      return fmtNum(v, 0);
    }

    // Çizgi sonu etiketleri (2026-09-08): her serinin son geçerli noktasında
    // "Ad  Değer" yazar — eskiden sol üstte duran ve grafiğin içini kapatan
    // lejantın yerini alır. Aynı hizaya düşen etiketler üst üste binmesin
    // diye dikeyde en az 15px ayrıştırılır; kaydırılan etiket ince bir bağ
    // çizgisiyle kendi veri noktasına bağlanır.
    // X ekseni tarih etiketleri (2026-09-08): eskiden sabit "her N'inci"
    // (N = uzunluk/10) kuralı vardı; 16-19 dönemlik aralıklarda etiketler
    // üst üste biniyor, ayrıca "son dönemi her zaman yaz" kuralı sondan bir
    // önceki etiketle çakışabiliyordu. Artık kaç etiketin sığdığı çizim
    // genişliğinden hesaplanıyor ve etiketler SONdan geriye doğru eşit
    // aralıkla seçiliyor — en güncel dönem her zaman yazılır, aralar eşit.
    var xTickIdx = [];
    if (!noData) {
      var LBL_W = isMobile ? 54 : 46;    // "Haz 2026" ~10px fontta yaklaşık genişlik (viewBox birimi)
      var MIN_GAP = 14;
      var maxTicks = Math.max(2, Math.floor(chartW / (LBL_W + MIN_GAP)));
      var tickStep = Math.max(1, Math.ceil(filteredDates.length / maxTicks));
      for (var ti = filteredDates.length - 1; ti >= 0; ti -= tickStep) xTickIdx.push(ti);
      xTickIdx.reverse();
    }

    var endLabels = [];
    var etiketAralik = 20;
    if (!noData && !isMobile) {
      series.forEach(function(s) {
        var idx = -1;
        for (var li = s.values.length - 1; li >= 0; li--) {
          if (s.values[li] != null) { idx = li; break; }
        }
        if (idx < 0) return;
        // Grup serilerinde "(grup toplamı)" eki etiketi gereksiz uzatıyor;
        // çizgi zaten kesikli, tam ad tooltip'te görünüyor. "KT Hariç
        // Katılım Bankaları" 22 karakteri aşıp "…" ile çirkin kesiliyordu
        // (kullanıcı isteği, 2026-09-17) — kısa etiket haritasıyla düzeltildi.
        var shortName = s.name.replace(' (grup toplamı)', '');
        shortName = groupLabelShort(shortName);
        if (shortName.length > 22) shortName = shortName.slice(0, 21) + '…';
        var py = scale(s.values[idx]);
        endLabels.push({
          name: s.name, color: s.textColor, banka: s.type === 'bank' ? s.name : null,
          x: padL + idx * stepX + 8,
          pointY: py, y: py,
          label: shortName + '  ' + formatFinal(s.values[idx])
        });
      });
      var byX = {};
      endLabels.forEach(function(L) { (byX[L.x] = byX[L.x] || []).push(L); });
      Object.keys(byX).forEach(function(k) {
        var arr = byX[k].sort(function(a, b){ return a.y - b.y; });
        // Çok seride (ör. PDF'te "İlk 20 Banka") aralık grafiğin yüksekliğine sığacak kadar daralır.
        var aralik = Math.min(20, chartH / Math.max(1, arr.length - 1));
        etiketAralik = Math.min(etiketAralik, aralik);
        // 1) yukarıdan aşağı: çakışanları aşağı it
        for (var i = 1; i < arr.length; i++) {
          if (arr[i].y - arr[i - 1].y < aralik) arr[i].y = arr[i - 1].y + aralik;
        }
        // 2) alt sınırı aştıysa aşağıdan yukarı yalnız sıkışan kısmı geri it (üstteki boşluklar korunur)
        var alt = padT + chartH;
        if (arr[arr.length - 1].y > alt) {
          arr[arr.length - 1].y = alt;
          for (var j = arr.length - 2; j >= 0; j--) {
            if (arr[j + 1].y - arr[j].y < aralik) arr[j].y = arr[j + 1].y - aralik;
          }
        }
        if (arr[0].y < padT) {
          var shift = padT - arr[0].y;
          arr.forEach(function(L){ L.y += shift; });
        }
      });
    }

    var allBanks = banksByAssetSize(
      DATA.meta.banks.map(function(b){ return b.banka_adi; })
        .filter(function(b){ return bankShownForMeasure(measure.id, b, props.tarih) && !bankaGizli(b); }));  // şube ölçüsünde şubesiz banka / çıkarılan banka listelenmez

    var chartTitle = measure.ad + ' — ' + (bazAktif(measure) && effectiveMode !== 'ms' ? bazOnEk(measure) + ' ' : '') +
                     trendModeLabel(effectiveMode) + ' Trend';
    function downloadPng() {
      downloadChartPng(svgRef.current, {

  // ===============================================================
  // EXPORT VIEW
  // ===============================================================
  // Hierarchik measure tree, banka/grup multi-select, tarih aralığı.
  // Tablo formatı: Wide (Banka × Tarih satır, Measure'lar kolon).
  // Excel export: SheetJS (XLSX), CSV fallback de mevcut.

  // Sayı formatlayıcı: tip ve birim'e göre
  function fmtExportValue(value, measure) {
    if (value === null || value === undefined) return null;
    if (typeof value !== 'number' || isNaN(value)) return null;
    if (measure.tip === 'rasyo') {
      var dp = exportDecimals(measure);
      return value.toLocaleString(LOCALE, { minimumFractionDigits: dp, maximumFractionDigits: dp });
    }
    // büyüklük: Türkçe binlik formatı (nokta ile)
    return Math.round(value).toLocaleString(LOCALE);
  }

  // Sayı formatlayıcı (Excel için): raw number ya da null
  function rawExportValue(value, measure) {
    if (value === null || value === undefined) return null;
    if (typeof value !== 'number' || isNaN(value)) return null;
    if (measure.tip === 'rasyo') return Number(value.toFixed(4));
    return Math.round(value);
  }

  // Rasyo birimi kat (çarpan) ise değişimler bps'le okunduğu için 4 hane,
  // yüzde/TL rasyolarında 2 hane.
  function exportDecimals(measure) {
    return measure.birim === 'kat' ? 4 : 2;
  }
  // Kolon başlığındaki birim — eskiden her rasyo "(%)" yazıyordu, kat ve
  // birim başına TL oranları da yüzde görünüyordu.
  function exportUnitLabel(m) {
    if (m.tip === 'rasyo') return ' (' + birimLabel(m) + ')';
    if (m.birim === 'TL') return ' (TL)';
    if (m.birim === 'adet') return ' (Adet)';
    return m.birim ? ' (' + m.birim + ')' : '';
  }

    var selectedGroups = selectedGroupsState[0];
    var setSelectedGroups = selectedGroupsState[1];

    // Tarih aralığı (date string olarak)
    var dates = DATA.meta.dates;
    var dateStartState = useState(dates[Math.max(0, dates.length - 8)]);  // son 8 dönem default
    var dateStart = dateStartState[0];
    var setDateStart = dateStartState[1];

    var dateEndState = useState(dates[dates.length - 1]);
    var dateEnd = dateEndState[0];
    var setDateEnd = dateEndState[1];

    // Seçili measure'lar: {measure_id: true}
    var selectedMeasuresState = useState(function(){ return {}; });
    var selectedMeasures = selectedMeasuresState[0];
    var setSelectedMeasures = selectedMeasuresState[1];

    // Tree expanded nodes
    var expandedState = useState(function(){
      var e = {};
      // Masaüstünde kategoriler açık başlar; dar ekranda ağaç kendi kutusunda
      // kaymadığı için (iç içe kaydırma yok) 160 ölçü sayfayı çok uzatıyordu
      // — orada kapalı başlar, arama yapınca eşleşenler zaten açılır.
      var acik = window.innerWidth > 900;
      DATA.catalog.forEach(function(m){
        e['cat:' + m.kategori] = acik;
      });
      return e;
    });
    var expanded = expandedState[0];
    var setExpanded = expandedState[1];

    // Tree filtre/arama
    var treeFilterState = useState('');
    var treeFilter = treeFilterState[0];
    var setTreeFilter = treeFilterState[1];

    // Generated table data
    var tableState = useState(null);  // null | { rows, measures, totalRows, displayedRows }
    var table = tableState[0];
    var setTable = tableState[1];

    // ----------------------------------------------------
    // HİYERARŞİ
    // ----------------------------------------------------
    // NOT (2026-09-17): useMemo([]) İDİ — bkz. ControlBar'daki aynı düzeltme
    // notu; Özel Ölçüler yüzünden DATA.catalog sayfa açıldıktan sonra da
    // değişebiliyor, boş deps'li memoization bunu hiç yakalamıyordu.
    var hierarchy = (function(){
      var h = {};
      DATA.catalog.forEach(function(m){
        var k = m.kategori;
        var s = m.alt_kategori || 'Genel';
        if (!h[k]) h[k] = { _order: [], _measures: 0, _available: 0 };
        if (!h[k][s]) { h[k][s] = []; h[k]._order.push(s); }
        h[k][s].push(m);
        h[k]._measures++;
        if (DATA.bank_data[m.id]) h[k]._available++;
      });
      return h;
    })();

    // Available measure id'leri (bank_data içinde olanlar)
    var availableIds = (function(){
      var s = {};
      DATA.meta.available_measures.forEach(function(id){ s[id] = true; });
      return s;
    })();

    // Filtre uygulanan tree
    var filteredTree = useMemo(function(){
      if (!treeFilter) return null;
      var q = treeFilter.toLowerCase().trim();
      // Eşleşen measure id'lerini topla
      var matches = {};
      DATA.catalog.forEach(function(m){
        if (m.ad.toLowerCase().indexOf(q) !== -1 || m.id.toLowerCase().indexOf(q) !== -1) {
          matches[m.id] = true;
        }
      });
      return matches;
    }, [treeFilter]);

    // ----------------------------------------------------
    // ENTITY HELPERS
    // ----------------------------------------------------
    // Bankalar: aktif büyüklüğüne göre, odak banka başta (2026-10-04). Grup pseudo-kayıtları hariç.
    var allBankNames = banksByAssetSize(DATA.meta.banks.filter(function(b){ return b.tur !== 'Grup'; })
      .map(function(b){ return b.banka_adi; }));
    // Gruplar: kayıtlı gruplar + dışa aktarıma özel kombinasyonlar (Tüm Bankalar, İlk 20 Banka, Rakip Bankalar + odak;
    // değerleri group_data'da, bkz. pipeline/groups.py::export_grup_adlari). Bankalar sekmesinde yalnız bankalar var.
    var exportGrupAdlari = (DATA.meta.export_groups || []).filter(function(g){ return !!DATA.group_data && hasGroupData(g); });
    function hasGroupData(g) {
      var gd = DATA.group_data || {};
      return Object.keys(gd).some(function(mid){ return gd[mid] && gd[mid][g]; });
    }
    // TEK gruplar listesi (kayıtlı + birleşik, tekrarsız). Odak bankanın tek üyeli grubu ('Kuveyt Türk') bankalar
    // listesindeki bankayla aynı şey olduğu için alınmaz. Gruplar ve bankalar AYNI seçimde birlikte seçilebilir.
    var GRUP_SIRASI = ['Tüm Bankalar', 'İlk 20 Banka', 'Katılım Bankaları', 'Mevduat Bankaları', 'Rakip Bankalar'];
    var allGroupNames = (function() {
      var tum = DATA.meta.group_order.concat(exportGrupAdlari).filter(function(g, i, a){ return a.indexOf(g) === i && g !== KT_NAME; });
      var oncelik = GRUP_SIRASI.filter(function(g){ return tum.indexOf(g) >= 0; });
      return oncelik.concat(tum.filter(function(g){ return oncelik.indexOf(g) < 0; }));
    })();

    // Fonksiyonel güncelleme: art arda hızlı tıklamalarda önceki seçim ezilmez
    function toggleBank(name) {
      setSelectedBanks(function(prev) {
        var n = Object.assign({}, prev);
        if (n[name]) delete n[name]; else n[name] = true;
        return n;
      });
    }
    function toggleGroup(name) {
      setSelectedGroups(function(prev) {
        var n = Object.assign({}, prev);
        if (n[name]) delete n[name]; else n[name] = true;
        return n;
      });
    }

    function quickSelectBanks(action) {
      if (action === 'all') {
        var all = {};
        allBankNames.forEach(function(b){ all[b] = true; });
        setSelectedBanks(all);
      } else if (action === 'none') {
        setSelectedBanks({});
      }
    }
    function temizleVarliklar() { setSelectedBanks({}); setSelectedGroups({}); }

    // ----------------------------------------------------
    // TREE — CASCADE LOGIC
    // ----------------------------------------------------
    function getCategoryAvailableMeasures(kategori) {
      var hr = hierarchy[kategori];
      if (!hr) return [];
      var out = [];
      hr._order.forEach(function(s){
        hr[s].forEach(function(m){
          if (availableIds[m.id]) out.push(m.id);
        });
      });
      return out;
    }
    function getSubCategoryAvailableMeasures(kategori, alt) {
      var ms = (hierarchy[kategori] && hierarchy[kategori][alt]) || [];
      return ms.filter(function(m){ return availableIds[m.id]; }).map(function(m){ return m.id; });
    }

    function categoryCheckState(kategori) {
      var ids = getCategoryAvailableMeasures(kategori);
      if (ids.length === 0) return 'unchecked';
      var checked = ids.filter(function(id){ return selectedMeasures[id]; }).length;
      if (checked === 0) return 'unchecked';
      if (checked === ids.length) return 'checked';
      return 'indeterminate';
    }
    function subCategoryCheckState(kategori, alt) {
      var ids = getSubCategoryAvailableMeasures(kategori, alt);
      if (ids.length === 0) return 'unchecked';
      var checked = ids.filter(function(id){ return selectedMeasures[id]; }).length;
      if (checked === 0) return 'unchecked';
      if (checked === ids.length) return 'checked';
      return 'indeterminate';
    }

    function toggleCategory(kategori) {
      var ids = getCategoryAvailableMeasures(kategori);
      var n = Object.assign({}, selectedMeasures);
      var allChecked = ids.every(function(id){ return n[id]; });
      ids.forEach(function(id){
        if (allChecked) delete n[id];
        else n[id] = true;
      });
      setSelectedMeasures(n);
    }
    function toggleSubCategory(kategori, alt) {
      var ids = getSubCategoryAvailableMeasures(kategori, alt);
      var n = Object.assign({}, selectedMeasures);
      var allChecked = ids.every(function(id){ return n[id]; });
      ids.forEach(function(id){
        if (allChecked) delete n[id];
        else n[id] = true;
      });
      setSelectedMeasures(n);
    }
    function toggleMeasure(id) {
      var n = Object.assign({}, selectedMeasures);
      if (n[id]) delete n[id]; else n[id] = true;
      setSelectedMeasures(n);
    }
    function toggleExpand(key) {
      var n = Object.assign({}, expanded);
      n[key] = !n[key];
      setExpanded(n);
    }

    function clearAllMeasures() {
      setSelectedMeasures({});
    }

    // ----------------------------------------------------
    // GENERATE TABLE
    // ----------------------------------------------------
    // Seçili varlıklar: önce gruplar (listedeki sırayla), sonra bankalar (aktif büyüklüğü sırasıyla)
    var selectedEntities = allGroupNames.filter(function(g){ return selectedGroups[g]; }).map(function(g){ return { ad: g, tip: 'grup' }; })
      .concat(allBankNames.filter(function(b){ return selectedBanks[b]; }).map(function(b){ return { ad: b, tip: 'banka' }; }));
    var selectedEntityNames = selectedEntities.map(function(e){ return e.ad; });
    var nGrup = allGroupNames.filter(function(g){ return selectedGroups[g]; }).length;
    var nBanka = selectedEntityNames.length - nGrup;
    var selectedMeasureIds = Object.keys(selectedMeasures);
    var dateStartIdx = dates.indexOf(dateStart);
    var dateEndIdx = dates.indexOf(dateEnd);
    var dateRangeValid = dateStartIdx >= 0 && dateEndIdx >= 0 && dateStartIdx <= dateEndIdx;
    var canGenerate = selectedEntityNames.length > 0
      && selectedMeasureIds.length > 0 && dateRangeValid;

    var validationMsg = '';
    if (selectedEntityNames.length === 0) validationMsg = 'En az bir banka/grup seçin';
    else if (selectedMeasureIds.length === 0) validationMsg = 'En az bir kalem seçin';
    else if (!dateRangeValid) validationMsg = 'Geçersiz tarih aralığı';

    function generateTable() {
      if (!canGenerate) return;

      // Tarih aralığında düşen tüm dönemler
      var dateRange = dates.slice(dateStartIdx, dateEndIdx + 1);

      // Seçili measure'ların catalog metadata'sı (kolonlarda göstermek için)
      var measureMeta = selectedMeasureIds.map(function(id){
        return DATA.catalog.filter(function(m){ return m.id === id; })[0];
      }).filter(Boolean);
      // Catalog sırasında olsun (kategori → alt_kat → ad)
      measureMeta.sort(function(a, b){
        if (a.kategori !== b.kategori) {
          var ko = ['Bilanço', 'Gelir Tablosu', 'Şube & Personel'];
          return ko.indexOf(a.kategori) - ko.indexOf(b.kategori);
        }
        var sa = a.alt_kategori || 'zz', sb = b.alt_kategori || 'zz';
        if (sa !== sb) return sa.localeCompare(sb, 'tr');
        return a.ad.localeCompare(b.ad, 'tr');
      });

      // Veri kaynağı: bankalar için bank_data (düz sayı), gruplar için
      // group_data ({value} nesnesi) — ikisi farklı biçimde, bu yüzden
      // doğrudan okumak yerine bankVal/groupVal kullanılır (grup modunda
      // tüm hücreler "—" çıkıyordu).
      // Bir seçimde hem gruplar hem bankalar olabilir: değer kaynağı varlığın türüne göre seçilir.

      // Satırları oluştur (Banka/Grup × Tarih)
      var rows = [];
      selectedEntities.forEach(function(ent){
        var entity = ent.ad, getVal = ent.tip === 'banka' ? bankVal : groupVal;
        dateRange.forEach(function(d){
          var row = { entity: entity, tip: ent.tip, tarih: d, values: {} };
          var hasAny = false;
          measureMeta.forEach(function(m){
            var v = getVal(m.id, entity, d);
            if (v !== null && v !== undefined) hasAny = true;
            row.values[m.id] = v == null ? null : v;
          });
          // Tüm hücreler boşsa satırı atla (banka o dönemde yok)
          if (hasAny) rows.push(row);
        });
      });

      var maxDisplay = 1000;
      setTable({
        rows: rows,
        displayedRows: rows.slice(0, maxDisplay),
        measures: measureMeta,
        totalRows: rows.length,
        clipped: rows.length > maxDisplay,
        nGrup: nGrup, nBanka: nBanka
      });
    }

    function clearTable() { setTable(null); }

    // Tek sütunlu (mobil/dar) düzende tablo uzun filtre sütununun ALTINDA
    // çıkıyor — "Tabloyu Oluştur"a basınca hiçbir şey olmamış gibi
    // görünüyordu. Tablo oluşunca sonuca kaydır.
    var resultRef = useRef(null);
    useEffect(function() {
      if (!table || !resultRef.current || window.innerWidth > 900) return;
      resultRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, [table]);

    // ----------------------------------------------------
    // EXPORT
    // ----------------------------------------------------
    function buildExportArray(includeAll) {
      if (!table) return [];
      var headers = [cevir('Banka / Grup'), cevir('Tarih')];
      table.measures.forEach(function(m){
        headers.push(m.ad + cevir(exportUnitLabel(m)));
      });
      var aoa = [headers];
      var src = includeAll ? table.rows : table.displayedRows;
      src.forEach(function(r){
        var line = [r.tip === 'banka' ? r.entity : cevir(r.entity), r.tarih];
        table.measures.forEach(function(m){
          line.push(rawExportValue(r.values[m.id], m));
        });
        aoa.push(line);
      });
      return aoa;
    }

    function downloadXLSX() {
      if (!table) return;
      loadXlsx().then(writeXlsx, function(e){ window.alert(cevir(e.message) + cevir(' — CSV olarak indirebilirsiniz.')); });
    }
    function writeXlsx() {
      var aoa = buildExportArray(true);
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      // Kolon genişlikleri
      var colWidths = [{ wch: 22 }, { wch: 12 }];
      table.measures.forEach(function(m){
        colWidths.push({ wch: Math.min(Math.max(m.ad.length + 6, 14), 36) });
      });
      ws['!cols'] = colWidths;
      ws['!freeze'] = { xSplit: 2, ySplit: 1 };
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, EN ? 'Data' : 'Veri');
      // Metadata sheet
      var metaAoa = [
        ['Rapor', 'Kuveyt Türk Rakip Analizi — Veri Dışa Aktarma'],
        ['Oluşturulma', new Date().toLocaleString(LOCALE)],
        ['Tarih aralığı', dateStart + ' → ' + dateEnd],
        ['Banka sayısı', table.nBanka],
        ['Grup sayısı', table.nGrup],
        ['Kalem sayısı', table.measures.length],
        ['Toplam satır', table.totalRows],
      ].map(function(r){ return r.map(cevir); });
      var wsMeta = XLSX.utils.aoa_to_sheet(metaAoa);
      wsMeta['!cols'] = [{ wch: 18 }, { wch: 50 }];
      XLSX.utils.book_append_sheet(wb, wsMeta, EN ? 'Info' : 'Bilgi');
      var fname = (EN ? 'Kuveyt_Turk_Peer_Analysis_' : 'Kuveyt_Turk_Rakip_Analizi_') + new Date().toISOString().slice(0, 10) + '.xlsx';
      XLSX.writeFile(wb, fname);
    }

    function downloadCSV() {
      if (!table) return;
      var aoa = buildExportArray(true);
      // Türkçe Excel için ; ayraç + ondalık virgül; İngilizcede , ayraç + ondalık nokta. UTF-8 BOM.
      var sep = EN ? ',' : ';';
      var lines = aoa.map(function(row){
        return row.map(function(c){
          if (c === null || c === undefined) return '';
          var s = String(c);
          // Sayılarda virgül kullan (Türk Excel için)
          if (typeof c === 'number') s = ond(s);
          if (s.indexOf(sep) >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) {
            s = '"' + s.replace(/"/g, '""') + '"';
          }
          return s;
        }).join(sep);
      });
      var csv = '\uFEFF' + lines.join('\n');
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = (EN ? 'Kuveyt_Turk_Peer_Analysis_' : 'Kuveyt_Turk_Rakip_Analizi_') + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ----------------------------------------------------
    // RENDER — TREE NODE
    // ----------------------------------------------------
    function renderMeasureNode(m) {
      var isAvail = !!availableIds[m.id];
      var isFiltered = filteredTree && !filteredTree[m.id];
      if (isFiltered) return null;
      var checked = !!selectedMeasures[m.id];
      var tipBadge = m.tip === 'rasyo' ? '%' : '#';
      return h('div', {
        key: m.id,
        className: 'tree-node-row' + (isAvail ? '' : ' disabled'),
        onClick: function(e){
          e.stopPropagation();
          if (isAvail) toggleMeasure(m.id);
        }
      },
        h('span', { className: 'tree-toggle-icon' }, ''),
        h('input', {
          type: 'checkbox', className: 'tree-checkbox',
          checked: checked, disabled: !isAvail,
          onChange: function(){},  // controlled by row click
          onClick: function(e){ e.stopPropagation(); if (isAvail) toggleMeasure(m.id); }
        }),
        h('span', { className: 'tree-label' }, m.ad),
        h('span', { className: 'tree-counter' }, tipBadge + (isAvail ? '' : ' • veri yok'))
      );
    }

    function renderSubCategoryNode(kategori, alt) {
      var key = 'sub:' + kategori + ':' + alt;
      var ms = hierarchy[kategori][alt];

      // Filter: sub-kategoride hiç eşleşme yoksa gizle
      if (filteredTree) {
        var anyMatch = ms.some(function(m){ return filteredTree[m.id]; });
        if (!anyMatch) return null;
      }

      var isExpanded = expanded[key] !== false;
      // Filtre varsa otomatik aç
      if (filteredTree) isExpanded = true;
      var st = subCategoryCheckState(kategori, alt);
      var availCount = ms.filter(function(m){ return availableIds[m.id]; }).length;
      var selCount = ms.filter(function(m){ return selectedMeasures[m.id]; }).length;

      return h('div', { key: key, className: 'tree-node' },
        h('div', { className: 'tree-node-row', onClick: function(){ toggleExpand(key); } },
          h('span', { className: 'tree-toggle-icon' }, isExpanded ? '▼' : '▶'),
          h('input', {
            type: 'checkbox', className: 'tree-checkbox',
            checked: st === 'checked',
            ref: function(el){ if (el) el.indeterminate = (st === 'indeterminate'); },
            onChange: function(){},
            onClick: function(e){ e.stopPropagation(); toggleSubCategory(kategori, alt); }
          }),
          h('span', { className: 'tree-label subcat' }, alt),
          h('span', { className: 'tree-counter' }, selCount + '/' + availCount)
        ),
        isExpanded && h('div', { className: 'tree-children' },
          ms.map(function(m){ return renderMeasureNode(m); })
        )
      );
    }

    function renderCategoryNode(kategori) {
      var key = 'cat:' + kategori;

      // Filter: kategoride hiç eşleşme yoksa gizle
      if (filteredTree) {
        var hr = hierarchy[kategori];
        var anyMatch = false;
        hr._order.forEach(function(s){
          hr[s].forEach(function(m){ if (filteredTree[m.id]) anyMatch = true; });
        });
        if (!anyMatch) return null;
      }

      var isExpanded = expanded[key] !== false;
      if (filteredTree) isExpanded = true;
      var st = categoryCheckState(kategori);
      var totalMeasures = hierarchy[kategori]._available;
      var selCount = 0;
      hierarchy[kategori]._order.forEach(function(s){
        hierarchy[kategori][s].forEach(function(m){
          if (selectedMeasures[m.id]) selCount++;
        });
      });

      return h('div', { key: key, className: 'tree-node' },
        h('div', { className: 'tree-node-row', onClick: function(){ toggleExpand(key); } },
          h('span', { className: 'tree-toggle-icon' }, isExpanded ? '▼' : '▶'),
          h('input', {
            type: 'checkbox', className: 'tree-checkbox',
            checked: st === 'checked',
            ref: function(el){ if (el) el.indeterminate = (st === 'indeterminate'); },
            onChange: function(){},
            onClick: function(e){ e.stopPropagation(); toggleCategory(kategori); }
          }),
          h('span', { className: 'tree-label cat' }, kategori),
          h('span', { className: 'tree-counter' }, selCount + '/' + totalMeasures)
        ),
        isExpanded && h('div', { className: 'tree-children' },
          hierarchy[kategori]._order.map(function(s){
            return renderSubCategoryNode(kategori, s);
          })
        )
      );
    }

    // ----------------------------------------------------
    // RENDER — SIDEBAR (2026-10-04: adımlı kartlar + canlı özet çubuğu)
    // ----------------------------------------------------
    var satirTahmini = selectedEntityNames.length * (dateRangeValid ? (dateEndIdx - dateStartIdx + 1) : 0);
    var adim1Tamam = selectedEntityNames.length > 0, adim2Tamam = dateRangeValid, adim3Tamam = selectedMeasureIds.length > 0;
    function adimBas(no, tamam, baslik, sayi, sag) {
      return h('div', { className: 'xp-adim-bas' },
        h('span', { className: 'xp-no' + (tamam ? ' tamam' : '') }, tamam ? '✓' : String(no)),
        h('span', { className: 'xp-baslik' }, baslik),
        sayi != null && h('span', { className: 'xp-sayi' }, sayi),
        sag);
    }
    function hazirDonem(n) {
      var a = dates[n == null ? 0 : Math.max(0, dates.length - n)], b = dates[dates.length - 1];
      return { a: a, b: b, aktif: dateStart === a && dateEnd === b, uygula: function() { setDateStart(a); setDateEnd(b); } };
    }
    var HAZIR_DONEMLER = [['Son 4Ç', 4], ['Son 8Ç', 8], ['Son 12Ç', 12], ['Tümü', null]];
    function varlikCip(ad, secili, tikla, banka) {
      return h('button', { key: ad, type: 'button', 'aria-pressed': !!secili,
        className: 'export-chip xp-cip' + (secili ? ' active' : ''), onClick: tikla,
        onContextMenu: banka ? function(e){ bankaMenusu(e, ad); } : undefined },
        banka ? bankMono(ad) : h('span', { className: 'xp-grup-nokta', 'aria-hidden': 'true' }, ikon('grup', 12)),
        h('span', null, ad));
    }
    var sidebar = h('div', { className: 'export-sidebar xp-yan' },
      // 1 — Gruplar ve bankalar (TEK seçim: grup + banka birlikte seçilebilir; satırlar seçim sırasıyla gelir)
      h('section', { className: 'xp-kart' },
        adimBas(1, adim1Tamam, 'Gruplar ve bankalar', selectedEntityNames.length + ' seçili',
          selectedEntityNames.length > 0 && h('button', { type: 'button', className: 'xp-link', onClick: temizleVarliklar }, 'Temizle')),
        h('div', { className: 'xp-alt-baslik xp-ilk' }, 'Gruplar',
          h('span', { className: 'xp-ipucu' }, 'toplam değerleri; bankalarla birlikte seçilebilir')),
        h('div', { className: 'export-chips xp-gruplar' }, allGroupNames.map(function(g){
          return varlikCip(g, selectedGroups[g], function(){ toggleGroup(g); }, false);
        })),
        h('div', { className: 'xp-alt-baslik' }, 'Bankalar',
          h('span', { className: 'xp-ipucu' }, 'aktif büyüklüğüne göre'),
          h('button', { type: 'button', className: 'xp-link', onClick: function(){ quickSelectBanks(nBanka === allBankNames.length ? 'none' : 'all'); } },
            nBanka === allBankNames.length ? 'Hiçbirini seçme' : 'Hepsini seç')),
        h('div', { className: 'export-chips' }, allBankNames.map(function(b){
          return varlikCip(b, selectedBanks[b], function(){ toggleBank(b); }, true);
        }))
      ),

      // 2 — Dönem
      h('section', { className: 'xp-kart' },

  // Asistan Türkçe kalır (İngilizce sürüm kapsamı dışında): bu bileşenler çevirisiz h kullanır.
  function chatInline(text, keyBase) {
    var h = _ce;
    var parts = String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
    return parts.map(function(p, i) {
      if (/^\*\*[^*]+\*\*$/.test(p)) return h('strong', { key: keyBase + i }, p.slice(2, -2));
      if (/^`[^`]+`$/.test(p)) return h('code', { key: keyBase + i }, p.slice(1, -1));
      return p;
    });
  }
  function chatTableCells(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function(c){ return c.trim(); });
  }
  function chatMarkdown(text) {
    var h = _ce;
    var lines = String(text || '').split('\n');
    var out = [], i = 0, k = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if (/^\s*\|/.test(line)) {
        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        var body = rows.filter(function(r){ return !/^\s*\|?\s*:?-{2,}/.test(r); }).map(chatTableCells);
        if (!body.length) continue;
        var head = body[0];
        out.push(h('div', { key: 'b' + (k++), className: 'chat-table-wrap' },
          h('table', { className: 'chat-table' },
            h('thead', null, h('tr', null, head.map(function(c, j){ return h('th', { key: j }, chatInline(c, 'h' + j)); }))),
            h('tbody', null, body.slice(1).map(function(r, ri) {
              return h('tr', { key: ri }, r.map(function(c, j){ return h('td', { key: j }, chatInline(c, 'c' + j)); }));
            })))));
        continue;
      }
      if (/^\s*([-*•]|\d+[.)])\s+/.test(line)) {
        var numbered = /^\s*\d+[.)]\s+/.test(line), items = [];
        while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*•]|\d+[.)])\s+/, '')); i++;
        }
        out.push(h(numbered ? 'ol' : 'ul', { key: 'b' + (k++) },
          items.map(function(t, j){ return h('li', { key: j }, chatInline(t, 'l' + j)); })));
        continue;
      }
      if (/^#{1,4}\s+/.test(line)) {
        out.push(h('h4', { key: 'b' + (k++) }, chatInline(line.replace(/^#{1,4}\s+/, ''), 'hd')));
        i++; continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^\s*(\||[-*•]\s|\d+[.)]\s|#{1,4}\s)/.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      if (!para.length) { para.push(line); i++; }
      out.push(h('p', { key: 'b' + (k++) }, chatInline(para.join(' '), 'p')));
    }
    return out;
  }

  function ChatPanel(props) {

      else if (ev.type === 'tool') sonuGuncelle(function(m){

          h('div', { className: 'chat-head-sub' }, 'Veri bulma ve ölçü oluşturma')),
        msgs.length > 0 && h('button', { onClick: yeniSohbet, title: 'Sohbeti temizle' }, 'Yenile'),
        h('button', { onClick: function(){ openState[1](false); }, title: 'Kapat', 'aria-label': 'Kapat' }, '✕')
      ),
      h('div', { className: 'chat-body', ref: bodyRef },
        // Karşılama (2026-10-04): yalnız "Merhaba" ile başlayan, neler yapabildiğini anlatan metin
        msgs.length === 0 && h('div', { className: 'chat-intro' },
          h('p', null, h('b', null, 'Merhaba!'), ' Ben KT Rakip Analizi asistanıyım. Bankacılık verisinde şunlarda yardımcı olabilirim:'),
          h('ul', null,
            h('li', null, h('b', null, 'Veri sorgulama:'), ' herhangi bir banka, grup ve dönem için ölçü değerleri, sıralamalar ve değişimler.'),
            h('li', null, h('b', null, 'Karşılaştırma ve analiz:'), ' odak bankayı gruplarla ve rakiplerle kıyaslama; kârlılık, marj, aktif kalitesi, verimlilik, fonlama ve sermaye başlıklarında sürücüler ve çıkarımlar.'),
            h('li', null, h('b', null, 'Ölçü oluşturma:'), ' tarif ettiğiniz formülü taslak ölçüye çevirme (kaydetmeyi siz onaylarsınız).'),
            h('li', null, h('b', null, 'Ekranı yönetme:'), ' bir ölçüyü Anında Görünüm ya da Trend\'de açma.'),
            can('asistan_dis_veri') && h('li', null, h('b', null, 'Dış veri:'), ' TCMB EVDS makro serileri (faiz, kur, enflasyon vb.).')),
          h('p', null, 'Rakamlar doğrudan panodaki veriden okunur. Sorunuzu aşağıya yazabilirsiniz.')),
        msgs.map(function(m, mi) {
          if (m.role === 'user') return h('div', { key: mi, className: 'chat-msg user' }, m.content);
          return h('div', { key: mi, className: 'chat-msg assistant' },
            h(AsistanAdimlari, { m: m, onToggle: function(){ adimlariAc(mi); } }),
            (m.drafts || []).map(function(d, di) {
              return h(ChatDraftCard, { key: di, draft: d, savedId: (m.savedIds || {})[di],
                onSaved: function(id){ taslakKaydedildi(mi, di, id); },
                onOpen: function(id){ props.openView(id, 'snapshot', null); } });
            }),
            // Yanıt, hazırlık bitince bütün olarak gösterilir (yazılırken parça parça akmaz)
            !m.pending && m.content ? chatMarkdown(m.content) : null,
            m.error && h('div', { className: 'chat-err' }, '⚠️ ' + m.error));
        })
      ),
      h('div', { className: 'chat-foot' },
        h('textarea', {
          className: 'chat-input', rows: 1, value: inputState[0], maxLength: 2000,
          placeholder: 'Sorunuzu yazın…', 'aria-label': 'Mesaj',
          onInput: function(e){ inputState[1](e.target.value); },
          onKeyDown: function(e) {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); gonder(inputState[0]); }
          },
        }),
        busyState[0]
          ? h('button', { className: 'pw-btn ghost chat-send', onClick: durdur }, 'Durdur')
          : h('button', { className: 'pw-btn primary chat-send', disabled: !inputState[0].trim(),
              onClick: function(){ gonder(inputState[0]); } }, 'Gönder')
      ),
      h('div', { className: 'chat-disclaimer' },
        'Yanıtlar yapay zeka ile üretilir; önemli kararlarda panodaki değerleri kontrol edin.')
    );
  }

  // ===============================================================
  // APP
  // ===============================================================
  function App() {
    // Görünümden çıkarılan bankalar değişince tüm görünüm yeniden çizilir; sağ tık menüsünün konumu.
    var bazTick = useState(0);
    _bazDinleyici = function(){ bazTick[1](function(n){ return n + 1; }); };
    var haricTick = useState(0);
    _haricDinleyici = function(){ haricTick[1](function(n){ return n + 1; }); };
    var bankaMenuSt = useState(null);
    _bankaMenuAc = bankaMenuSt[1];
    var themeState = useState('light');
    var theme = themeState[0];
    var setTheme = themeState[1];
    // Senkron global bayrak — darkSafeColor()'ın 'document.body.classList'
    // yerine bunu okuması için. Sebep: body.className, theme state'ine göre
    // bir useEffect içinde güncelleniyor (render SONRASI); aynı render
    // turunda document.body.classList okumak bir adım geriden geliyordu
    // (örn. karanlık moda geçince Rakip Bankalar kartlarındaki CAGR
    // yazıları bir tık sonrasına kadar eski/karanlıkta-okunmaz renkte
    // kalıyordu). Bu satır App'in HER render'ında, çocuklar render
    // edilmeden ÖNCE senkron çalışır — React burada legacy/senkron
    // ReactDOM.render kullandığı için child bileşenler aynı JS çağrı
    // yığınında hemen ardından render edilir.
    window.__KT_DARK__ = (theme === 'dark');

    var modeState = useState('snapshot');
    // Rolde kapalı sekme açılamaz (görünüm/PDF kısayolları dahil): Anlık Görünüm'e düşer (2026-10-09)
    var mode = (modeState[0] === 'trend' && !can('sekme_trend')) || (modeState[0] === 'composition' && !can('sekme_kompozisyon'))
      ? 'snapshot' : modeState[0];
    var setMode = modeState[1];

    var tarihState = useState(DATA.meta.default_date || DATA.meta.dates[DATA.meta.dates.length - 1]);
    var tarih = tarihState[0];
    var setTarih = tarihState[1];

    var defaultMeasure = DATA.meta.available_measures.indexOf('toplam_aktifler') >= 0
      ? 'toplam_aktifler'
      : DATA.meta.available_measures[0];
    var mState = useState(defaultMeasure);
    var activeMeasure = mState[0];
    // ⇄ Önceki ölçüye dön (2026-09-29, kullanıcı isteği: "iki grafik arasında
    // hızlı gidip gelme"). Ölçü her değiştiğinde bir öncekini hatırlar;
    // ControlBar'daki ⇄ butonu ya da Q tuşu ikisi arasında geçiş yapar.
    var prevMeasureState = useState(null);
    var prevMeasure = prevMeasureState[0];
    function setActiveMeasure(id) {
      if (!id || id === activeMeasure) return;
      prevMeasureState[1](activeMeasure);
      mState[1](id);
    }
    function swapMeasure() {
      if (prevMeasure && DATA.catalog.some(function(m){ return m.id === prevMeasure; })) {
        setActiveMeasure(prevMeasure);
      }
    }
    useEffect(function() {
      function onKey(e) {
        if (e.key !== 'q' && e.key !== 'Q') return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        var t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
        swapMeasure();
      }
      document.addEventListener('keydown', onKey);
      return function(){ document.removeEventListener('keydown', onKey); };
    });

    // Aktif kompozisyon (Kompozisyon modu)
    var compState = useState('aktif');
    var activeComposition = compState[0];
    var setActiveComposition = compState[1];

    // 2026-09-08: Trend ve Kompozisyon sekmelerinin seçimleri BURADA tutulur.
    // Eskiden her görünüm kendi useState'ini kullanıyordu; sekme değişince
    // bileşen unmount olduğu için tüm seçimler (banka/grup, dönem, görünüm
    // modu, yılsonu) varsayılana dönüyordu. İki sekme kendi seçimini AYRI
    // tutar — biri diğerini etkilemez (kullanıcı kararı).
    var trendUiState = useState(function() {
      var d = DATA.meta.dates;
      var endIdx = d.length - 1;
      var startIdx = Math.max(0, endIdx - 11);
      return {
        selection: { banks: [KT_NAME], groups: [] },
        viewMode: 'value',
        yearEnd: false,
        range: { start: d[startIdx], end: d[endIdx] }
      };
    });
    var compUiState = useState(function() {
      var d = DATA.meta.dates;
      return {
        subTab: 'bilesen',
        selection: { banks: [KT_NAME], groups: [] },
        selectedDates: d.slice(Math.max(0, d.length - 4))
      };
    });

    // Oturumdaki kullanıcının admin rolü var mı (2026-08-12) — topbar'da
    // "Admin Panel" linkini sadece role='admin' kullanıcılara göstermek için.
    // AYNI kontrol periyodik (5 dk'da bir) tekrarlanır: sayfa açık kalırken
    // oturum sessizce sona ererse (çerez süresi dolarsa) — /api/data zaten
    // yüklendiği için başka hiçbir fetch tetiklenmez, kullanıcı fark etmeden
    // "canlı ama aslında oturumu kapanmış" bir sayfada kalabilirdi. Bu
    // kontrol 401 görürse otomatik /login'e yönlendirir (2026-08-12 eklendi,
    // kullanıcı isteği).
    var isAdminState = useState(canAnyAdmin);
    var isAdmin = isAdminState[0];
    var setIsAdmin = isAdminState[1];
    useEffect(function() {
      function checkSession() {
        fetch('/api/me', { credentials: 'same-origin' })
          .then(function(r) {
            if (r.status === 401) { window.location.href = '/login'; return null; }
            return r.ok ? r.json() : null;
          })
          .then(function(me) {
            if (me) setIsAdmin((me.izinler || []).some(function(p){ return p.indexOf('admin_') === 0; }));
          })
          .catch(function() {});
      }
      checkSession();
      var intervalId = setInterval(checkSession, 5 * 60 * 1000);
      return function() { clearInterval(intervalId); };
    }, []);

    useEffect(function() {
      document.body.className = theme === 'dark' ? 'dark' : '';
    }, [theme]);

    // Özel ölçüler DATA nesnesi üzerinde YERİNDE değiştiği için (bkz.
    // injectCustomMeasures), bu bileşenlerin bunu görmesi için React'e
    // "bir şey değişti" demek gerekiyor — refreshTick'i artırmak, altındaki
    // TÜM ağacı normal re-render'a zorluyor (2026-09-17, kullanıcı isteği:
    // Ölçü Oluştur / Görünümlerim).
    var refreshTickState = useState(0);
    function bumpRefresh() { refreshTickState[1](function(n){ return n + 1; }); }

    // Asistan: sunucuda anahtar tanımlıysa görünür (/api/chat/status).
    var chatEnabledState = useState(false);
    useEffect(function() {
      fetch('/api/chat/status', { credentials: 'same-origin' })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){ if (j && j.enabled) chatEnabledState[1](true); })
        .catch(function() {});
    }, []);
    // Asistanın "görünüm aç" komutu: ölçü + sekme (+ dönem).
    function openView(measureId, viewMode, date) {
      if (!DATA.catalog.some(function(m){ return m.id === measureId; })) return;
      setActiveMeasure(measureId);
      setMode(viewMode === 'trend' ? 'trend' : 'snapshot');
      if (date && DATA.meta.dates.indexOf(date) >= 0) setTarih(date);
    }

    // PDF: tarayıcının yazdırma penceresi ("PDF olarak kaydet") + @media print
    // düzeni. Koyu temada yazdırılan sayfa okunmaz olacağı için yazdırma
    // süresince açık temaya geçilir, pencere kapanınca geri dönülür.
    function printPage() {
      var wasDark = theme === 'dark';
      if (wasDark) {
        setTheme('light');
        window.addEventListener('afterprint', function restore() {
          window.removeEventListener('afterprint', restore);
          setTheme('dark');
        });
      }
      setTimeout(function(){ window.print(); }, wasDark ? 200 : 0);
    }
    // PDF (2026-09-30): ekrandaki görünümün resmiyle doğrudan .pdf üretir
    // (exportElementPdf). Koyu temada çıktı açık temada alınır. Kütüphane
    // yüklenemezse (ör. cdnjs engelli) yazdırma penceresine düşer.
    var pdfBusyState = useState(false);
    var pdfModalState = useState(false);
    // Aktif ölçü/kompozisyonun verisi olan dönemler: tarih seçici yalnız bunları sunar; seçili tarih bu
    // dönemlerden biri değilse en yakın önceki (yoksa ilk) veri dönemine çekilir.
    var availDates = (mode === 'composition') ? kompVeriTarihleri(activeComposition)
                   : (mode === 'snapshot' || mode === 'trend') ? olcuVeriTarihleri(activeMeasure) : null;
    useEffect(function() {
      if (!availDates || !availDates.length || availDates.indexOf(tarih) >= 0) return;
      var onceki = availDates.filter(function(d){ return d <= tarih; });
      setTarih(onceki.length ? onceki[onceki.length - 1] : availDates[0]);
    }, [mode, activeMeasure, activeComposition, tarih]);
    function viewTitle() {
      if (mode === 'composition') return ((DATA.meta.compositions[activeComposition] || {}).ad || 'Kompozisyon');
      return ((DATA.catalog.filter(function(m){ return m.id === activeMeasure; })[0] || {}).ad || '');
    }
    // Çok sayfalı PDF (2026-10-01): kullanıcı önce ölçüleri/kompozisyonları ve görünümleri seçer
    // (PdfExportModal), sonra seçilenlerin her biri TEK sayfa olacak şekilde PDF üretilir. Görünümler
    // sırayla ekranda açılıp yakalanır, bitince kullanıcının önceki görünümü geri yüklenir. Seçili
    // dönemde verisi olmayan ölçüler/kompozisyonlar atlanır (sahte "0" sayfası üretilmez).
    var pdfProgressState = useState(null);
    var pdfSonucState = useState(null);
    function bekle(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }
    function bekleSakinles(maxMs) {   // ana panelin yüksekliği ardışık ölçümlerde değişmeyene kadar bekler
      return new Promise(function(resolve) {
        var t0 = Date.now(), son = -1, sabit = 0;
        (function dene() {
          var el0 = document.querySelector('.main-panel'), hh = el0 ? el0.scrollHeight : 0;
          sabit = (hh === son) ? sabit + 1 : 0; son = hh;
          if (sabit >= 3 || Date.now() - t0 > maxMs) resolve(); else setTimeout(dene, 180);
        })();
      });
    }
    function runPdfExport(secim) {
      if (pdfBusyState[0]) return;
      var wasDark = theme === 'dark';
      var onceki = { mode: mode, measure: activeMeasure, comp: activeComposition, tarih: tarih,
                     trend: trendUiState[0], komp: compUiState[0] };
      // PDF kapsamı (2026-10-02): panelde seçilen dönem ve banka sınıfı. Görünümler PDF süresince bu
      // döneme/sınıfa alınır, bitince kullanıcının ekranı eski hâline döner.
      var donem = secim.tarih || tarih;
      var sinif = secim.bankaSinifi || 'all';
      var sinifAd = pdfSinifAdi(sinif);
      var bugun = new Date().toLocaleDateString(LOCALE);
      var kaynak = 'Kaynak: BDDK solo finansal tablolar';
      var tasks = [], atlanan = [];
      if (gizliBankalar().length) kaynak += '  ·  Görünümden çıkarılan: ' + gizliBankalar().join(', ');
      if (BAZ.tur === 'reel') kaynak += '  ·  TÜFE: TCMB (2025=100)';
      if (BAZ.tur === 'usd') kaynak += '  ·  USD/TRY: TCMB döviz alış';
      function ortak(ek) { return Object.assign({ dateLabel: bugun, source: kaynak }, ek); }
      function gorunumuAc(hazirla) {
        return function() { hazirla(); return bekle(150).then(function(){ return bekleSakinles(5000); }); };
      }
      // Trend aralığı: kullanıcının aralık uzunluğu korunur, bitiş seçilen döneme kayar.
      var tumTarih = DATA.meta.dates;
      var trUi = trendUiState[0];
      var trUzun = Math.max(1, tumTarih.indexOf(trUi.range.end) - tumTarih.indexOf(trUi.range.start));
      var trBit = tumTarih.indexOf(donem);
      var trBas = Math.max(0, trBit - trUzun);
      var pdfTrendUi = Object.assign({}, trUi, {
        range: { start: tumTarih[trBas], end: donem },
        selection: { banks: sinif === 'ozel' ? banksByAssetSize((secim.ozelBankalar || []).slice()) : sinifBankalari(sinif, donem), groups: [] }
      });
      var pdfKompUi = Object.assign({}, compUiState[0], {
        selectedDates: tumTarih.slice(Math.max(0, trBit - 3), trBit + 1)
      });
      var trendEtiket = tarihLabelShort(tumTarih[trBas]) + ' – ' + tarihLabelShort(donem);
      function bazEtiketi(m) { return bazAktif(m) ? (BAZ.tur === 'usd' ? 'USD bazında' : 'Reel TL (' + bazAciklama() + ')') : null; }
      secim.measures.forEach(function(mid) {
        var m = DATA.catalog.filter(function(x){ return x.id === mid; })[0];
        if (!m) return;
        var kat = [m.kategori, m.alt_kategori].filter(Boolean).join(' · ');
        if (secim.snapshot) {
          if (olcuVeriTarihleri(mid).indexOf(donem) < 0) atlanan.push(m.ad + ' (' + tarihLabel(donem) + ')');
          else tasks.push({
            prepare: gorunumuAc(function(){ setMode('snapshot'); mState[1](mid); }),
            opts: ortak({ title: m.ad, eyebrow: [kat, 'Anlık Görünüm', sinif !== 'all' ? sinifAd : null, bazEtiketi(m)].filter(Boolean).join('  ·  '),
                          period: tarihLabel(donem) })
          });
        }
        if (secim.trend) tasks.push({
          prepare: gorunumuAc(function(){ setMode('trend'); mState[1](mid); }),
          opts: ortak({ title: m.ad, eyebrow: [kat, 'Trend', sinif !== 'all' ? sinifAd : null, bazEtiketi(m)].filter(Boolean).join('  ·  '),
                        period: trendEtiket })
        });
      });
      secim.comps.forEach(function(cid) {
        var c = DATA.meta.compositions[cid];
        if (!c) return;
        if (kompVeriTarihleri(cid).indexOf(donem) < 0) { atlanan.push(c.ad + ' (' + tarihLabel(donem) + ')'); return; }
        tasks.push({
          prepare: gorunumuAc(function(){ setMode('composition'); setActiveComposition(cid); }),
          opts: ortak({ title: c.ad, eyebrow: [c.kategori || 'Kompozisyon', 'Kompozisyon'].join('  ·  '), period: tarihLabel(donem) })
        });
      });
      if (!tasks.length) { pdfSonucState[1]({ hata: 'Seçimdeki ölçüler için ' + tarihLabel(donem) + ' döneminde veri yok.', atlanan: atlanan }); return; }
      pdfBusyState[1](true); pdfSonucState[1](null); pdfProgressState[1]({ i: 0, n: tasks.length });
      if (wasDark) setTheme('light');
      PDF_FILTRE.mod = sinif === 'all' ? null : sinif;
      PDF_FILTRE.set = null;
      if (sinif === 'ozel') { PDF_FILTRE.set = {}; (secim.ozelBankalar || []).forEach(function(b){ PDF_FILTRE.set[b] = true; }); }
      setTarih(donem);
      trendUiState[1](pdfTrendUi);
      compUiState[1](pdfKompUi);
      var ad = tasks.length === 1 ? tasks[0].opts.title + ' ' + donem : 'Rakip Analizi ' + donem + ' (' + tasks.length + ' sayfa)';
      bekle(wasDark ? 300 : 120).then(function() {
        return exportDeckPdf(tasks, 'Kuveyt Türk Rakip Analizi - ' + ad, function(i, n){ pdfProgressState[1]({ i: i, n: n }); });
      }).then(function(thumbs) {
        pdfSonucState[1]({ ok: true, sayfa: tasks.length, atlanan: atlanan, onizleme: thumbs || [] });
      }, function(err) {
        pdfSonucState[1]({ hata: 'PDF oluşturulamadı: ' + (err && err.message ? err.message : 'bilinmeyen hata'), atlanan: atlanan });
      }).then(function() {
        PDF_FILTRE.mod = null; PDF_FILTRE.set = null;
        // doğrudan setter: setActiveMeasure eski (bayat) aktif ölçüyle karşılaştırıp işlemsiz kalabilir
        setMode(onceki.mode); mState[1](onceki.measure); setActiveComposition(onceki.comp);
        setTarih(onceki.tarih); trendUiState[1](onceki.trend); compUiState[1](onceki.komp);
        if (wasDark) setTheme('dark');
        pdfProgressState[1](null); pdfBusyState[1](false);
      });
    }

    return h('div', null,
      h(TopBar, {
        theme: theme, setTheme: setTheme,
        tarih: tarih, setTarih: setTarih,
        activeMeasure: activeMeasure, setActiveMeasure: setActiveMeasure,
        mode: mode, setMode: setMode,
        activeComposition: activeComposition,
        availDates: availDates,
        isAdmin: isAdmin,
        onDataChanged: bumpRefresh,
        onPrint: function(){ if (!pdfBusyState[0]) pdfModalState[1](true); }, pdfBusy: pdfBusyState[0]
      }),
      h(ControlBar, {
        mode: mode, setMode: setMode,
        activeMeasure: activeMeasure,
        setActiveMeasure: setActiveMeasure,
        prevMeasure: prevMeasure, swapMeasure: swapMeasure,
        activeComposition: activeComposition,
        setActiveComposition: setActiveComposition
      }),
      h(GizliBankaSeridi, null),
      // Yalnız PDF/yazdırma çıktısında görünen başlık (bkz. @media print).
      h('div', { className: 'print-header' },
        h('b', null, 'Kuveyt Türk Rakip Analizi — ' + (
          mode === 'composition' ? ((DATA.meta.compositions[activeComposition] || {}).ad || 'Kompozisyon')
          : ((DATA.catalog.filter(function(m){ return m.id === activeMeasure; })[0] || {}).ad || ''))),
        h('span', null, (mode === 'trend' ? '' : tarihLabel(tarih) + ' · ') +
          'Yazdırma: ' + new Date().toLocaleDateString(LOCALE))
      ),
      h('div', { className: 'main-panel' },
        mode === 'snapshot' ? h(SnapshotView, { activeMeasure: activeMeasure, tarih: tarih }) :
        mode === 'trend'    ? h(TrendView, { activeMeasure: activeMeasure, tarih: tarih,
                                             ui: trendUiState[0], setUi: trendUiState[1] }) :
        mode === 'export'   ? (can('export_veri') ? h(ExportView, null) : h(SnapshotView, { activeMeasure: activeMeasure, tarih: tarih })) :
        mode === 'my-view'  ? h(MyViewMode, { tarih: tarih }) :
                              h(CompositionView, { activeComposition: activeComposition, tarih: tarih,
                                                   ui: compUiState[0], setUi: compUiState[1] })
      ),
      pdfModalState[0] && h(PdfExportModal, {
        onClose: function(){ if (!pdfBusyState[0]) { pdfModalState[1](false); pdfSonucState[1](null); } },
        busy: pdfBusyState[0], progress: pdfProgressState[0], sonuc: pdfSonucState[0],
        onRun: runPdfExport, tarih: tarih,
        trendBankalar: trendUiState[0].selection.banks,
        current: { mode: mode, measure: activeMeasure, comp: activeComposition }
      }),
      bankaMenuSt[0] && h(BankaBaglamMenusu, {
        key: bankaMenuSt[0].banka + bankaMenuSt[0].x + ',' + bankaMenuSt[0].y,
        menu: bankaMenuSt[0], onClose: function(){ bankaMenuSt[1](null); }
      }),
      chatEnabledState[0] && h(ChatPanel, {
        ekran: { measure_id: activeMeasure, tarih: tarih, mode: mode },
        openView: openView,
        onDataChanged: bumpRefresh,
      })
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  } // bootstrapApp sonu

  // v30: API'den veriyi cek, sonra bootstrap calistir
  // 401 (giris yapilmamis / onaysiz uye) -> /login'e yonlendir (2026-08-12,
  // uyelik sistemi eklendi, /api/data artik auth gerektiriyor).
  // Kullanıcı bazlı odak banka (2026-10-02): kullanıcının odağı admin varsayılanından farklıysa
  // sunucu küçük bir yama döner (değişen gruplar + meta); ortak veri üzerine uygulanır.
  function odakKatmaniUygula(DATA, k) {
    if (!k || !k.meta || !k.meta.focus_bank) return;
    var kaldir = k.kaldirilan || [];
    Object.assign(DATA.meta, k.meta);
    function grupYamasi(hedef, yama) {
      if (!hedef) return;
      Object.keys(hedef).forEach(function(id) {
        var g = hedef[id];
        if (!g) return;
        var grupKap = g.group ? g.group : g;     // composition/currency: {bank, group}; group_data: {grup: …}
        kaldir.forEach(function(ad){ delete grupKap[ad]; });
      });
      Object.keys(yama || {}).forEach(function(id) {
        if (!hedef[id]) return;
        var grupKap = hedef[id].group ? hedef[id].group : hedef[id];
        Object.assign(grupKap, yama[id]);
      });
    }
    grupYamasi(DATA.group_data, k.group_data);
    grupYamasi(DATA.composition_data, k.composition_group);
    grupYamasi(DATA.currency_data, k.currency_group);
  }

  fetch('/api/data', {credentials: 'same-origin'})
    .then(function(r) {
      if (r.status === 401) {
        window.location.href = '/login';
        throw new Error('Giris gerekiyor, yonlendiriliyor...');
      }
      if (!r.ok) throw new Error('HTTP ' + r.status + ' - yetkisiz veya sunucu hatasi');
      return r.json();
    })
    .then(function(DATA) {
      // Özel ölçüler/görünümler ayrı, kullanıcıya özel uçlardan gelir
      // (2026-09-17) — bunlar başarısız olsa bile ana dashboard'u
      // engellememek için ayrı catch ile boş listeye düşer.
      function safeJson(url, fallback) {
        return fetch(url, {credentials: 'same-origin'})
          .then(function(r){ return r.ok ? r.json() : fallback; })
          .catch(function(){ return fallback; });
      }
      return Promise.all([
        safeJson('/api/my/measures', {measures: []}),
        safeJson('/api/my/views', {views: []}),
        safeJson('/api/measure-info', {}),
        safeJson('/api/me', {}),
        safeJson('/api/odak-katman', {}),
        safeJson('/api/bos-nedenleri', {})
      ]).then(function(results) {
        DATA.__me = results[3] || {};
        odakKatmaniUygula(DATA, results[4]);
        DATA.__customMeasures = results[0].measures || [];
        DATA.__savedViews = results[1].views || [];
        DATA.measureInfo = results[2] || {};
        DATA.bosNeden = results[5] || {};
        injectCustomMeasures(DATA, DATA.__customMeasures);
        bootstrapApp(DATA);
      });
    })
    .catch(function(err) {
      var root = document.getElementById('root');
      root.innerHTML = '<div style="padding:40px;font-family:system-ui,sans-serif;color:#c0392b;text-align:center;max-width:600px;margin:60px auto;border:1px solid #fadbd8;border-radius:8px;background:#fef5f4"><h2 style="margin:0 0 12px">Veri yuklenemedi</h2><p style="margin:0;color:#5d2a26">' + err.message + '</p><p style="margin:16px 0 0;font-size:13px;color:#888">Lutfen sayfayi yenileyin veya yoneticinize basvurun.</p></div>';
      console.error('[KT Cockpit] /api/data fetch hatasi:', err);
    });

})();
</script>
</body>
</html>
