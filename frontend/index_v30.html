  // ===============================================================
  // CONTROL BAR: Mode toggle + 3 cascade dropdowns
  // ===============================================================
  function ControlBar(props) {
    // Measure arama durumu (2026-08-17) — tüm kategorilerde ölçü adına göre ara,
    // seçince aktif ölçü değişir (kategori/alt-kategori ondan türediği için
    // dropdown'lar da otomatik güncellenir).
    var searchState = useState('');
    var query = searchState[0], setQuery = searchState[1];
    var focusState = useState(false);
    var focused = focusState[0], setFocused = focusState[1];

    // Measure'lar üzerinden kategori/alt-kategori hiyerarşisini kur
    var available = {};
    DATA.meta.available_measures.forEach(function(m){ available[m] = true; });

    function normTr(s) { return (s || '').toLocaleLowerCase('tr'); }
    var q = normTr(query.trim());
    var searchResults = q.length >= 1
      ? DATA.catalog.filter(function(m){ return normTr(m.ad).indexOf(q) >= 0; }).slice(0, 40)
      : [];

    function pickMeasure(m) {
      if (!available[m.id]) return;
      props.setActiveMeasure(m.id);
      setQuery('');
      setFocused(false);
    }

    // Hiyerarşi
    // NOT (2026-09-17): useMemo([]) İDİ — DATA.catalog artık Özel Ölçüler
    // yüzünden sayfa açıldıktan SONRA da yerinde değişebiliyor (bkz.
    // injectCustomMeasures); boş deps dizisiyle memoize edilince yeni/
    // silinmiş/güncellenmiş özel ölçüler bu hiyerarşiye hiç yansımıyordu.
    // Liste ~170 öğe, her render'da yeniden kurmak ölçülemeyecek kadar
    // ucuz — memoization'dan tamamen vazgeçildi.
    var hierarchy = (function() {
      var hr = {};
      DATA.catalog.forEach(function(m) {
        if (!hr[m.kategori]) hr[m.kategori] = {};
        var sub = m.alt_kategori || 'Genel';
        if (!hr[m.kategori][sub]) hr[m.kategori][sub] = [];
        hr[m.kategori][sub].push(m);
      });
      return hr;
    })();

    // Aktif measure'dan current kategori ve alt_kategori çıkar
    var activeMeasureObj = DATA.catalog.filter(function(m){return m.id === props.activeMeasure;})[0];
    var curKategori = activeMeasureObj ? activeMeasureObj.kategori : Object.keys(hierarchy)[0];
    var curAltKategori = activeMeasureObj ? (activeMeasureObj.alt_kategori || 'Genel') : null;

    var kategoriList = Object.keys(hierarchy);
    var altKategoriList = Object.keys(hierarchy[curKategori] || {});
    var measureList = (hierarchy[curKategori] && hierarchy[curKategori][curAltKategori]) || [];

    function onKategoriChange(newK) {
      // Yeni kategorideki ilk alt_kategori'nin ilk available measure'una git
      var subs = Object.keys(hierarchy[newK]);
      for (var i = 0; i < subs.length; i++) {
        var ms = hierarchy[newK][subs[i]];
        for (var j = 0; j < ms.length; j++) {
          if (available[ms[j].id]) {
            props.setActiveMeasure(ms[j].id);
            return;
          }
        }
      }
      // No available measure — sadece ilk measure'u göster (disabled)
      if (subs.length > 0 && hierarchy[newK][subs[0]].length > 0) {
        props.setActiveMeasure(hierarchy[newK][subs[0]][0].id);
      }
    }
    function onAltKategoriChange(newS) {
      var ms = hierarchy[curKategori][newS];
      for (var i = 0; i < ms.length; i++) {
        if (available[ms[i].id]) {
          props.setActiveMeasure(ms[i].id);
          return;
        }
      }
      if (ms.length > 0) props.setActiveMeasure(ms[0].id);
    }

    return h('div', { className: 'control-bar' },
      props.mode === 'export'
        ? h('div', { className: 'control-label', style: { color: '#94a3b8', fontStyle: 'italic' } },
            'Filtreler aşağıda — banka, tarih, kalem seçimi')
        : props.mode === 'composition'
        ? h(React.Fragment || 'div', null,
            h('div', { className: 'control-label' }, 'Kompozisyon'),
            h('select', {
              className: 'control-select measure',
              value: props.activeComposition || 'aktif',
              onChange: function(e){ props.setActiveComposition(e.target.value); }
            },
              Object.keys(DATA.meta.compositions).map(function(cid){
                return h('option', { key: cid, value: cid }, DATA.meta.compositions[cid].ad);
              })
            )
          )
        : h(React.Fragment || 'div', null,
            h('div', { className: 'measure-search-wrap' },
              h('input', {
                className: 'measure-search-input',
                type: 'text',
                placeholder: 'Ölçü ara…',
                value: query,
                onInput: function(e){ setQuery(e.target.value); },
                onFocus: function(){ setFocused(true); },
                // blur'da hemen kapatma — item tıklaması kaydolsun (150ms gecikme)
                onBlur: function(){ setTimeout(function(){ setFocused(false); }, 150); },
                onKeyDown: function(e){
                  if (e.key === 'Enter' && searchResults.length) { pickMeasure(searchResults[0]); }
                  else if (e.key === 'Escape') { setQuery(''); setFocused(false); e.target.blur(); }
                }
              }),
              focused && q.length >= 1 && h('div', { className: 'measure-search-results' },
                searchResults.length === 0
                  ? h('div', { className: 'measure-search-empty' }, '"' + query.trim() + '" için ölçü bulunamadı')
                  : searchResults.map(function(m){
                      var isAvail = !!available[m.id];
                      return h('div', {
                        key: m.id,
                        className: 'measure-search-item'
                          + (m.id === props.activeMeasure ? ' active' : '')
                          + (isAvail ? '' : ' disabled'),
                        // onMouseDown: input blur'undan ÖNCE tetiklenir (seçim kaybolmasın)
                        onMouseDown: function(e){ e.preventDefault(); pickMeasure(m); }
                      },
                        h('div', { className: 'm-name' }, m.ad + (isAvail ? '' : ' — veri yok')),
                        h('div', { className: 'm-cat' },
                          m.kategori + (m.alt_kategori ? ' › ' + m.alt_kategori : '')
                          + '  ·  ' + (m.tip === 'rasyo' ? birimLabel(m) : '#'))
                      );
                    })
              )
            ),
            h('div', { className: 'control-label' }, 'Kategori'),
            h('select', {
              className: 'control-select cat',
              value: curKategori,
              onChange: function(e){ onKategoriChange(e.target.value); }
            }, kategoriList.map(function(k){
              return h('option', { key: k, value: k }, k);
            })),
            h('div', { className: 'control-label' }, 'Alt Kategori'),
            h('select', {
              className: 'control-select subcat',
              value: curAltKategori,
              onChange: function(e){ onAltKategoriChange(e.target.value); }
            }, altKategoriList.map(function(s){
              return h('option', { key: s, value: s }, s);
            })),
            h('div', { className: 'control-label' }, 'Ölçü'),
            h('select', {
              className: 'control-select measure',
              value: props.activeMeasure,
              onChange: function(e){ props.setActiveMeasure(e.target.value); }
            }, measureList.map(function(m){
              var isAvail = !!available[m.id];
              return h('option', {
                key: m.id, value: m.id,
                disabled: !isAvail
              }, m.ad + (m.tip === 'rasyo' ? '  (' + birimLabel(m) + ')' : '  (#)') + (isAvail ? '' : ' — veri yok'));
            }))
          )
    );
  }

  // ===============================================================
  // BANK RANKING — sabit 20 banka seti
  // ===============================================================
  // Pazar payı / çeyreklik delta sütunu gösterilsin mi?
  // - Tüm rasyolarda: evet (çeyreklik bps/% değişimi)
  // - Bilanço büyüklüklerinde: evet (pazar payı değişimi bps)
  // - Şube&Personel büyüklüklerinde (Şube/Personel Sayısı): evet (MİKTARSAL değişim)
  // - Gelir Tablosu büyüklüklerinde: hayır
  function showDeltaColumn(measure) {
    if (measure.tip === 'rasyo') return true;
    return measure.kategori === 'Bilanço' || measure.kategori === 'Şube & Personel';
  }

  function BankRanking(props) {
    var measure = props.measure;
    var tarih = props.tarih;
    var isRasyo = measure.tip === 'rasyo';
    var hasDelta = showDeltaColumn(measure);

    // Delta sütununun karşılaştırma dönemi — Çeyreklik (varsayılan) / YoY / YtD
    // arasında seçilebilir (kullanıcı isteği, 2026-09-16).
    var deltaPeriodState = useState('qoq');
    var deltaPeriod = deltaPeriodState[0], setDeltaPeriod = deltaPeriodState[1];

    // Kullanıcı isteği (2026-09-17): sabit top-20 seti yerine TÜM bankalar
    // sıralanır; panel ilk görünüşte ~20 satır gösterir, kalanına
    // .bank-rows-scroll ile aşağı kaydırarak ulaşılır (bkz. CSS).
    var sortedAll = allBanksSortedByMeasure(measure.id, tarih);
    var ktRank = ktRankAll(measure.id, tarih);

    var validVals = sortedAll.filter(function(r){return r.value != null;}).map(function(r){return r.value;});
    // Negatif değer alabilen ölçüler (ör. Likidite Açığı, YP Net Genel
    // Pozisyonu) için bar 0 çizgisinden İKİ YÖNE ayrılır — pozitif sağa,
    // negatif sola (kullanıcı isteği, 2026-09-17). Veri odaklı: bu listede
    // GERÇEKTEN negatif değer varsa devreye girer, sabit bir ölçü listesine
    // gerek yok — "Likidite Açığı" ailesinin 7 üyesi de otomatik kapsanır.
    var hasNegative = validVals.some(function(v){ return v < 0; });
    // Outlier- ve işaret-dayanıklı ölçekleme (yalnız RASYO'da; büyüklük aynen kalır):
    //  - Negatif değerli rasyolar (ör. YP Net Genel Pozisyonu) |değer| ile ölçeklenir.
    //  - Aşırı outlier (ör. NPL Karşılama'da HSBC %3932) ekseni bozmasın: dağılım-temelli
    //    eşikle (YtDGrowthChart ile aynı: max(medyan×4, 200)) ayıklanır → kırmızı/pasif,
    //    bar %100'de sınırlı. Sıralama DEĞİŞMEZ (değere göre).
    var absVals = validVals.map(function(v){ return Math.abs(v); });
    var sortedAbs = absVals.slice().sort(function(a, b){ return a - b; });
    var medAbs = sortedAbs.length ? sortedAbs[Math.floor(sortedAbs.length / 2)] : 0;
    var outlierTh = Math.max(medAbs * 4, 200);
    function isValueOutlier(v) {
      return isRasyo && v != null && validVals.length >= 5 && Math.abs(v) > outlierTh;
    }
    var scaleAbs = absVals.filter(function(a){ return !(isRasyo && validVals.length >= 5 && a > outlierTh); });
    var maxAbs = scaleAbs.length ? Math.max.apply(null, scaleAbs)
               : (absVals.length ? Math.max.apply(null, absVals) : 1);
    if (!maxAbs) maxAbs = 1;
    var maxVal = validVals.length > 0 ? Math.max.apply(null, validVals) : 1;  // büyüklük için
    var barScaleFactor = isRasyo ? 0.72 : 0.92;

    var deltaVals = hasDelta ? sortedAll.map(function(row) {
      if (row.value == null) return null;
      return rowQoQDelta(measure, row.banka, tarih, deltaPeriod);
    }).filter(function(d){ return d != null; }) : [];
    var deltaMaxAbs = deltaVals.length > 0
      ? Math.max.apply(null, deltaVals.map(Math.abs))
      : 100;

    var gridCols = hasDelta ? '110px 1fr 82px' : '110px 1fr';
    // Başlık satırı gövde satırlarından farklı bir grid kullanır: "Değer"
    // etiketi kaldırıldı, banka adı + bar sütunlarını tek bir geniş başlık
    // hücresi kaplıyor (isim sütununun sonuna değil, bar'ın bittiği yere
    // kadar uzanıyor) — kullanıcı isteği (2026-09-10).
    var headerGridCols = hasDelta ? '1fr 92px' : '1fr';

    return h('div', { className: 'panel ranking-panel', ref: props.panelRef },
      h('div', {
        className: 'bank-ranking-header',
        style: { gridTemplateColumns: headerGridCols },
        ref: props.headerRef
      },
        h('div', null,
          isRasyo ? ('Tüm ' + sortedAll.length + ' Banka Rasyo (' + birimLabel(measure) + ')')
                  : ('Tüm ' + sortedAll.length + ' Banka Büyüklükleri (' + buyuklukLabel(measure) + ')')),
        hasDelta && h('div', { className: 'bank-ranking-header-delta' },
          h('div', { className: 'bank-ranking-header-delta-title' },
            (isMiktarDelta(measure) || isRasyo) ? 'Değişim' : 'Pazar Payı'
          ),
          h('select', {
            className: 'bank-ranking-delta-period-select',
            value: deltaPeriod,
            onChange: function(e) { setDeltaPeriod(e.target.value); }
          },
            ['qoq', 'yoy', 'ytd'].map(function(p) {
              var unit = isMiktarDelta(measure) ? (measure.birim === 'bin_TL' ? 'TL' : 'adet')
                       : isRasyo ? (isPctBirim(measure) ? 'Bps' : '%')
                       : 'Bps';
              return h('option', { key: p, value: p }, deltaPeriodLabel(p) + ' (' + unit + ')');
            })
          )
        )
      ),
      h('div', {
        className: 'bank-rows-scroll',
        ref: props.scrollBoxRef,
        style: props.extraHeight ? { maxHeight: (609 + props.extraHeight) + 'px' } : undefined
      }, sortedAll.map(function(row) {
        var isKT = row.banka === KT_NAME;
        var rowOutlier = isValueOutlier(row.value);
        var isNeg = row.value != null && row.value < 0;
        var widthPct;
        if (row.value == null) {
          widthPct = 0;
        } else if (isRasyo) {
          // |değer| ile ölçekle (negatif-dayanıklı); outlier %100'de sınırlı.
          widthPct = Math.min((Math.abs(row.value) / maxAbs) * 100 * barScaleFactor, 100);
        } else {
          widthPct = (row.value / maxVal) * 100 * barScaleFactor;
        }
        // hasNegative modunda bar 0 çizgisinden (track'in ortası) başlar,
        // iki yöne de en fazla YARI genişliğe kadar uzanabilir — widthPct
        // (tam track'e göre) yarıya bölünüp merkeze göre konumlanır.
        var barStyle = hasNegative
          ? (isNeg ? { right: '50%', width: (widthPct / 2) + '%' }
                   : { left: '50%', width: (widthPct / 2) + '%' })
          : { width: widthPct + '%' };
        var delta = (hasDelta && row.value != null)
          ? rowQoQDelta(measure, row.banka, tarih, deltaPeriod)
          : null;
        // Sort_direction = 'asc' → düşmek iyi → eksiler yeşil, artılar kırmızı (renk ters)
        var sortAscBR = measure.sort_direction === 'asc';
        var deltaEsik = isMiktarDelta(measure) ? miktarDeltaEsik(measure)
                      : isRasyo ? qoqDeltaEsik(measure) : 0.5;
        var deltaCls = delta == null || Math.abs(delta) < deltaEsik ? 'zero'
                     : delta > 0 ? (sortAscBR ? 'neg' : 'pos')
                     : (sortAscBR ? 'pos' : 'neg');
        var deltaAbs = Math.abs(delta || 0);
        var deltaWidthPct = deltaMaxAbs > 0 ? Math.min(deltaAbs / deltaMaxAbs * 42, 42) : 0;

        return h('div', {
          key: row.banka,
          className: 'bank-row' + (isKT ? ' kt' : ''),
          style: { gridTemplateColumns: gridCols }
        },
          h('div', { className: 'bank-row-name', title: row.banka }, row.banka),
          h('div', { className: 'bank-bar-cell' },
            h('div', { className: 'bank-bar-track' },
              hasNegative && h('div', { className: 'bank-bar-zero-line' }),
              h('div', {
                className: 'bank-bar' + (isKT ? ' kt' : '') + (rowOutlier ? ' outlier' : '')
                  + (hasNegative ? (isNeg ? ' neg diverging' : ' diverging') : ''),
                style: barStyle
              })
            ),
            h('div', { className: 'bank-value' + (rowOutlier ? ' outlier' : '') },
              row.value == null ? '—' :
                (isRasyo ? fmtMeasure(row.value, measure, 2) : fmtBuyukluk(row.value, measure))
            )
          ),
          hasDelta && h('div', { className: 'bank-delta-cell' },
            delta != null && Math.abs(delta) >= deltaEsik && h('div', {
              className: 'bank-delta-bar ' + deltaCls,
              style: delta > 0
                ? { left: '50%', width: deltaWidthPct + '%' }
                : { right: '50%', width: deltaWidthPct + '%' }
            }),
            h('div', { className: 'bank-delta-text ' + deltaCls },
              delta == null ? '—'
                : isMiktarDelta(measure) ? fmtMiktarDelta(delta, measure)
                : isRasyo ? fmtQoQDelta(delta, measure) : fmtBps(delta)
            )
          )
        );
      })),
      h('div', { className: 'rank-badge-row' },
        h('div', { className: 'rank-label' }, 'Kuveyt Türk sırası:'),
        ktRank && h('div', { className: 'rank-badge' },
          ktRank[0] + ' / ' + ktRank[1]
        )
      )
    );
  }

  // ===============================================================
  // YtD/YoY GROWTH CHART — 0-eksenli, akım/stok aware
  // ===============================================================
  function YtDGrowthChart(props) {
    var measure = props.measure;
    var tarih = props.tarih;

    // Sol paneldeki (BankRanking) yüksekliğe hizalanmak için — bars-area'nın
    // GERÇEKTEN render edilen yüksekliği (CSS flex:1 ile SnapshotView'dan
    // gelen matchHeight'e göre büyüyebiliyor) ölçülüp bar oranları buna göre
    // hesaplanır. matchHeight yoksa (mobil/ilk render) CSS min-height:130px
    // fallback'i devreye girer, aşağıdaki 130 varsayılanıyla tutarlı kalır.
    var barsAreaRef = useRef(null);
    var barsAreaHState = useState(130);
    var barsAreaH = barsAreaHState[0], setBarsAreaH = barsAreaHState[1];
    useEffect(function() {
      function measureBarsArea() {
        if (!barsAreaRef.current) return;
        var hgt = barsAreaRef.current.getBoundingClientRect().height;
        if (hgt && Math.abs(hgt - barsAreaH) > 2) setBarsAreaH(hgt);
      }
      measureBarsArea();
      window.addEventListener('resize', measureBarsArea);
      return function(){ window.removeEventListener('resize', measureBarsArea); };
    });

    var top20Set = getFixedTop20(tarih);
    var metricLabel = growthMetricLabel(measure); // 'YtD' veya 'YoY'
    // Şube&Personel büyüklük ölçüleri (Şube/Personel Sayısı): banka büyümeleri
    // % yerine MİKTARSAL (adet) — kullanıcı isteği (2026-08-15). Bu modda oran
    // yok, dolayısıyla log-uzayı anomali tespiti de devre dışı.
    var miktar = isMiktarDelta(measure);
    var birimEtiket = miktar ? (measure.birim === 'adet' ? 'adet' : 'TL') : '%';

    var bars = top20Set.filter(function(banka) {
      return bankShownForMeasure(measure.id, banka, tarih);  // şubesiz banka + şube ölçüsü → gösterme
    }).map(function(banka) {
      var coverage = DATA.meta.bank_coverage[banka] || 0;
      var growth = miktar ? growthMiktar(measure, banka, tarih)
                          : growthMetric(measure, banka, tarih);
      var baz = growthBase(measure, banka, tarih);
      return { banka: banka, growth: growth, coverage: coverage, baz: baz };
    });

    // ---- Anomali tespiti: LOG-UZAYINDA robust (MAD tabanlı) -------------
    //
    // NEDEN log: büyüme oranları doğası gereği ASİMETRİKTİR — bir düşüş en
    // fazla −%100 olabilirken artışın üst sınırı yoktur. Mutlak değere göre
    // eşik koyunca (eski yöntem: |g| > %200) −%88,5 "normal", +%250 "aykırı"
    // sayılıyordu. Oysa oransal olarak −%88,5 (değer 8,7'de bire düşmüş)
    // +%250'den (3,5 katına çıkmış) DAHA uçtur. L = ln(1 + g/100) dönüşümü
    // iki yönü simetrik hale getirir: ln(0,115) = −2,16 ile ln(3,50) = +1,25.
    //
    // NEDEN MAD: ortalama/standart sapma aykırı değerlerden etkilenir; medyan
    // ve MAD (medyan mutlak sapma) etkilenmez. Iglewicz–Hoaglin robust
    // z-skoru kullanılır: z = 0,6745 × (L − medyan) / MAD.
    //
    // NEDEN İKİ KOŞUL BİRDEN: tek başına z yetmiyor. Stok kalemlerinde (Toplam
    // Aktifler, Krediler) tüm bankalar birbirine yakın büyür, MAD çok küçük
    // olur (~0,03) ve HSBC'nin gayet normal %25,9 büyümesi bile z=3,6 çıkar.
    // Bu yüzden istatistiksel uçluğun yanına PRATİK ANLAMLILIK koşulu eklendi:
    // değer, medyandan log-uzayında en az LOG_MIN_DEV kadar da uzak olmalı.
    // ln(3) ≈ 1,1 → "medyan büyüme çarpanının en az 3 katı kadar sapma".
    // Böylece yakalanan şey gerçek yapısal kırılma olur (spin-off, birleşme,
    // düşük baz etkisi), sektörün normal büyüme dağılımı değil.
    //
    // Baz dönem ≤ 0 ise (zarardan kâra geçiş gibi) yüzde değişim anlamsızdır,
    // doğrudan anomali sayılır. coverage yalnızca REFERANS dağılımı seçmekte
    // kullanılır — "normal büyüme" tanımı uzun geçmişli bankalardan türetilir,
    // ama bankanın kendi geçmişinin kısalığı tek başına dışlama sebebi değildir.
    var HARD_CEILING = 1500;   // %1500 üstü: yapısal kırılma (spin-off/birleşme)
    var Z_LIMIT = 3.5;
    var LOG_MIN_DEV = 1.1;     // ln(3): medyandan en az 3 kat sapma

    function toLog(g) {
      if (g == null || g <= -100) return null;   // −%100 ve altı: log tanımsız
      var L = Math.log(1 + g / 100);
      return isFinite(L) ? L : null;
    }

    function bazGecerli(b) { return b.baz != null && b.baz > 0; }

    var refLogs = bars
      .filter(function(b){ return b.coverage >= 20 && b.growth != null && bazGecerli(b); })
      .map(function(b){ return toLog(b.growth); })
      .filter(function(L){ return L != null; });

    var medL = medyan(refLogs);
    var madL = medL == null ? null
      : medyan(refLogs.map(function(L){ return Math.abs(L - medL); }));
    // MAD = 0 olabilir (tüm değerler birebir aynı) → sıfıra bölme koruması
    var madEtkin = (madL != null && madL > 1e-6) ? madL : 1e-6;
    var refYeterli = refLogs.length >= 5;

    bars = bars.map(function(b){
      var isAnomalous = false;
      if (!miktar && b.growth != null) {  // miktar modunda anomali tespiti yok (mutlak adet, oran değil)
        if (!bazGecerli(b)) {
          isAnomalous = true;                       // baz ≤ 0 → oran anlamsız
        } else if (Math.abs(b.growth) > HARD_CEILING) {
          isAnomalous = true;                       // emniyet tavanı
        } else if (refYeterli) {
          var L = toLog(b.growth);
          if (L == null) {
            isAnomalous = true;
          } else {
            var sapma = L - medL;
            var z = 0.6745 * sapma / madEtkin;
            // İKİ koşul birden: istatistiksel uçluk VE pratik anlamlılık
            isAnomalous = Math.abs(z) > Z_LIMIT && Math.abs(sapma) > LOG_MIN_DEV;
          }
        }
      }
      return { banka: b.banka, growth: b.growth, isAnomalous: isAnomalous };
    });

    // Sıralama: sort_direction'a göre. Asc'de küçük büyüme önce, desc'de büyük önce.
    // Anomaliler ve null'lar her zaman sona.
    var sortAsc = measure && measure.sort_direction === 'asc';
    bars.sort(function(a, b) {
      if (a.isAnomalous && !b.isAnomalous) return 1;
      if (!a.isAnomalous && b.isAnomalous) return -1;
      if (a.growth == null && b.growth == null) return 0;
      if (a.growth == null) return 1;
      if (b.growth == null) return -1;
      return sortAsc ? (a.growth - b.growth) : (b.growth - a.growth);
    });

    var cleanBars = bars.filter(function(b){ return b.growth != null && !b.isAnomalous; });
    if (cleanBars.length === 0) return h('div', { className: 'panel' },
      h('div', { className: 'panel-header' }, 'İlk ' + bars.length + ' Banka ' + metricLabel + ' Büyüme (' + birimEtiket + ')'),
      h('div', { className: 'empty-state' }, 'Veri yok')
    );

    // 0-eksen logiği: hem pozitif hem negatif
    var maxPos = Math.max.apply(null, cleanBars.map(function(b){ return b.growth; }));
    var minNeg = Math.min.apply(null, cleanBars.map(function(b){ return b.growth; }));
    if (maxPos < 0) maxPos = 0;  // tüm değerler negatifse
    if (minNeg > 0) minNeg = 0;  // tüm değerler pozitifse

    // ORANTI DÜZELTMESİ: Tüm barları aynı global ölçeğe bağla.
    // Yarıların yüksekliği maxPos:|minNeg| oranında bölünür.
    // Bar yüksekliği px = (|growth| / TOTAL_HEIGHT_RANGE) * TOTAL_HEIGHT_PX
    // Bu sayede 198 puanlık pozitif bar, 31 puanlık negatif bardan ~6x daha uzun görünür.
    var TOTAL_HEIGHT_PX = barsAreaH > 20 ? barsAreaH : 130;
    var totalRange = maxPos + Math.abs(minNeg);  // örn: 198 + 31 = 229
    var posHeight = totalRange > 0 ? Math.round(TOTAL_HEIGHT_PX * (maxPos / totalRange)) : 65;
    var negHeight = TOTAL_HEIGHT_PX - posHeight;

    // Kart artık sol tablonun yüksekliğine zorlanmıyor (kullanıcı isteğiyle
    // 2026-09-10'da kaldırıldı) — doğal/kompakt boyutunda kalıyor; sağ
    // sütundaki 3 kartın SARMALAYICISI sol panelin yüksekliğine asgari
    // olarak ayarlanıyor (bkz. SnapshotView), aradaki boşluk esniyor.
    var panelStyle = { display: 'flex', flexDirection: 'column' };

    // Başlığın gri alanı sol paneldeki (bank-ranking-header) ile yatayda
    // hizalı kalsın diye ölçülen değere göre gerilip dikey ortalanır —
    // yalnızca başlık şeridi, kartın kendisi değil (kullanıcı isteği,
    // 2026-09-10).
    var headerStyle = { flex: 'none' };
    if (props.headerMatchHeight) {
      headerStyle.minHeight = props.headerMatchHeight + 'px';
      headerStyle.display = 'flex';
      headerStyle.alignItems = 'center';
      headerStyle.justifyContent = 'center';
    }

    return h('div', { className: 'panel', style: panelStyle },
      h('div', { className: 'panel-header', style: headerStyle },
        'İlk ' + bars.length + ' Banka ' + metricLabel + ' Büyüme (' + birimEtiket + ')'),
      h('div', { className: 'ytd-panel-body' },
        h('div', { className: 'ytd-chart-container' },
          // Satır 1: değer etiketleri
          h('div', { className: 'ytd-values-row' },
            bars.map(function(b) {
              var isKT = b.banka === KT_NAME;
              var cls = 'ytd-value-cell';
              if (b.isAnomalous) cls += ' anomaly';
              else if (isKT) cls += ' kt';
              else if (b.growth != null) {
                // Asc measure'da: artış kötü (kırmızı), azalış iyi (yeşil değil — nötr)
                // Desc measure'da: azalış kötü (kırmızı), artış iyi (nötr/siyah)
                if (sortAsc) {
                  if (b.growth > 0) cls += ' neg';     // artış kötü → kırmızı
                  else if (b.growth < 0) cls += ' pos'; // azalış iyi → yeşil
                } else {
                  if (b.growth < 0) cls += ' neg';     // azalış kötü → kırmızı
                  // pozitif değerler nötr (default renk)
                }
              }
              // Anomali olsa bile DEĞER gösterilir (gizlenmez); soluk/italik
              // stil + tooltip "bu karşılaştırma çarpık" uyarısını taşır.
              // Etiket kompakt formatta (dar hücre), TAM değer tooltip'te.
              return h('div', {
                key: b.banka,
                className: cls,
                title: b.growth == null ? b.banka + ': veri yok'
                  : b.banka + ': ' + (miktar ? fmtMiktarDelta(b.growth, measure) : fmtPctPlain(b.growth, 1)) +
                    (b.isAnomalous
                      ? ' — yapısal kırılma / düşük baz nedeniyle diğerleriyle ' +
                        'kıyaslanabilir değil, grafik ölçeğine dahil edilmedi'
                      : '')
              },
                b.growth == null ? '—'
                  : miktar ? ((b.growth > 0 ? '+' : '') + Math.round(b.growth).toLocaleString('tr-TR'))
                  : fmtGrowthCompact(b.growth)
              );
            })
          ),
          // Satır 2: bar alanı (pozitif üst, negatif alt, 0 çizgisi ortada)
          h('div', {
            className: 'ytd-bars-area',
            ref: barsAreaRef
          },
            // Pozitif yarı
            h('div', {
              className: 'ytd-bars-pos',
              style: { height: posHeight + 'px' }
            },
              bars.map(function(b) {
                var isKT = b.banka === KT_NAME;
                // Bar yüksekliği px — global ölçek (totalRange üzerinden)
                var heightPx = 0;
                if (b.growth != null && !b.isAnomalous && b.growth > 0 && totalRange > 0) {
                  heightPx = (b.growth / totalRange) * TOTAL_HEIGHT_PX;
                } else if (b.isAnomalous) {
                  heightPx = posHeight > 0 ? Math.min(10, posHeight) : 0;
                }
                var cls = 'ytd-bar-fill';
                if (isKT) cls += ' kt';
                if (b.isAnomalous) cls += ' anomaly';
                var visible = b.growth != null && !b.isAnomalous && b.growth > 0;
                return h('div', { key: b.banka, className: 'ytd-bar-cell' },
                  (visible || b.isAnomalous) && h('div', {
                    className: cls,
                    style: { height: heightPx + 'px' },
                    title: b.isAnomalous ? 'Aşırı büyüme oranı (yapısal kırılma / küçük baz) — karşılaştırma anlamlı değil' : ''
                  })
                );
              })
            ),
            // 0 çizgisi
            h('div', {
              className: 'ytd-zero-line',
              style: { top: posHeight + 'px' }
            }),
            // Negatif yarı
            h('div', {
              className: 'ytd-bars-neg',
              style: { height: negHeight + 'px' }
            },
              bars.map(function(b) {
                var isKT = b.banka === KT_NAME;
                var heightPx = 0;
                if (b.growth != null && !b.isAnomalous && b.growth < 0 && totalRange > 0) {
                  heightPx = (Math.abs(b.growth) / totalRange) * TOTAL_HEIGHT_PX;
                }
                var cls = 'ytd-bar-fill';
                if (isKT) cls += ' kt';
                var visible = b.growth != null && !b.isAnomalous && b.growth < 0;
                return h('div', { key: b.banka, className: 'ytd-bar-cell' },
                  visible && h('div', {
                    className: cls,
                    style: { height: heightPx + 'px' }
                  })
                );
              })
            )
          ),
          // Satır 3: banka isimleri (dikey)
          h('div', { className: 'ytd-labels-row' },
            bars.map(function(b) {
              var isKT = b.banka === KT_NAME;
              return h('div', { key: b.banka, className: 'ytd-label-cell' },
                h('div', {
                  className: 'ytd-label-text' + (isKT ? ' kt' : ''),
                  title: b.banka
                }, b.banka)
              );
            })
          )
        )
      )
    );
  }

  // ===============================================================
  // GROUP SUMMARY (5 groups in new order)
  // ===============================================================
  function GroupSummary(props) {
    var measure = props.measure;
    var tarih = props.tarih;
    var isRasyo = measure.tip === 'rasyo';
    var groupOrder = DATA.meta.group_order;
    var metricLabel = growthMetricLabel(measure);

    // Şube&Personel büyüklük ölçüleri (Şube/Personel Sayısı): grup büyümesi
    // % yerine MİKTARSAL (adet) gösterilir — kullanıcı isteği (2026-08-15).
    var miktar = isMiktarDelta(measure) && !isRasyo;

    var cells = groupOrder.map(function(g) {
      var val;
      if (isRasyo) val = groupVal(measure.id, g, tarih);
      else if (miktar) val = (g === KT_NAME ? growthMiktar(measure, KT_NAME, tarih)
                                            : growthMiktarGroup(measure, g, tarih));
      else if (g === KT_NAME) val = growthMetric(measure, KT_NAME, tarih);
      else val = growthMetricGroup(measure, g, tarih);
      return { label: g, value: val };
    });

    var title = isRasyo
      ? ('Banka Grupları Rasyo (' + birimLabel(measure) + ')')
      : miktar
        ? ('Banka Grupları ' + metricLabel + ' Büyüme (' + (measure.birim === 'adet' ? 'adet' : 'TL') + ')')
        : ('Banka Grupları ' + metricLabel + ' Büyüme (%)');

    return h('div', { className: 'panel' },
      h('div', { className: 'panel-header' }, title),
      h('div', { className: 'group-grid' },
        cells.map(function(c) {
          return h('div', {
            key: c.label,
            className: 'group-cell' + (c.label === KT_NAME ? ' kt' : '')
          },
            h('div', { className: 'group-cell-label' }, c.label),
            h('div', { className: 'group-cell-value' },
              c.value == null ? '—'
                : isRasyo ? fmtMeasure(c.value, measure, 2)
                : miktar ? fmtMiktarDelta(c.value, measure)
                : fmtPctPlain(c.value, 2)
            )
          );
        })
      )
    );
  }

  function GroupBpsChange(props) {
    var measure = props.measure;
    var tarih = props.tarih;
    var groupOrder = DATA.meta.group_order;

    // Bps (baz puan) yalnızca YÜZDE birimli measure'lar için anlamlıdır:
    // iki yüzdenin farkı baz puandır. TL tutarı (bin_TL), çarpan (kat) veya
    // adet birimli measure'larda çeyreklik değişim YÜZDE olarak gösterilir.
    var bpsUygun = isPctBirim(measure);
    // Şube&Personel: çeyreklik grup değişimi MİKTARSAL (banka seviyesiyle tutarlı).
    var miktar = isMiktarDelta(measure);

    var cells = groupOrder.map(function(g) {
      return {
        label: g,
        deger: miktar ? miktarDelta(measure, g, tarih, g !== KT_NAME)
                      : measureQoQDelta(measure, g, tarih, g !== KT_NAME)
      };
    });

    var esik = miktar ? miktarDeltaEsik(measure) : qoqDeltaEsik(measure);

    return h('div', { className: 'panel' },
      h('div', { className: 'panel-header' },
        miktar ? ('Banka Grupları Çeyreklik Değişim (' + (measure.birim === 'bin_TL' ? 'TL' : 'adet') + ')')
               : bpsUygun ? 'Banka Grupları Rasyo Çeyreklik Değişim (Bps)'
               : 'Banka Grupları Çeyreklik Değişim (%)'),
      h('div', { className: 'group-grid' },
        cells.map(function(c) {
          var sortAscGB = measure.sort_direction === 'asc';
          var cls = c.deger == null || Math.abs(c.deger) < esik ? ''
                  : c.deger > 0 ? (sortAscGB ? 'neg' : 'pos')
                  : (sortAscGB ? 'pos' : 'neg');
          return h('div', {
            key: c.label,
            className: 'group-cell' + (c.label === KT_NAME ? ' kt' : '')
          },
            h('div', { className: 'group-cell-label' }, c.label),
            h('div', { className: 'group-cell-value ' + cls },
              c.deger == null ? '—'
                : miktar ? fmtMiktarDelta(c.deger, measure)
                : fmtQoQDelta(c.deger, measure)
            )
          );
        })
      )
    );
  }

  // ===============================================================
  // COMPETITOR CARDS (büyüklük)
  // ===============================================================
  // Kart hover'dan çıkıp popover'a girerken (fare ikisi arasındaki boşluktan
  // geçerken) yanıp sönmesin diye küçük bir gecikmeyle kapatılır — popover'a
  // fare girerse bu zamanlayıcı iptal edilir (CompetitorPopover'ın kendi
  // onMouseEnter'ı).
  var COMPETITOR_CLOSE_DELAY_MS = 120;

  function CompetitorPopover(props) {
    var pos = props.pos;
    var posStyle = pos.openUp
      ? { left: pos.left + 'px', top: pos.anchorTop + 'px', transform: 'translate(-50%, calc(-100% - 10px))' }
      : { left: pos.left + 'px', top: pos.anchorBottom + 'px', transform: 'translate(-50%, 10px)' };
    return h('div', {
      className: 'competitor-popover',
      style: posStyle,
      onMouseEnter: props.onMouseEnter,
      onMouseLeave: props.onMouseLeave
    },
      h('div', { className: 'competitor-title' }, bankMono(props.bank), h('span', null, props.bank)),
      props.data.noData
        ? h('div', { style:{fontSize:'11px', color:'#94a3b8', textAlign:'center', padding:'8px'} }, 'veri yok')
        : h(React.Fragment || 'div', null,
            h('svg', { viewBox: '0 0 ' + props.data.W + ' ' + props.data.H, style:{width:'100%', height: props.data.H + 'px'}},
              props.data.bars
            ),
            h('div', {
              style: {
                textAlign:'center', fontSize:'14px', fontWeight:'700',
                color: props.data.textColor, marginTop:'3px'
              }
            }, props.data.cagr == null ? 'CAGR: —' : fmtPctPlain(props.data.cagr, 1))
          )
    );
  }

  function CompetitorCardsGrowth(props) {
    var measure = props.measure;
    var tarih = props.tarih;
    var rakipler = [KT_NAME, 'Garanti Bankası', 'Yapı Kredi', 'Akbank', 'QNB Finansbank', 'Denizbank'];

    // Kollaps kart → hover/tık ile büyüyen popover (kullanıcı isteği,
    // 2026-09-17: "tek satırda yan yana + interaktif" — okunabilirlik
    // statik büyütmeyle değil, TrendView'deki kanıtlanmış hover-tooltip
    // desenini taklit eden bir popover ile çözülüyor; popover kartın
    // genişliğinden bağımsız sabit boyutta olduğundan içerik hiç sıkışmaz).
    var hoverState = useState(null);   // fare/klavye ile anlık açık banka
    var hoverBank = hoverState[0], setHoverBank = hoverState[1];
    var pinnedState = useState(null);  // tıkla pinlenmiş banka (dokunmatik/kalıcı)
    var pinnedBank = pinnedState[0], setPinnedBank = pinnedState[1];
    var posState = useState(null);
    var pos = posState[0], setPos = posState[1];
    var closeTimerRef = useRef(null);

    var activeBank = pinnedBank || hoverBank;

    function clearCloseTimer() {
      if (closeTimerRef.current) { clearTimeout(closeTimerRef.current); closeTimerRef.current = null; }
    }
    function openFor(b, el) {
      clearCloseTimer();
      var rect = el.getBoundingClientRect();
      // Baloncuk her zaman tek ekranda tam görünsün diye (2026-09-16
      // geri bildirimi: "baloncuklar en altta/üstte hizalansın, tek
      // sayfada görünür olsun") left ve openUp ekran sınırlarına göre
      // clamp edilir — kart ekranın neresinde olursa olsun taşma yok.
      var POPOVER_W = 180, POPOVER_H_EST = 130, margin = 8;
      var left = rect.left + rect.width / 2;
      left = Math.max(POPOVER_W / 2 + margin,
        Math.min(window.innerWidth - POPOVER_W / 2 - margin, left));
      var openUp = rect.top > window.innerHeight * 0.55;
      if (openUp && rect.top - POPOVER_H_EST - margin < 0) openUp = false;
      if (!openUp && rect.bottom + POPOVER_H_EST + margin > window.innerHeight) openUp = true;
      setHoverBank(b);
      setPos({
        left: left,
        anchorTop: rect.top,
        anchorBottom: rect.bottom,
        openUp: openUp
      });
    }
    function scheduleClose() {
      clearCloseTimer();
      closeTimerRef.current = setTimeout(function(){ setHoverBank(null); }, COMPETITOR_CLOSE_DELAY_MS);
    }

    // Pinlenmişken kart/popover dışına tıklanınca kapat (dokunmatik ekranlar
    // hover göndermediği için tık-pinleme şart).
    useEffect(function() {
      if (!pinnedBank) return;
      function onDocClick(e) {
        if (!e.target.closest('.competitor-card-mini, .competitor-popover')) {
          setPinnedBank(null);
        }
      }
      document.addEventListener('mousedown', onDocClick);
      return function(){ document.removeEventListener('mousedown', onDocClick); };
    }, [pinnedBank]);

    var allDates = DATA.meta.dates;
    // 3 yıllık snapshot tarihleri: aynı ay-gün, t-2y / t-1y / t
    // Örn. Eylül 2025 seçili ise: Eylül 2023, Eylül 2024, Eylül 2025
    function yearOffset(t, n) {
      var p = t.split('-');
      return (parseInt(p[0]) - n) + '-' + p[1] + '-' + p[2];
    }
    var snapshotDates = [yearOffset(tarih, 2), yearOffset(tarih, 1), tarih];
    // Eğer parquet'te bu tarihlerden biri yoksa null bırak
    var validSnapshotDates = snapshotDates.map(function(d){
      return allDates.indexOf(d) >= 0 ? d : null;
    });

    // Bir bankanın tam kart verisini hesaplar — hem kollaps karttaki CAGR
    // hem de popover'daki zengin grafik için TEK kaynak (kod tekrarı yok).
    function computeBankData(b) {
      var values = validSnapshotDates.map(function(d){
        return d ? bankVal(measure.id, b, d) : null;
      });
      var validVals = values.filter(function(v){ return v != null; });
      var textColor = bankTextColor(b);
      if (validVals.length < 1) return { noData: true, textColor: textColor, cagr: null };

      var maxV = Math.max.apply(null, validVals);
      var W = 156, H = 60;
      var nBars = 3;
      var topPad = 14, bottomPad = 13;
      var chartH = H - topPad - bottomPad;
      var sidePad = 8;
      var groupW = W - sidePad * 2;
      var gap = 6;
      var barW = (groupW - gap * (nBars - 1)) / nBars;
      var color = bankColor(b);
      var cagr = cagr2y(measure.id, b, tarih);

      var bars = values.map(function(v, i) {
        var x = sidePad + i * (barW + gap);
        var labelDate = snapshotDates[i];
        var yearLabel = labelDate ? labelDate.split('-')[0] : '—';
        var monthLabel = labelDate ? tarihLabelShort(labelDate).split(' ')[0] : '';

        if (v == null) {
          return h('g', { key: i },
            h('rect', {
              x: x, y: topPad + chartH * 0.85,
              width: barW, height: chartH * 0.15,
              fill: 'rgba(148,163,184,0.15)',
              stroke: 'rgba(148,163,184,0.3)',
              strokeDasharray: '2,2'
            }),
            h('text', {
              x: x + barW/2, y: H - 2,
              fontSize:'9.5', fill: '#94a3b8',
              textAnchor:'middle', fontWeight:'500'
            }, monthLabel + ' ' + yearLabel.slice(2))
          );
        }
        var barH = maxV > 0 ? (v / maxV) * chartH : 0;
        var barY = topPad + (chartH - barH);
        return h('g', { key: i },
          h('rect', { x: x, y: barY, width: barW, height: barH, fill: color, rx: 1 }),
          h('text', {
            x: x + barW/2, y: barY - 3,
            fontSize:'10', fill: textColor,
            textAnchor:'middle', fontWeight:'700'
          }, fmtTL_tr(v)),
          h('text', {
            x: x + barW/2, y: H - 2,
            fontSize:'9.5', fill: '#64748b',
            textAnchor:'middle', fontWeight:'500'
          }, monthLabel + ' ' + yearLabel.slice(2))
        );
      });

      return { noData: false, W: W, H: H, bars: bars, cagr: cagr, textColor: textColor };
    }

    return h('div', { className: 'panel', style: { position: 'relative' } },
      h('div', { className: 'panel-header' }, 'Rakip Bankalar Yıllık Görünüm (Son 3 Dönem) ve CAGR (Bileşik Yıllık Büyüme %)'),
      h('div', { className: 'competitor-grid' },
        rakipler.map(function(b) {
          var cagr = cagr2y(measure.id, b, tarih);
          var textColor = bankTextColor(b);
          var isActive = activeBank === b;
          return h('div', {
            key: b,
            className: 'competitor-card-mini' + (isActive ? ' active' : ''),
            tabIndex: 0,
            title: b,
            onMouseEnter: function(e){ openFor(b, e.currentTarget); },
            onMouseLeave: scheduleClose,
            onFocus: function(e){ openFor(b, e.currentTarget); },
            onBlur: scheduleClose,
            onClick: function(e){
              if (pinnedBank === b) { setPinnedBank(null); }
              else { openFor(b, e.currentTarget); setPinnedBank(b); }
            }
          },
            h('div', { className: 'competitor-mini-title' }, bankMono(b), h('span', null, b)),
            h('div', { className: 'competitor-mini-cagr', style:{ color: textColor } },
              cagr == null ? '—' : fmtPctPlain(cagr, 1)),
            h('div', { className: 'competitor-mini-hint' }, 'CAGR')
          );
        })
      ),
      activeBank && pos && h(CompetitorPopover, {
        bank: activeBank,
        data: computeBankData(activeBank),
        pos: pos,
        onMouseEnter: clearCloseTimer,
        onMouseLeave: scheduleClose
      })
    );
  }

  // ===============================================================
  // COMPETITOR TREND (rasyo) — 5 rakip, label sadece son değerde
  // ===============================================================
  function CompetitorTrendRatio(props) {
    var measure = props.measure;
    var tarih = props.tarih;
    // 5 rakip + KT sırası: KT, Garanti, Yapı Kredi, Akbank, QNB, Denizbank (2026-09-15)
    var rakipler = [KT_NAME, 'Garanti Bankası', 'Yapı Kredi', 'Akbank', 'QNB Finansbank', 'Denizbank'];

    // Hover crosshair + tooltip — TrendView'deki (satır ~5123-5140, ~5278-5303)
    // kanıtlanmış desenin birebir portu (kullanıcı isteği, 2026-09-17: "kardeş"
    // çizgi grafiği neden farklı davransın — tutarlılık için). Aynı mantık:
    // fare x'ini SVG viewBox uzayına çevir, en yakın veri index'ini bul.
    var hoverState = useState(null);
    var hoverIdx = hoverState[0], setHoverIdx = hoverState[1];

    var allDates = DATA.meta.dates;
    var curIdx = allDates.indexOf(tarih);
    var trendDates = curIdx >= 7 ? allDates.slice(curIdx - 7, curIdx + 1) : allDates.slice(0, curIdx + 1);

    var allValues = [];
    var seriesByBank = {};
    rakipler.forEach(function(b) {
      var vals = trendDates.map(function(d){ return bankVal(measure.id, b, d); });
      seriesByBank[b] = vals;
      vals.forEach(function(v){ if (v != null) allValues.push(v); });
    });

    if (allValues.length === 0) return h('div', {className:'panel'},
      h('div',{className:'panel-header'},'Rakip Bankalar Trend (' + birimLabel(measure) + ')'),
      h('div',{className:'empty-state'},'Veri yok')
    );

    var min = Math.min.apply(null, allValues);
    var max = Math.max.apply(null, allValues);
    var dataMin = min;
    var range = max - min || 1;
    min = min - range * 0.1;
    max = max + range * 0.12;  // biraz daha üst pay, label'lar için
    if (dataMin >= 0 && min < 0) min = 0;   // pozitif seride eksen eksiye inmesin (2026-09-08)
    range = max - min;

    var W = 560, H = 220;
    var padL = 40, padR = 60, padT = 30, padB = 30;  // sağda label için pay
    var chartW = W - padL - padR;
    var chartH = H - padT - padB;
    var stepX = chartW / (trendDates.length - 1);
    var scale = function(v){ return padT + chartH - ((v - min) / range) * chartH; };

    // --- Son dönem etiketleri: dikey çakışma çözümü ---------------------
    // 6 banka aynı grafikte olduğu için son değerleri birbirine yakın
    // düştüğünde etiketler üst üste biniyordu. Aşağıda etiketler ideal
    // y konumlarına göre sıralanıp aralarında en az LABEL_MIN_GAP kalacak
    // şekilde ayrıştırılır (önce aşağı it, taşarsa yukarı geri sıkıştır).
    var LABEL_MIN_GAP = 13;   // fontSize 11.5 için okunur minimum aralık (2026-09-17 büyütüldü)
    var labelItems = [];
    rakipler.forEach(function(b) {
      var vals = seriesByBank[b];
      var lastValidIdx = -1;
      for (var li = vals.length - 1; li >= 0; li--) {
        if (vals[li] != null) { lastValidIdx = li; break; }
      }
      if (lastValidIdx < 0) return;
      var yIdeal = scale(vals[lastValidIdx]) + 4;
      labelItems.push({
        banka: b,
        color: bankTextColor(b),
        x: padL + lastValidIdx * stepX + 8,
        yIdeal: yIdeal,
        y: yIdeal,
        text: fmtMeasure(vals[lastValidIdx], measure, 2)
      });
    });
    labelItems.sort(function(a, b){ return a.yIdeal - b.yIdeal; });
    // 1) Yukarıdan aşağı: çakışanları aşağı it
    for (var i = 1; i < labelItems.length; i++) {
      if (labelItems[i].y - labelItems[i-1].y < LABEL_MIN_GAP) {
        labelItems[i].y = labelItems[i-1].y + LABEL_MIN_GAP;
      }
    }
    // 2) Alt sınırı aştıysa aşağıdan yukarı geri sıkıştır
    var yBottomLimit = padT + chartH + 4;
    if (labelItems.length && labelItems[labelItems.length-1].y > yBottomLimit) {
      labelItems[labelItems.length-1].y = yBottomLimit;
      for (var j = labelItems.length - 2; j >= 0; j--) {
        if (labelItems[j+1].y - labelItems[j].y < LABEL_MIN_GAP) {
          labelItems[j].y = labelItems[j+1].y - LABEL_MIN_GAP;
        }
      }
    }

    return h('div', { className: 'panel' },
      h('div', { className: 'panel-header' }, 'Rakip Bankalar Trend (' + birimLabel(measure) + ')'),
      h('div', { className: 'rakip-trend-panel' },
        h('div', { className: 'rakip-trend-legend' },
          rakipler.map(function(b) {
            return h('div', { key: b, className: 'rakip-legend-item' },
              h('div', {
                className: 'rakip-legend-dot',
                style: { background: bankColor(b) }
              }),
              h('span', null, b)
            );
          })
        ),
        h('div', {
          className: 'trend-svg-wrap',
          onMouseMove: function(e) {
            var rect = e.currentTarget.getBoundingClientRect();
            var vbX = (e.clientX - rect.left) / rect.width * W;
            var i = Math.round((vbX - padL) / stepX);
            if (i < 0) i = 0;
            if (i >= trendDates.length) i = trendDates.length - 1;
            if (vbX < padL - 5 || vbX > W - padR + 5) {
              setHoverIdx(null);
            } else {
              setHoverIdx({ i: i, mouseX: e.clientX - rect.left, mouseY: e.clientY - rect.top });
            }
          },
          onMouseLeave: function(){ setHoverIdx(null); }
        },
        h('svg', { viewBox: '0 0 '+W+' '+H, style:{width:'100%', height:'220px'}},
          [0, 0.25, 0.5, 0.75, 1].map(function(p, i) {
            return h('line', {
              key: i,
              x1: padL, x2: W - padR,
              y1: padT + p * chartH, y2: padT + p * chartH,
              stroke: '#e2e8f0', strokeDasharray: '2,3'
            });
          }),
          trendDates.map(function(d, i) {
            return h('text', {
              key: 'xl' + i,
              x: padL + i * stepX,
              y: H - padB + 16,
              fontSize:'10.5', fill:'#64748b', textAnchor:'middle'
            }, tarihLabelShort(d));
          }),
          rakipler.map(function(b) {
            var color = bankColor(b);
            var vals = seriesByBank[b];
            var path = '';
            vals.forEach(function(v, i) {
              if (v == null) return;
              path += (path === '' ? 'M' : 'L') + (padL + i * stepX) + ',' + scale(v) + ' ';
            });

            return h('g', { key: b },
              h('path', { d: path, fill:'none', stroke: color, strokeWidth:'2.2' }),
              vals.map(function(v, i) {
                if (v == null) return null;
                return h('circle', {
                  key: i,
                  cx: padL + i * stepX, cy: scale(v),
                  r: 3, fill: color
                });
              })
            );
          }),
          // Son dönem değer etiketleri — AYRI katman (çizgilerin üstünde).
          // Değerler birbirine yakın olduğunda etiketler üst üste binmesin diye
          // dikey çakışma çözümü uygulanır: etiketler ideal y'lerinden minimum
          // LABEL_MIN_GAP kadar ayrılana dek kaydırılır, sonra grafik alanının
          // dışına taşmayacak şekilde geri sıkıştırılır. Kaydırılan etiketler
          // kendi noktasına ince bir kılavuz çizgiyle bağlanır.
          labelItems.map(function(L) {
            var kaydi = Math.abs(L.y - L.yIdeal) > 1.5;
            return h('g', { key: 'lbl-' + L.banka },
              kaydi && h('polyline', {
                points: (L.x - 5) + ',' + L.yIdeal + ' ' +
                        (L.x - 2) + ',' + L.yIdeal + ' ' +
                        (L.x - 2) + ',' + (L.y - 3) + ' ' +
                        L.x + ',' + (L.y - 3),
                fill: 'none', stroke: L.color, strokeWidth: '0.8', opacity: '0.55'
              }),
              h('text', {
                x: L.x, y: L.y,
                fontSize:'11.5', fill: L.color,
                textAnchor:'start', fontWeight:'700'
              }, L.text)
            );
          }),
          // Hover crosshair — TrendView'deki aynı desen (satır ~5258-5275).
          hoverIdx != null && h('g', { key: 'hover-cross' },
            h('line', {
              x1: padL + hoverIdx.i * stepX, x2: padL + hoverIdx.i * stepX,
              y1: padT, y2: padT + chartH,
              stroke: '#94a3b8', strokeWidth: '1', strokeDasharray: '3,3'
            }),
            rakipler.map(function(b) {
              var v = seriesByBank[b][hoverIdx.i];
              if (v == null) return null;
              return h('circle', {
                key: 'hov-' + b,
                cx: padL + hoverIdx.i * stepX, cy: scale(v),
                r: 5, fill: bankColor(b),
                stroke: '#fff', strokeWidth: '2'
              });
            })
          )
        ),
        // HTML overlay tooltip (SVG dışında) — TrendView'deki aynı desen

  // ===============================================================
  // SNAPSHOT VIEW
  // ===============================================================
  function SnapshotView(props) {
    var measure = DATA.catalog.filter(function(m){return m.id === props.activeMeasure;})[0];
    if (!measure) return h('div', { className: 'empty-state' }, 'Ölçü seçin');

    var tarih = props.tarih;
    var isRasyo = measure.tip === 'rasyo';

    // "İlk 20 Banka Büyüklükleri" (sol, tek uzun kart) ile sağdaki 3 kartlık
    // yığın (YtD/Grup, Grup, Rakip Kartları) aynı yerde bitsin diye sol
    // panelin gerçek yüksekliği ölçülür — ama YtD kartını TEK BAŞINA o
    // yüksekliğe zorlamak yerine (eskiden öyleydi, kart orantısız
    // büyüyordu — kullanıcı isteğiyle 2026-09-10'da kaldırıldı), sağ
    // sütunun SARMALAYICISI bu yüksekliğe asgari olarak ayarlanıp 3 kart
    // arasındaki boşluk (`justify-content:space-between`) esner — her kart
    // kendi doğal boyutunda kalır. Yalnız masaüstünde (>900px) — dar
    // ekranda dashboard-grid tek sütuna iniyor, eşleme anlamsız kalır.
    var rankingRef = useRef(null);
    var scrollBoxRef = useRef(null);
    var matchHState = useState(0);
    var matchH = matchHState[0], setMatchH = matchHState[1];
    // Sol panel sağ sütundan KISAYSA büyütülecek miktar (2026-09-17
    // kullanıcı isteği: önce "altını hizala" için panelin ÖNÜNE boşluk
    // eklenmişti — bu alt kenarı hizalar ama üst kenarı bozar. Kullanıcı
    // sonra "üstten de hizala, alttan hizalamayı bozmadan" dedi. Çözüm:
    // ÖNCE panelin kendi gövdesini büyüt (.bank-rows-scroll'un max-height'i
    // — 21 satırlık taban yerine daha fazla banka satırı görünür olur,
    // içerik zaten var/gerçek, boşluk değil) — panel üstü hiç kaymaz. Bu
    // büyüme 27 bankanın tam içerik yüksekliğiyle (scrollBoxRef.scrollHeight)
    // sınırlı; nadir bir durumda sağ sütun bundan da uzunsa, KALAN fark
    // panelin ALTINA (extraGrow tükendiğinde) bir artık boşluk olarak
    // eklenir — üst asla kaymaz, alt her zaman tam hizalı kalır.
    var extraGrowState = useState(0);
    var extraGrow = extraGrowState[0], setExtraGrow = extraGrowState[1];
    var leftExtraState = useState(0);
    var leftExtra = leftExtraState[0], setLeftExtra = leftExtraState[1];
    // Başlıkların gri alanı da yatayda hizalı kalsın diye AYRICA ölçülür —
    // "Pazar Payı Değişimi (Bps)" dar sütunda sarabildiği için sol başlık
    // sağdakinden doğal olarak daha uzun olabiliyor. Bu, kart gövdesinin
    // (matchH/space-between, yukarıdaki not) esnek hizalamasından BAĞIMSIZ
    // bir mekanizma — biri başlık şeridi, diğeri kartların toplamı için.
    var headerRef = useRef(null);
    var headerMatchHState = useState(0);
    var headerMatchH = headerMatchHState[0], setHeaderMatchH = headerMatchHState[1];
    // Sağ sütunun 3 kartının DOĞAL (parent'ın minHeight/space-between'inden
    // bağımsız — flex-direction:column'da justify-content sadece aralardaki
    // boşluğu esnetir, çocukların kendi yüksekliğini değiştirmez) toplam
    // yüksekliğini ölçmek için her kart kendi sarmalayıcısında.
    var rc1Ref = useRef(null), rc2Ref = useRef(null), rc3Ref = useRef(null);
    useEffect(function() {
      function measureRanking() {
        if (window.innerWidth <= 900) {
          if (matchH !== 0) setMatchH(0);
          if (headerMatchH !== 0) setHeaderMatchH(0);
          if (leftExtra !== 0) setLeftExtra(0);
          if (extraGrow !== 0) setExtraGrow(0);
          return;
        }
        var rightNatural = 0;
        if (rc1Ref.current && rc2Ref.current && rc3Ref.current) {
          rightNatural = rc1Ref.current.getBoundingClientRect().height +
            rc2Ref.current.getBoundingClientRect().height +
            rc3Ref.current.getBoundingClientRect().height + 28; // 2 × 14px gap
        }
        if (rankingRef.current && scrollBoxRef.current && rightNatural) {
          // "chrome" = panelin scroll kutusu DIŞINDAKİ sabit kısımları
          // (başlık+footer) — CANLI ölçümlerin farkı olduğu için mevcut
          // extraGrow ne olursa olsun HER ZAMAN doğru (döngüsüz) çıkar.
          var panelH = rankingRef.current.getBoundingClientRect().height;
          var scrollClientH = scrollBoxRef.current.clientHeight;
          var scrollFullH = scrollBoxRef.current.scrollHeight;
          var chrome = panelH - scrollClientH;
          var leftBaseH = chrome + 609; // 609 = 21 satırlık taban (bkz. CSS)
          var contentCeiling = chrome + scrollFullH; // tüm bankalar görünürse ulaşılabilecek azami
          var target = Math.max(leftBaseH, rightNatural);
          if (Math.abs(target - matchH) > 2) setMatchH(target);
          var neededGrow = Math.max(0, target - leftBaseH);
          var growFromContent = Math.min(neededGrow, Math.max(0, contentCeiling - leftBaseH));
          if (Math.abs(growFromContent - extraGrow) > 2) setExtraGrow(growFromContent);
          var residual = neededGrow - growFromContent;
          if (Math.abs(residual - leftExtra) > 2) setLeftExtra(residual);
        }
        if (headerRef.current) {
          var hHgt = headerRef.current.getBoundingClientRect().height;
          if (hHgt && Math.abs(hHgt - headerMatchH) > 2) setHeaderMatchH(hHgt);
        }
      }
      measureRanking();
      window.addEventListener('resize', measureRanking);
      return function(){ window.removeEventListener('resize', measureRanking); };
    });

    var rightColStyle = { display:'flex', flexDirection:'column', gap:'14px' };
    if (matchH) { rightColStyle.minHeight = matchH + 'px'; rightColStyle.justifyContent = 'space-between'; }

    return h('div', null,
      h('div', { className: 'dashboard-grid' },
        h('div', { style: { alignSelf: 'start' } },
          // Panel üstü hiç kaymaz (yukarıdaki not) — önce panelin kendi
          // gövdesi büyür (extraGrow → daha fazla banka satırı görünür).
          // Sağ sütun bundan da uzunsa (nadir), kalan fark panelin
          // ALTINA artık bir boşluk olarak eklenir — üst yine sabit kalır.
          h(BankRanking, {
            measure: measure, tarih: tarih, panelRef: rankingRef, headerRef: headerRef,
            scrollBoxRef: scrollBoxRef, extraHeight: extraGrow
          }),
          leftExtra > 0 && h('div', { style: { height: leftExtra + 'px' } })
        ),
        h('div', { style: rightColStyle },
          h('div', { ref: rc1Ref },
            isRasyo
              ? h(GroupSummary, { measure: measure, tarih: tarih })
              : h(YtDGrowthChart, { measure: measure, tarih: tarih, headerMatchHeight: headerMatchH })
          ),
          h('div', { ref: rc2Ref },
            isRasyo
              ? h(GroupBpsChange, { measure: measure, tarih: tarih })
              : h(GroupSummary, { measure: measure, tarih: tarih })
          ),
          h('div', { ref: rc3Ref },
            isRasyo
              ? h(CompetitorTrendRatio, { measure: measure, tarih: tarih })
              : h(CompetitorCardsGrowth, { measure: measure, tarih: tarih })
          )
        )
      ),
      h('div', { className: 'snapshot-footnote' },
        h('span', null, 'Rakip Bankalar: '),
        h('em', null, 'Garanti Bankası, Yapı Kredi, Akbank, QNB Finansbank, Denizbank')
      )
    );
  }

  // ===============================================================
  // COMPOSITION VIEW — Stacked bar kompozisyon analizi

  function getCompositionData(compId, entityType, entity, tarih) {
    var d = DATA.composition_data && DATA.composition_data[compId];
    if (!d) return null;
    var byEntity = d[entityType] || {};
    var byTarih = byEntity[entity] || {};
    return byTarih[tarih] || null;
  }

  function getCurrencyData(compId, entityType, entity, tarih) {
    var d = DATA.currency_data && DATA.currency_data[compId];
    if (!d) return null;
    var byEntity = d[entityType] || {};
    var byTarih = byEntity[entity] || {};
    return byTarih[tarih] || null;
  }

  function CompositionView(props) {
    var compId = props.activeComposition || 'aktif';
    var compMeta = DATA.meta.compositions[compId];
    var allDates = DATA.meta.dates;
    var currencySupported = compMeta && compMeta.currency_supported;

    // 2026-09-08: seçimler App'te tutuluyor (props.ui) — sekme değiştirip
    // geri dönüldüğünde sıfırlanmasın diye. Trend ve Kompozisyon KENDİ
    // seçimlerini ayrı ayrı hatırlar (kullanıcı kararı).
    var ui = props.ui;
    function patchUi(patch) {
      props.setUi(function(prev){ return Object.assign({}, prev, patch); });
    }

    // Sub-tab: 'bilesen' (default) | 'doviz'
    var subTab = ui.subTab;
    function setSubTab(v) { patchUi({ subTab: v }); }
    // Eğer currency desteklenmiyorsa subTab otomatik 'bilesen'a sabitlenir
    var effectiveSubTab = (subTab === 'doviz' && currencySupported) ? 'doviz' : 'bilesen';

    var selection = ui.selection;
    function setSelection(v) { patchUi({ selection: v }); }

    // Default: son 4 dönem (App'te ilk değer olarak kuruluyor)
    var selectedDates = ui.selectedDates;
    function setSelectedDates(v) { patchUi({ selectedDates: v }); }

    // Adaptif x ekseni (2026-09-08): çok dönem seçilince tarih etiketleri
    // üst üste biniyordu. Bar alanının GERÇEK genişliği ölçülüp kaç etiketin
    // sığdığı hesaplanır; etiketler sondan geriye doğru eşit aralıkla
    // seçilir (en güncel dönem her zaman yazılır). Ölçüm, panel genişliği
    // ekrana/sütun sayısına göre değiştiği için sabit bir kuraldan daha
    // güvenilir.
    // Bar sütunu hover'ı (2026-09-08) — {head, rows, activeId, x, y}
    var compHoverState = useState(null);
    var compHover = compHoverState[0], setCompHover = compHoverState[1];
    function hoverEvt(e, head, rows, activeId) {
      setCompHover({ head: head, rows: rows, activeId: activeId,
                     x: e.clientX, y: e.clientY });
    }

    var barsRef = useRef(null);
    var barsWState = useState(0);
    var barsW = barsWState[0], setBarsW = barsWState[1];
    useEffect(function() {
      function measure() {
        if (!barsRef.current) return;
        var w = barsRef.current.getBoundingClientRect().width;
        // >4px eşiği: her render'da state güncelleyip sonsuz döngüye girmemek için
        if (w && Math.abs(w - barsW) > 4) setBarsW(w);
      }
      measure();
      window.addEventListener('resize', measure);
      return function(){ window.removeEventListener('resize', measure); };
    });
    var xLabelStep = 1;
    if (barsW > 0 && selectedDates.length > 1) {
      var maxLbl = Math.max(1, Math.floor(barsW / 62));   // "Haz 2026" ~52px + boşluk
      xLabelStep = Math.max(1, Math.ceil(selectedDates.length / maxLbl));
    }
    function xLabelFor(idx, tarih) {
      return ((selectedDates.length - 1 - idx) % xLabelStep === 0)
        ? tarihLabelShort(tarih) : '';
    }

    var bankTypeMap = {};
    DATA.meta.banks.forEach(function(b){ bankTypeMap[b.banka_adi] = b.banka_turu || ''; });
    function isKatilimBank(b){ return bankTypeMap[b] === 'Katılım Bankası'; }

    function toggleBank(b) {
      var banks = selection.banks.slice();
      var i = banks.indexOf(b);
      if (i >= 0) banks.splice(i, 1); else banks.push(b);
      setSelection({ banks: banks, groups: selection.groups });
    }
    function toggleGroup(g) {
      var groups = selection.groups.slice();
      var i = groups.indexOf(g);
      if (i >= 0) groups.splice(i, 1); else groups.push(g);
      setSelection({ banks: selection.banks, groups: groups });
    }
    function toggleDate(d) {
      var ds = selectedDates.slice();
      var i = ds.indexOf(d);
      if (i >= 0) ds.splice(i, 1);
      else { ds.push(d); ds.sort(); }
      setSelectedDates(ds);
    }

    // Date dropdown open/close + dış tıklama ile kapanma
    var dropdownOpenState = useState(false);
    var dateDropdownOpen = dropdownOpenState[0];
    var setDateDropdownOpen = dropdownOpenState[1];

    // Hızlı seçim helper'ları
    function selectLastNDates(n) {
      var sliced = allDates.slice(Math.max(0, allDates.length - n));
      setSelectedDates(sliced);
    }
    function selectYearEnds() {
      setSelectedDates(allDates.filter(function(d){ return d.endsWith('-12-31'); }));
    }
    function clearAllDates() { setSelectedDates([]); }
    function selectAllDates() { setSelectedDates(allDates.slice()); }

    // Trigger butonu için özet metin
    var triggerText;
    if (selectedDates.length === 0) triggerText = 'Dönem seçilmedi';
    else if (selectedDates.length <= 4) triggerText = selectedDates.map(tarihLabelShort).join(', ');
    else triggerText = selectedDates.length + ' dönem seçili (' +
      tarihLabelShort(selectedDates[0]) + ' → ' + tarihLabelShort(selectedDates[selectedDates.length-1]) + ')';

    var allBanks = banksByAssetSize(
      DATA.meta.banks.map(function(b){ return b.banka_adi; }));
    var allGroups = DATA.meta.group_order;

    var entities = [];
    selection.banks.forEach(function(b){
      entities.push({ type:'bank', name: b, isKT: b === KT_NAME });
    });
    selection.groups.forEach(function(g){
      entities.push({ type:'group', name: g, isKT: false });
    });

    var components = compMeta.components;

    // Currency (TP/YP) mode için 2 segment renkleri
    var TP_COLOR = '#1e3a5f';   // koyu lacivert (Türk Parası)
    var YP_COLOR = '#f97316';   // turuncu (Yabancı Para)

    function renderEntityPanelBilesen(entity) {
      var rows = selectedDates.map(function(d){
        return { tarih: d, comps: getCompositionData(compId, entity.type, entity.name, d) };
      });
      var anyData = rows.some(function(r){ return r.comps && r.comps.length > 0; });

      return h('div', { key: entity.type + ':' + entity.name, className: 'comp-panel' },
        h('div', { className: 'comp-panel-title' + (entity.isKT ? ' kt' : '') },
          entity.name + (entity.type === 'group' ? ' (grup toplamı)' : '')),
        !anyData
          ? h('div', { className: 'empty-state', style:{padding:'40px 0'} },
              'Seçili dönemlerde veri yok')
          : h('div', { className: 'comp-bars', ref: barsRef },
              rows.map(function(row, idx){
                if (!row.comps || row.comps.length === 0) {
                  return h('div', { key: idx, className: 'comp-bar-col' },
                    h('div', { className: 'comp-bar-stack',
                      style: { background: 'rgba(0,0,0,0.03)' } }),
                    h('div', { className: 'comp-bar-xlabel' }, xLabelFor(idx, row.tarih))
                  );
                }
                var pctMap = {}, valueMap = {};
                row.comps.forEach(function(c){
                  pctMap[c.id] = c.pct;
                  valueMap[c.id] = c.value;
                });
                // Tooltip satırları: TÜM bileşenler (etiketi görünmeyecek
                // kadar küçük segmentler dahil), üstten alta bar sırasıyla.
                var tipRows = components.slice().reverse()
                  .filter(function(c){ return (pctMap[c.id] || 0) > 0; })
                  .map(function(c){
                    return { id: c.id, ad: c.ad, color: c.color,
                             pct: pctMap[c.id] || 0, val: valueMap[c.id] || 0 };
                  });
                var tipHead = entity.name + ' — ' + tarihLabel(row.tarih);
                return h('div', { key: idx, className: 'comp-bar-col',
                    onMouseLeave: function(){ setCompHover(null); } },
                  h('div', { className: 'comp-bar-stack' },
                    components.map(function(c){
                      var pct = pctMap[c.id] || 0;
                      var val = valueMap[c.id] || 0;
                      if (pct < 0.5) return null;
                      return h('div', {
                        key: c.id,
                        className: 'comp-bar-segment',
                        style: { height: pct + '%', background: c.color },
                        onMouseEnter: function(e){ hoverEvt(e, tipHead, tipRows, c.id); },
                        onMouseMove: function(e){ hoverEvt(e, tipHead, tipRows, c.id); }
                      },
                        pct >= 5 && h('div', { className: 'comp-bar-segment-label' },
                          fmtPctPlain(pct, 1))
                      );
                    })
                  ),
                  h('div', { className: 'comp-bar-xlabel' }, xLabelFor(idx, row.tarih))
                );
              })
            ),
        h('div', { className: 'comp-legend' },
          components.map(function(c){
            return h('div', { key: c.id, className: 'comp-legend-item' },
              h('div', { className: 'comp-legend-swatch', style:{background: c.color}}),
              h('span', null, c.ad)
            );
          })
        )
      );
    }

    // Döviz dağılımı modu — sadece TP ve YP 2 segment, toplam kalem üzerinden
    function renderEntityPanelDoviz(entity) {
      var rows = selectedDates.map(function(d){
        return { tarih: d, cur: getCurrencyData(compId, entity.type, entity.name, d) };
      });
      var anyData = rows.some(function(r){ return r.cur != null; });

      return h('div', { key: entity.type + ':' + entity.name, className: 'comp-panel' },
        h('div', { className: 'comp-panel-title' + (entity.isKT ? ' kt' : '') },
          entity.name + (entity.type === 'group' ? ' (grup toplamı)' : '')),
        !anyData
          ? h('div', { className: 'empty-state', style:{padding:'40px 0'} },
              'Seçili dönemlerde TP/YP verisi yok')
          : h('div', { className: 'comp-bars', ref: barsRef },
              rows.map(function(row, idx){

                    h('div', { className: 'comp-bar-stack',
                      style: { background: 'rgba(0,0,0,0.03)' } }),
                    h('div', { className: 'comp-bar-xlabel' }, xLabelFor(idx, row.tarih))
                  );
                }
                // 2 segment: TP altta (alt → üst sıralama: column-reverse aktif)
                // Liste başı = ALT segment, son = ÜST segment
                // İstenen: TP altta, YP üstte → liste: [TP, YP]
                var segments = [
                  { id:'tp', label:'Türk Parası', pct: row.cur.tp_pct, val: row.cur.tp_value, color: TP_COLOR },
                  { id:'yp', label:'Yabancı Para', pct: row.cur.yp_pct, val: row.cur.yp_value, color: YP_COLOR },
                ];
                var tipRows2 = segments.slice().reverse().map(function(sg){
                  return { id: sg.id, ad: sg.label, color: sg.color, pct: sg.pct, val: sg.val };
                });
                var tipHead2 = entity.name + ' — ' + tarihLabel(row.tarih);
                return h('div', { key: idx, className: 'comp-bar-col',
                    onMouseLeave: function(){ setCompHover(null); } },
                  h('div', { className: 'comp-bar-stack' },
                    segments.map(function(s){
                      if (s.pct < 0.5) return null;
                      return h('div', {
                        key: s.id,
                        className: 'comp-bar-segment',
                        style: { height: s.pct + '%', background: s.color },
                        onMouseEnter: function(e){ hoverEvt(e, tipHead2, tipRows2, s.id); },
                        onMouseMove: function(e){ hoverEvt(e, tipHead2, tipRows2, s.id); }
                      },
                        s.pct >= 5 && h('div', { className: 'comp-bar-segment-label' },
                          fmtPctPlain(s.pct, 1))
                      );
                    })
                  ),
                  h('div', { className: 'comp-bar-xlabel' }, xLabelFor(idx, row.tarih))
                );
              })
            ),
        h('div', { className: 'comp-legend' },
          h('div', { className: 'comp-legend-item' },
            h('div', { className: 'comp-legend-swatch', style:{background: TP_COLOR}}),
            h('span', null, 'Türk Parası (TP)')
          ),
          h('div', { className: 'comp-legend-item' },
            h('div', { className: 'comp-legend-swatch', style:{background: YP_COLOR}}),
            h('span', null, 'Yabancı Para (YP)')
          )
        )
      );
    }

    function renderEntityPanel(entity) {
      return effectiveSubTab === 'doviz'
        ? renderEntityPanelDoviz(entity)
        : renderEntityPanelBilesen(entity);
    }

    return h('div', { className: 'comp-wrap' },
      h('div', { className: 'comp-controls' },
        // Alt sekme: Bileşen / Döviz dağılımı
        h('div', {
          style: { display:'flex', alignItems:'center', gap:'12px',
                   marginBottom:'12px', paddingBottom:'12px',
                   borderBottom:'1px solid rgba(148,163,184,0.2)' }
        },
          h('div', { className: 'comp-control-label', style:{margin:0} }, 'Görünüm:'),
          h('div', { className: 'comp-subtabs' },
            h('button', {
              className: 'comp-subtab' + (effectiveSubTab === 'bilesen' ? ' active' : ''),
              onClick: function(){ setSubTab('bilesen'); }
            }, 'Bileşen Dağılımı'),
            h('button', {
              className: 'comp-subtab' +
                (effectiveSubTab === 'doviz' ? ' active' : '') +
                (!currencySupported ? ' disabled' : ''),
              onClick: function(){
                if (currencySupported) setSubTab('doviz');
              },
              title: currencySupported
                ? 'Ana kalem üzerinden TP/YP dağılımı'
                : 'Gelir Tablosu kalemleri için TP/YP ayrımı raporlanmıyor'
            }, 'Döviz Dağılımı')
          ),
          !currencySupported && h('span', {
            style:{ fontSize:'11px', color:'#94a3b8', fontStyle:'italic' }
          }, '(Gelir Tablosu için TP/YP ayrımı yok)')
        ),
        h('div', { className: 'comp-control-row' },
          h('div', { className: 'comp-control-block', style:{flex:'2'} },
