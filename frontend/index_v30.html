  // ===============================================================
  // COMPOSITION VIEW — Stacked bar kompozisyon analizi
  // ===============================================================
  function getCompositionData(compId, entityType, entity, tarih) {
    var d = DATA.composition_data && DATA.composition_data[compId];
    if (!d) return null;
    var byEntity = d[entityType] || {};
    var byTarih = byEntity[entity] || {};
    return byTarih[tarih] || null;
  }

  function getCurrencyData(compId, entityType, entity, tarih) {
    var d = DATA.currency_data && DATA.currency_data[compId];
    if (!d) return null;
    var byEntity = d[entityType] || {};
    var byTarih = byEntity[entity] || {};
    return byTarih[tarih] || null;
  }

  function CompositionView(props) {
    var compId = props.activeComposition || 'aktif';
    var compMeta = DATA.meta.compositions[compId];
    var allDates = DATA.meta.dates;
    var currencySupported = compMeta && compMeta.currency_supported;

    // Sub-tab: 'bilesen' (default) | 'doviz'
    var subTabState = useState('bilesen');
    var subTab = subTabState[0];
    var setSubTab = subTabState[1];
    // Eğer currency desteklenmiyorsa subTab otomatik 'bilesen'a sabitlenir
    var effectiveSubTab = (subTab === 'doviz' && currencySupported) ? 'doviz' : 'bilesen';

    var selectionState = useState(function() {
      return { banks: [KT_NAME], groups: ['Katılım Bankaları'] };
    });
    var selection = selectionState[0];
    var setSelection = selectionState[1];

    // Default: son 4 dönem
    var dateSelState = useState(function() {
      var n = allDates.length;
      return allDates.slice(Math.max(0, n - 4));
    });
    var selectedDates = dateSelState[0];
    var setSelectedDates = dateSelState[1];

    var bankTypeMap = {};
    DATA.meta.banks.forEach(function(b){ bankTypeMap[b.banka_adi] = b.banka_turu || ''; });
    function isKatilimBank(b){ return bankTypeMap[b] === 'Katılım Bankası'; }

    function toggleBank(b) {
      var banks = selection.banks.slice();
      var i = banks.indexOf(b);
      if (i >= 0) banks.splice(i, 1); else banks.push(b);
      setSelection({ banks: banks, groups: selection.groups });
    }
    function toggleGroup(g) {
      var groups = selection.groups.slice();
      var i = groups.indexOf(g);
      if (i >= 0) groups.splice(i, 1); else groups.push(g);
      setSelection({ banks: selection.banks, groups: groups });
    }
    function toggleDate(d) {
      var ds = selectedDates.slice();
      var i = ds.indexOf(d);
      if (i >= 0) ds.splice(i, 1);
      else { ds.push(d); ds.sort(); }
      setSelectedDates(ds);
    }

    // Date dropdown open/close + dış tıklama ile kapanma
    var dropdownOpenState = useState(false);
    var dateDropdownOpen = dropdownOpenState[0];
    var setDateDropdownOpen = dropdownOpenState[1];

    // Hızlı seçim helper'ları
    function selectLastNDates(n) {
      var sliced = allDates.slice(Math.max(0, allDates.length - n));
      setSelectedDates(sliced);
    }
    function selectYearEnds() {
      setSelectedDates(allDates.filter(function(d){ return d.endsWith('-12-31'); }));
    }
    function clearAllDates() { setSelectedDates([]); }
    function selectAllDates() { setSelectedDates(allDates.slice()); }

    // Trigger butonu için özet metin
    var triggerText;
    if (selectedDates.length === 0) triggerText = 'Dönem seçilmedi';
    else if (selectedDates.length <= 4) triggerText = selectedDates.map(tarihLabelShort).join(', ');
    else triggerText = selectedDates.length + ' dönem seçili (' +
      tarihLabelShort(selectedDates[0]) + ' → ' + tarihLabelShort(selectedDates[selectedDates.length-1]) + ')';

    var allBanks = DATA.meta.banks.map(function(b){ return b.banka_adi; });
    var allGroups = DATA.meta.group_order;

    var entities = [];
    selection.banks.forEach(function(b){
      entities.push({ type:'bank', name: b, isKT: b === KT_NAME });
    });
    selection.groups.forEach(function(g){
      entities.push({ type:'group', name: g, isKT: false });
    });

    var components = compMeta.components;

    // Currency (TP/YP) mode için 2 segment renkleri
    var TP_COLOR = '#1e3a5f';   // koyu lacivert (Türk Parası)
    var YP_COLOR = '#f97316';   // turuncu (Yabancı Para)

    function renderEntityPanelBilesen(entity) {
      var rows = selectedDates.map(function(d){
        return { tarih: d, comps: getCompositionData(compId, entity.type, entity.name, d) };
      });
      var anyData = rows.some(function(r){ return r.comps && r.comps.length > 0; });

      return h('div', { key: entity.type + ':' + entity.name, className: 'comp-panel' },
        h('div', { className: 'comp-panel-title' + (entity.isKT ? ' kt' : '') },
          entity.name + (entity.type === 'group' ? ' (agrega)' : '')),
        !anyData
          ? h('div', { className: 'empty-state', style:{padding:'40px 0'} },
              'Seçili dönemlerde veri yok')
          : h('div', { className: 'comp-bars' },
              rows.map(function(row, idx){
                if (!row.comps || row.comps.length === 0) {
                  return h('div', { key: idx, className: 'comp-bar-col' },
                    h('div', { className: 'comp-bar-stack',
                      style: { background: 'rgba(0,0,0,0.03)' } }),
                    h('div', { className: 'comp-bar-xlabel' }, tarihLabelShort(row.tarih))
                  );
                }
                var pctMap = {}, valueMap = {};
                row.comps.forEach(function(c){
                  pctMap[c.id] = c.pct;
                  valueMap[c.id] = c.value;
                });
                return h('div', { key: idx, className: 'comp-bar-col' },
                  h('div', { className: 'comp-bar-stack' },
                    components.map(function(c){
                      var pct = pctMap[c.id] || 0;
                      var val = valueMap[c.id] || 0;
                      if (pct < 0.5) return null;
                      return h('div', {
                        key: c.id,
                        className: 'comp-bar-segment',
                        style: { height: pct + '%', background: c.color },
                        title: c.ad + ': ' + fmtPctPlain(pct, 2) + ' (' + fmtTLAbbr(val) + ')'
                      },
                        pct >= 6 && h('div', { className: 'comp-bar-segment-label' },
                          fmtPctPlain(pct, 1))
                      );
                    })
                  ),
                  h('div', { className: 'comp-bar-xlabel' }, tarihLabelShort(row.tarih))
                );
              })
            ),
        h('div', { className: 'comp-legend' },
          components.map(function(c){
            return h('div', { key: c.id, className: 'comp-legend-item' },
              h('div', { className: 'comp-legend-swatch', style:{background: c.color}}),
              h('span', null, c.ad)
            );
          })
        )
      );
    }

    // Döviz dağılımı modu — sadece TP ve YP 2 segment, toplam kalem üzerinden
    function renderEntityPanelDoviz(entity) {
      var rows = selectedDates.map(function(d){
        return { tarih: d, cur: getCurrencyData(compId, entity.type, entity.name, d) };
      });
      var anyData = rows.some(function(r){ return r.cur != null; });

      return h('div', { key: entity.type + ':' + entity.name, className: 'comp-panel' },
        h('div', { className: 'comp-panel-title' + (entity.isKT ? ' kt' : '') },
          entity.name + (entity.type === 'group' ? ' (agrega)' : '')),
        !anyData
          ? h('div', { className: 'empty-state', style:{padding:'40px 0'} },
              'Seçili dönemlerde TP/YP verisi yok')
          : h('div', { className: 'comp-bars' },
              rows.map(function(row, idx){
                if (!row.cur) {
                  return h('div', { key: idx, className: 'comp-bar-col' },
                    h('div', { className: 'comp-bar-stack',
                      style: { background: 'rgba(0,0,0,0.03)' } }),
                    h('div', { className: 'comp-bar-xlabel' }, tarihLabelShort(row.tarih))
                  );
                }
                // 2 segment: TP altta (alt → üst sıralama: column-reverse aktif)
                // Liste başı = ALT segment, son = ÜST segment
                // İstenen: TP altta, YP üstte → liste: [TP, YP]
                var segments = [
                  { id:'tp', label:'Türk Parası', pct: row.cur.tp_pct, val: row.cur.tp_value, color: TP_COLOR },
                  { id:'yp', label:'Yabancı Para', pct: row.cur.yp_pct, val: row.cur.yp_value, color: YP_COLOR },
                ];
                return h('div', { key: idx, className: 'comp-bar-col' },
                  h('div', { className: 'comp-bar-stack' },
                    segments.map(function(s){
                      if (s.pct < 0.5) return null;
                      return h('div', {
                        key: s.id,
                        className: 'comp-bar-segment',
                        style: { height: s.pct + '%', background: s.color },
                        title: s.label + ': ' + fmtPctPlain(s.pct, 2) + ' (' + fmtTLAbbr(s.val) + ')'
                      },
                        s.pct >= 6 && h('div', { className: 'comp-bar-segment-label' },
                          fmtPctPlain(s.pct, 1))
                      );
                    })
                  ),
                  h('div', { className: 'comp-bar-xlabel' }, tarihLabelShort(row.tarih))
                );
              })
            ),
        h('div', { className: 'comp-legend' },
          h('div', { className: 'comp-legend-item' },
            h('div', { className: 'comp-legend-swatch', style:{background: TP_COLOR}}),
            h('span', null, 'Türk Parası (TP)')
          ),
          h('div', { className: 'comp-legend-item' },
            h('div', { className: 'comp-legend-swatch', style:{background: YP_COLOR}}),
            h('span', null, 'Yabancı Para (YP)')
          )
        )
      );
    }

    function renderEntityPanel(entity) {
      return effectiveSubTab === 'doviz'
        ? renderEntityPanelDoviz(entity)
        : renderEntityPanelBilesen(entity);
    }

    return h('div', { className: 'comp-wrap' },
      h('div', { className: 'comp-controls' },
        // Alt sekme: Bileşen / Döviz dağılımı
        h('div', {
          style: { display:'flex', alignItems:'center', gap:'12px',
                   marginBottom:'12px', paddingBottom:'12px',
                   borderBottom:'1px solid rgba(148,163,184,0.2)' }
        },
          h('div', { className: 'comp-control-label', style:{margin:0} }, 'Görünüm:'),
          h('div', { className: 'comp-subtabs' },
            h('button', {
              className: 'comp-subtab' + (effectiveSubTab === 'bilesen' ? ' active' : ''),
              onClick: function(){ setSubTab('bilesen'); }
            }, 'Bileşen Dağılımı'),
            h('button', {
              className: 'comp-subtab' +
                (effectiveSubTab === 'doviz' ? ' active' : '') +
                (!currencySupported ? ' disabled' : ''),
              onClick: function(){
                if (currencySupported) setSubTab('doviz');
              },
              title: currencySupported
                ? 'Ana kalem üzerinden TP/YP dağılımı'
                : 'Gelir Tablosu kalemleri için TP/YP ayrımı raporlanmıyor'
            }, 'Döviz Dağılımı')
          ),
          !currencySupported && h('span', {
            style:{ fontSize:'11px', color:'#94a3b8', fontStyle:'italic' }
          }, '(Gelir Tablosu için TP/YP ayrımı yok)')
        ),
        h('div', { className: 'comp-control-row' },
          h('div', { className: 'comp-control-block', style:{flex:'2'} },
            h('div', { className: 'comp-control-label' },
              'Bankalar (' + selection.banks.length + ' seçili)'),
            h('div', { className: 'chip-container' },
              allBanks.map(function(b){
                var sel = selection.banks.indexOf(b) >= 0;
                var isKT = b === KT_NAME;
                var isK = isKatilimBank(b);
                var cls = 'chip';
                if (sel) cls += ' selected';
                else if (isKT) cls += ' kt-style';
                else if (isK) cls += ' katilim';
                return h('div', {
                  key: b, className: cls,
                  style: sel ? { background: bankColor(b), borderColor: bankColor(b) } : null,
                  onClick: function(){ toggleBank(b); }
                }, b);
              })
            )
          ),
          h('div', { className: 'comp-control-block' },
            h('div', { className: 'comp-control-label' },
              'Banka Grupları (' + selection.groups.length + ' seçili)'),
            h('div', { className: 'chip-container' },
              allGroups.map(function(g){
                var sel = selection.groups.indexOf(g) >= 0;
                return h('div', {
                  key: g, className: 'chip group-style' + (sel ? ' selected' : ''),
                  onClick: function(){ toggleGroup(g); }
                }, g);
              })
            )
          )
        ),
        h('div', {
          className: 'comp-control-block',
          style:{ marginTop:'12px', flex:'auto' }
        },
          h('div', { className: 'comp-control-label' },
            'Dönemler (' + selectedDates.length + ' seçili)'),
          h('div', { className: 'date-multi' },
            h('div', {
              className: 'date-multi-trigger' + (dateDropdownOpen ? ' open' : ''),
              onClick: function(){ setDateDropdownOpen(!dateDropdownOpen); }
            },
              h('span', { className: 'date-multi-trigger-text' }, triggerText),
              h('span', { className: 'date-multi-trigger-caret' }, '▼')
            ),
            dateDropdownOpen && h('div', { className: 'date-multi-panel' },
              h('div', { className: 'date-multi-panel-actions' },
                h('span', { className: 'date-multi-action',
                  onClick: function(){ selectLastNDates(4); }
                }, 'Son 4 çeyrek'),
                h('span', { className: 'date-multi-action',
                  onClick: function(){ selectLastNDates(8); }
                }, 'Son 8 çeyrek'),
                h('span', { className: 'date-multi-action',
                  onClick: function(){ selectLastNDates(12); }
                }, 'Son 3 yıl'),
                h('span', { className: 'date-multi-action',
                  onClick: selectYearEnds
                }, 'Yıl sonları'),
                h('span', { className: 'date-multi-action',
                  onClick: selectAllDates
                }, 'Tümü'),
                h('span', { className: 'date-multi-action',
                  onClick: clearAllDates
                }, 'Temizle')
              ),
              h('div', { className: 'date-multi-grid' },
                allDates.slice().reverse().map(function(d){
                  var sel = selectedDates.indexOf(d) >= 0;
                  return h('div', {
                    key: d,
                    className: 'comp-date-chip' + (sel ? ' selected' : ''),
                    onClick: function(){ toggleDate(d); }
                  }, tarihLabelShort(d));
                })
              )
            )
          )
        )
      ),
      entities.length === 0
        ? h('div', { className: 'empty-state' }, 'En az 1 banka veya banka grubu seçin.')
        : selectedDates.length === 0
          ? h('div', { className: 'empty-state' }, 'En az 1 dönem seçin.')
          : h('div', { className: 'comp-grid' },
              entities.map(function(e){ return renderEntityPanel(e); }))
    );
  }

  // ===============================================================
  // TREND VIEW — with final-value labels
  // ===============================================================
  function TrendView(props) {
    var measure = DATA.catalog.filter(function(m){return m.id === props.activeMeasure;})[0];
    if (!measure) return h('div', { className:'empty-state' }, 'Measure seçin');

    var isRasyo = measure.tip === 'rasyo';
    var allDates = DATA.meta.dates;

    // Hover tooltip state — hangi tarih index'inin üzerindeyiz
    var hoverState = useState(null);  // null veya { i: number, x: number, y: number }
    var hoverIdx = hoverState[0];
    var setHoverIdx = hoverState[1];

    // Banka türü lookup (Katılım Bankası mı?)
    var bankTypeMap = {};
    DATA.meta.banks.forEach(function(b) {
      bankTypeMap[b.banka_adi] = b.banka_turu || '';
    });
    function isKatilimBank(b) {
      return bankTypeMap[b] === 'Katılım Bankası';
    }

    var selectionState = useState(function() {
      return { banks: [KT_NAME], groups: ['Katılım Bankaları'] };
    });
    var selection = selectionState[0];
    var setSelection = selectionState[1];

    // Görünüm modu: value | ytd | yoy | qoq | ms
    // Rasyolarda sadece 'value' geçerli; diğer modlar disabled.
    var viewModeState = useState('value');
    var viewMode = viewModeState[0];
    var setViewMode = viewModeState[1];
    // Rasyo seçilirse mode'u value'ya zorla
    var effectiveMode = isRasyo ? 'value' : viewMode;

    // Yılsonu modu state'i
    var yearEndState = useState(false);
    var yearEnd = yearEndState[0];
    var setYearEnd = yearEndState[1];

    // Tüm tarihler veya sadece yıl sonları (12-31)
    var availableDates = yearEnd
      ? allDates.filter(function(d){ return d.endsWith('-12-31'); })
      : allDates;

    var rangeState = useState(function() {
      var endIdx = allDates.length - 1;
      var startIdx = Math.max(0, endIdx - 11);
      return { start: allDates[startIdx], end: allDates[endIdx] };
    });
    var range = rangeState[0];
    var setRange = rangeState[1];

    // Yılsonu toggle değiştiğinde range'i de uyarla
    useEffect(function() {
      if (yearEnd) {
        // Range'in start ve end'ini en yakın yıl sonuna çek
        var yEnds = allDates.filter(function(d){ return d.endsWith('-12-31'); });
        if (yEnds.length === 0) return;
        var newStart = range.start;
        var newEnd = range.end;
        if (!newStart.endsWith('-12-31')) {
          // Range.start'a en yakın geriye gidip 12-31 bul
          var sy = parseInt(newStart.split('-')[0]);
          var candidate = (sy - 1) + '-12-31';
          while (yEnds.indexOf(candidate) < 0 && sy > 2010) {
            sy--; candidate = (sy - 1) + '-12-31';
          }
          newStart = yEnds.indexOf(candidate) >= 0 ? candidate : yEnds[0];
        }
        if (!newEnd.endsWith('-12-31')) {
          var ey = parseInt(newEnd.split('-')[0]);
          var candE = (ey - 1) + '-12-31';
          while (yEnds.indexOf(candE) < 0 && ey > 2010) {
            ey--; candE = (ey - 1) + '-12-31';
          }
          newEnd = yEnds.indexOf(candE) >= 0 ? candE : yEnds[yEnds.length - 1];
        }
        if (newStart !== range.start || newEnd !== range.end) {
          setRange({ start: newStart, end: newEnd });
        }
      }
    }, [yearEnd]);

    function toggleBank(b) {
      var banks = selection.banks.slice();
      var i = banks.indexOf(b);
      if (i >= 0) banks.splice(i, 1);
      else banks.push(b);
      setSelection({ banks: banks, groups: selection.groups });
    }
    function toggleGroup(g) {
      var groups = selection.groups.slice();
      var i = groups.indexOf(g);
      if (i >= 0) groups.splice(i, 1);
      else groups.push(g);
      setSelection({ banks: selection.banks, groups: groups });
    }

    // filteredDates: kullanıcı aralığı + yılsonu filtresi
    var startIdx = allDates.indexOf(range.start);
    var endIdx = allDates.indexOf(range.end);
    if (startIdx < 0) startIdx = 0;
    if (endIdx < 0) endIdx = allDates.length - 1;
    if (startIdx > endIdx) { var tmp = startIdx; startIdx = endIdx; endIdx = tmp; }
    var rawFiltered = allDates.slice(startIdx, endIdx + 1);
    var filteredDates = yearEnd
      ? rawFiltered.filter(function(d){ return d.endsWith('-12-31'); })
      : rawFiltered;

    var series = [];
    selection.banks.forEach(function(b) {
      var vals = filteredDates.map(function(d){
        return trendValue(measure.id, b, d, effectiveMode, false);
      });
      series.push({ name: b, type:'bank', color: bankColor(b), textColor: bankTextColor(b), values: vals });
    });
    selection.groups.forEach(function(g) {
      var vals = filteredDates.map(function(d){
        return trendValue(measure.id, g, d, effectiveMode, true);
      });
      var color = DATA.meta.group_colors[g] || '#559D87';
      series.push({ name: g + ' (agrega)', type:'group', color: color, textColor: darkSafeColor(color), values: vals, dashed: true });
    });

    var W = 1000, H = 420;
    var padL = 60, padR = 80, padT = 30, padB = 50;
    var chartW = W - padL - padR;
    var chartH = H - padT - padB;

    var allVals = [];
    series.forEach(function(s){
      s.values.forEach(function(v){ if (v != null) allVals.push(v); });
    });

    var noData = allVals.length === 0;
    var min, max, range_v, scale, stepX;
    if (!noData) {
      min = Math.min.apply(null, allVals);
      max = Math.max.apply(null, allVals);
      range_v = max - min || 1;
      min = min - range_v * 0.08;
      max = max + range_v * 0.08;
      range_v = max - min;
      stepX = filteredDates.length > 1 ? chartW / (filteredDates.length - 1) : chartW;
      scale = function(v){ return padT + chartH - ((v - min) / range_v) * chartH; };
    }

    // Y ekseni format: mode'a göre değişir
    // - 'value' + büyüklük → mn/mlr/T
    // - 'value' + rasyo   → measure birimine göre (%, kat, TL, adet)
    // - 'ytd'/'yoy'/'qoq'/'ms' → her zaman % (bunlar DEĞİŞİM oranları,
    //   measure'ın kendi biriminden bağımsızdır)
    var isValueMode = (effectiveMode === 'value');
    var isPercentMode = !isValueMode || isRasyo;
    function formatY(v) {
      if (isValueMode && isRasyo) return fmtMeasure(v, measure, 1);
      if (isPercentMode) return fmtPct(v, 1);
      var abs = Math.abs(v);
      if (abs >= 1e12) return (v/1e12).toFixed(1).replace('.', ',') + 'T';
      if (abs >= 1e9) return (v/1e9).toFixed(0) + ' mlr';
      if (abs >= 1e6) return (v/1e6).toFixed(0) + ' mn';
      return fmtNum(v, 0);
    }
    function formatFinal(v) {
      if (isValueMode && isRasyo) return fmtMeasure(v, measure, 2);
      if (isPercentMode) return fmtPctPlain(v, 1);
      var abs = Math.abs(v);
      if (abs >= 1e12) return (v/1e12).toFixed(2).replace('.', ',') + 'T';
      if (abs >= 1e9) return (v/1e9).toFixed(0) + ' mlr';
      if (abs >= 1e6) return (v/1e6).toFixed(0) + ' mn';
      return fmtNum(v, 0);
    }

    var allBanks = DATA.meta.banks.map(function(b){ return b.banka_adi; });
    var allGroups = DATA.meta.group_order;

    return h('div', { className: 'trend-wrap' },
      h('div', { className: 'trend-controls' },
        h('div', { className: 'trend-control-row' },
          h('div', { className: 'trend-control-block', style:{flex:'2'} },
            h('div', { className: 'trend-control-label' },
              'Bankalar (' + selection.banks.length + ' seçili)'),
            h('div', { className: 'chip-container' },
              allBanks.map(function(b) {
                var selected = selection.banks.indexOf(b) >= 0;
                var isKT = b === KT_NAME;
                var isKatilim = isKatilimBank(b);
                var cls = 'chip';
                if (selected) cls += ' selected';
                else {
                  if (isKT) cls += ' kt-style';
                  else if (isKatilim) cls += ' katilim';
                }
                return h('div', {
                  key: b,
                  className: cls,
                  style: selected ? { background: bankColor(b), borderColor: bankColor(b) } : null,
                  onClick: function(){ toggleBank(b); }
                }, b);
              })
            )
          ),
          h('div', { className: 'trend-control-block' },
            h('div', { className: 'trend-control-label' },
              'Banka Grupları (' + selection.groups.length + ' seçili)'),
            h('div', { className: 'chip-container' },
              allGroups.map(function(g) {
                var selected = selection.groups.indexOf(g) >= 0;
                return h('div', {
                  key: g,
                  className: 'chip group-style' + (selected ? ' selected' : ''),
                  onClick: function(){ toggleGroup(g); }
                }, g);
              })
            )
          )
        ),
        h('div', {
          className: 'trend-date-row',
          style: { marginTop: '12px', flexWrap: 'wrap' }
        },
          h('span', { className:'trend-control-label', style:{margin:0} }, 'Dönem:'),
          h('select', {
            value: range.start,
            onChange: function(e){ setRange({ start: e.target.value, end: range.end }); }
          }, availableDates.map(function(d){ return h('option', { key: d, value: d }, tarihLabel(d)); })),
          h('span', null, '→'),
          h('select', {
            value: range.end,
            onChange: function(e){ setRange({ start: range.start, end: e.target.value }); }
          }, availableDates.map(function(d){ return h('option', { key: d, value: d }, tarihLabel(d)); })),
          // Yılsonu toggle
          h('label', {
            className: 'year-end-toggle' + (yearEnd ? ' active' : ''),
            style: { marginLeft: '12px' }
          },
            h('input', {
              type: 'checkbox',
              checked: yearEnd,
              onChange: function(e){ setYearEnd(e.target.checked); }
            }),
            h('span', null, 'Yılsonu')
          ),
          // Görünüm dropdown'u — Değer / YtD / YoY / QoQ / Pazar Payı
          h('span', {
            className:'trend-control-label',
            style:{ margin:0, marginLeft:'18px' }
          }, 'Görünüm:'),
          h('select', {
            value: viewMode,
            disabled: isRasyo,
            title: isRasyo
              ? 'Rasyo measure\'larında sadece Değer trendi anlamlıdır'
              : 'Trend görünüm modunu seç',
            style: isRasyo ? { opacity: 0.5, cursor: 'not-allowed' } : null,
            onChange: function(e){ setViewMode(e.target.value); }
          },
            h('option', { value: 'value' }, 'Değer'),
            h('option', { value: 'ytd' }, 'YtD Büyüme'),
            h('option', { value: 'yoy' }, 'YoY Büyüme'),
            h('option', { value: 'qoq' }, 'QoQ Büyüme'),
            h('option', { value: 'ms' }, 'Pazar Payı')
          )
        )
      ),
      h('div', { className: 'trend-chart-wrap' },
        h('div', {
          style:{ textAlign:'center', fontSize:'14px', fontWeight:'600', marginBottom:'10px' }
        }, measure.ad + ' — ' + trendModeLabel(effectiveMode) + ' Trend'),
        noData
          ? h('div', { className:'empty-state' },
              selection.banks.length + selection.groups.length === 0
                ? 'En az 1 banka veya grup seçin.'
                : (effectiveMode !== 'value'
                    ? 'Seçili dönemde ' + trendModeLabel(effectiveMode) + ' hesaplanamadı (yetersiz baz dönem verisi).'
                    : 'Seçili kriterlerde veri yok.')
            )
          : h('div', {
              className: 'trend-svg-wrap',
              onMouseMove: function(e) {
                var rect = e.currentTarget.getBoundingClientRect();
                // SVG viewBox: 0..W, gerçek genişlik rect.width
                // Mouse x → viewBox x: (clientX - rect.left) / rect.width * W
                var vbX = (e.clientX - rect.left) / rect.width * W;
                // En yakın data index'ini bul
                var iApprox = (vbX - padL) / stepX;
                var i = Math.round(iApprox);
                if (i < 0) i = 0;
                if (i >= filteredDates.length) i = filteredDates.length - 1;
                // X bandının dışına çıkıldıysa (sağ veya sol marjin) gizle
                if (vbX < padL - 5 || vbX > W - padR + 5) {
                  setHoverIdx(null);
                } else {
                  setHoverIdx({ i: i, mouseX: e.clientX - rect.left, mouseY: e.clientY - rect.top });
                }
              },
              onMouseLeave: function(){ setHoverIdx(null); }
            },
              h('svg', { viewBox: '0 0 '+W+' '+H, style:{width:'100%', height:'auto', display:'block'}},
              [0, 0.25, 0.5, 0.75, 1].map(function(p, i) {
                var yVal = min + (1 - p) * range_v;
                return h('g', { key: 'gy'+i },
                  h('line', {
                    x1: padL, x2: W - padR,
                    y1: padT + p * chartH, y2: padT + p * chartH,
                    stroke: '#e2e8f0', strokeDasharray: '2,3'
                  }),
                  h('text', {
                    x: padL - 6, y: padT + p * chartH + 3,
                    fontSize:'10', fill:'#64748b', textAnchor:'end'
                  }, formatY(yVal))
                );
              }),
              filteredDates.map(function(d, i) {
                var step = Math.max(1, Math.floor(filteredDates.length / 10));
                if (i % step !== 0 && i !== filteredDates.length - 1) return null;
                return h('text', {
                  key: 'xl' + i,
                  x: padL + i * stepX,
                  y: H - padB + 18,
                  fontSize:'10', fill:'#64748b', textAnchor:'middle'
                }, tarihLabelShort(d));
              }),
              // 0 referans çizgisi — büyüme modlarında ve 0 chart aralığındaysa
              (effectiveMode === 'ytd' || effectiveMode === 'yoy' || effectiveMode === 'qoq')
                && min < 0 && max > 0
                && h('g', { key: 'zero-ref' },
                  h('line', {
                    x1: padL, x2: W - padR,
                    y1: scale(0), y2: scale(0),
                    stroke: '#94a3b8', strokeWidth: '1.2', strokeDasharray: '4,2'
                  }),
                  h('text', {
                    x: W - padR + 4, y: scale(0) + 3,
                    fontSize:'9', fill:'#94a3b8', textAnchor:'start'
                  }, '0%')
                ),
              series.map(function(s, si) {
                var path = '';
                s.values.forEach(function(v, i) {
                  if (v == null) return;
                  path += (path === '' ? 'M' : 'L') + (padL + i * stepX) + ',' + scale(v) + ' ';
                });

                // Son dönemin değeri + label için nokta
                var lastValidIdx = -1;
                for (var li = s.values.length - 1; li >= 0; li--) {
                  if (s.values[li] != null) { lastValidIdx = li; break; }
                }

                return h('g', { key: s.name },
                  h('path', {
                    d: path, fill:'none',
                    stroke: s.color, strokeWidth:'2.2',
                    strokeDasharray: s.dashed ? '6,3' : 'none'
                  }),
                  s.values.map(function(v, i) {
                    if (v == null) return null;
                    return h('circle', {
                      key: i,
                      cx: padL + i * stepX, cy: scale(v),
                      r: 3, fill: s.color
                    });
                  }),
                  // Son dönem label'ı — textColor: karanlık modda okunur (bkz. darkSafeColor)
                  lastValidIdx >= 0 && h('text', {
                    x: padL + lastValidIdx * stepX + 8,
                    y: scale(s.values[lastValidIdx]) + 4,
                    fontSize: '11', fill: s.textColor,
                    fontWeight: '700',
                    textAnchor: 'start'
                  }, formatFinal(s.values[lastValidIdx]))
                );
              }),
              // Legend
              h('g', { transform: 'translate('+(padL + 10)+',' + (padT + 10) + ')' },
                series.map(function(s, si) {
                  return h('g', { key: s.name, transform: 'translate(0,' + (si * 16) + ')' },
                    h('line', {
                      x1: 0, x2: 18, y1: 5, y2: 5,
                      stroke: s.color, strokeWidth: '2.5',
                      strokeDasharray: s.dashed ? '4,2' : 'none'
                    }),
                    h('text', {
                      x: 24, y: 8,
                      fontSize: '11', fill: darkSafeColor('#334155'), fontWeight: '600'
                    }, s.name)
                  );
                })
              ),
              // Hover crosshair: dikey çizgi + her seri için vurgulanmış nokta
              hoverIdx != null && h('g', { key: 'hover-cross' },
                h('line', {
                  x1: padL + hoverIdx.i * stepX, x2: padL + hoverIdx.i * stepX,
                  y1: padT, y2: padT + chartH,
                  stroke: '#94a3b8', strokeWidth: '1', strokeDasharray: '3,3'
                }),
                series.map(function(s) {
                  var v = s.values[hoverIdx.i];
                  if (v == null) return null;
                  return h('circle', {
                    key: 'hov-' + s.name,
                    cx: padL + hoverIdx.i * stepX, cy: scale(v),
                    r: 5,
                    fill: s.color,
                    stroke: '#fff', strokeWidth: '2'
                  });
                })
              )
            ),
            // HTML overlay tooltip (SVG dışında)
            hoverIdx != null && (function(){
              // Tooltip pozisyonu: hover noktasının üstünde
              // Tooltip'in solunu/sağını ekran kenarına göre kelepçele
              var tooltipRows = series.filter(function(s){
                return s.values[hoverIdx.i] != null;
              });
              if (tooltipRows.length === 0) return null;
              return h('div', {
                className: 'trend-tooltip',
                style: {
                  left: hoverIdx.mouseX + 'px',
                  top: hoverIdx.mouseY + 'px'
                }
              },
                h('div', { className: 'trend-tooltip-date' },
                  tarihLabel(filteredDates[hoverIdx.i])),
                tooltipRows.map(function(s){
                  return h('div', { key: s.name, className: 'trend-tooltip-row' },
                    h('div', { className:'trend-tooltip-dot', style:{background:s.color}}),
                    h('div', { className:'trend-tooltip-name' }, s.name),
                    h('div', { className:'trend-tooltip-value' },
                      formatFinal(s.values[hoverIdx.i]))
                  );
                })
              );
            })()
            )
      )
    );
  }

  // ===============================================================
  // EXPORT VIEW
  // ===============================================================
  // Hierarchik measure tree, banka/grup multi-select, tarih aralığı.
  // Tablo formatı: Wide (Banka × Tarih satır, Measure'lar kolon).
  // Excel export: SheetJS (XLSX), CSV fallback de mevcut.
  // ===============================================================

  // Sayı formatlayıcı: tip ve birim'e göre
  function fmtExportValue(value, measure) {
    if (value === null || value === undefined) return null;
    if (typeof value !== 'number' || isNaN(value)) return null;
    if (measure.tip === 'rasyo') {
      return value.toFixed(2);
    }
    // büyüklük: Türkçe binlik formatı (nokta ile)
    return Math.round(value).toLocaleString('tr-TR');
  }

  // Sayı formatlayıcı (Excel için): raw number ya da null
  function rawExportValue(value, measure) {
    if (value === null || value === undefined) return null;
    if (typeof value !== 'number' || isNaN(value)) return null;
    if (measure.tip === 'rasyo') return Number(value.toFixed(4));
    return Math.round(value);
  }

  function ExportView() {
    // ----------------------------------------------------
    // STATE
    // ----------------------------------------------------
    // entityMode: 'banks' | 'groups'
    var entityModeState = useState('banks');
    var entityMode = entityModeState[0];
    var setEntityMode = entityModeState[1];

    // selectedEntities: Set olarak tutuluyor ama state için dict {name: true}
    var selectedBanksState = useState(function(){ return {}; });
    var selectedBanks = selectedBanksState[0];
    var setSelectedBanks = selectedBanksState[1];

    var selectedGroupsState = useState(function(){ return {}; });
    var selectedGroups = selectedGroupsState[0];
    var setSelectedGroups = selectedGroupsState[1];

    // Tarih aralığı (date string olarak)
    var dates = DATA.meta.dates;
    var dateStartState = useState(dates[Math.max(0, dates.length - 8)]);  // son 8 dönem default
    var dateStart = dateStartState[0];
    var setDateStart = dateStartState[1];

    var dateEndState = useState(dates[dates.length - 1]);
    var dateEnd = dateEndState[0];
    var setDateEnd = dateEndState[1];

    // Seçili measure'lar: {measure_id: true}
    var selectedMeasuresState = useState(function(){ return {}; });
    var selectedMeasures = selectedMeasuresState[0];
    var setSelectedMeasures = selectedMeasuresState[1];

    // Tree expanded nodes
    var expandedState = useState(function(){
      var e = {};
      DATA.catalog.forEach(function(m){
        e['cat:' + m.kategori] = true;  // Tüm kategoriler default açık
      });
      return e;
    });
    var expanded = expandedState[0];
    var setExpanded = expandedState[1];

    // Tree filtre/arama
    var treeFilterState = useState('');
    var treeFilter = treeFilterState[0];
    var setTreeFilter = treeFilterState[1];

    // Generated table data
    var tableState = useState(null);  // null | { rows, measures, totalRows, displayedRows }
    var table = tableState[0];
    var setTable = tableState[1];

    // ----------------------------------------------------
    // HİYERARŞİ
    // ----------------------------------------------------
    var hierarchy = useMemo(function(){
      var h = {};
      DATA.catalog.forEach(function(m){
        var k = m.kategori;
        var s = m.alt_kategori || 'Genel';
        if (!h[k]) h[k] = { _order: [], _measures: 0, _available: 0 };
        if (!h[k][s]) { h[k][s] = []; h[k]._order.push(s); }
        h[k][s].push(m);
        h[k]._measures++;
        if (DATA.bank_data[m.id]) h[k]._available++;
      });
      return h;
    }, []);

    // Available measure id'leri (bank_data içinde olanlar)
    var availableIds = useMemo(function(){
      var s = {};
      DATA.meta.available_measures.forEach(function(id){ s[id] = true; });
      return s;
    }, []);

    // Filtre uygulanan tree
    var filteredTree = useMemo(function(){
      if (!treeFilter) return null;
      var q = treeFilter.toLowerCase().trim();
      // Eşleşen measure id'lerini topla
      var matches = {};
      DATA.catalog.forEach(function(m){
        if (m.ad.toLowerCase().indexOf(q) !== -1 || m.id.toLowerCase().indexOf(q) !== -1) {
          matches[m.id] = true;
        }
      });
      return matches;
    }, [treeFilter]);

    // ----------------------------------------------------
    // ENTITY HELPERS
    // ----------------------------------------------------
    var allBankNames = DATA.meta.banks.map(function(b){ return b.banka_adi; });
    var allGroupNames = DATA.meta.group_order;
    var rakipBanks = DATA.meta.banks.filter(function(b){ return b.rakip; }).map(function(b){ return b.banka_adi; });

    function toggleBank(name) {
      var n = Object.assign({}, selectedBanks);
      if (n[name]) delete n[name]; else n[name] = true;
      setSelectedBanks(n);
    }
    function toggleGroup(name) {
      var n = Object.assign({}, selectedGroups);
      if (n[name]) delete n[name]; else n[name] = true;
      setSelectedGroups(n);
    }

    function quickSelectBanks(action) {
      if (action === 'all') {
        var all = {};
        allBankNames.forEach(function(b){ all[b] = true; });
        setSelectedBanks(all);
      } else if (action === 'none') {
        setSelectedBanks({});
      } else if (action === 'kt') {
        setSelectedBanks({ 'Kuveyt Türk': true });
      } else if (action === 'rakip') {
        var r = {};
        rakipBanks.forEach(function(b){ r[b] = true; });
        setSelectedBanks(r);
      } else if (action === 'kt+rakip') {
        var r = { 'Kuveyt Türk': true };
        rakipBanks.forEach(function(b){ r[b] = true; });
        setSelectedBanks(r);
      } else if (action === 'top10') {
        // En son tarihteki top-20'nin ilk 10'u
        var lastDate = dates[dates.length - 1];
        var top20 = DATA.meta.top20_by_date[lastDate] || [];
        var t = {};
        top20.slice(0, 10).forEach(function(b){ t[b] = true; });
        setSelectedBanks(t);
      }
    }
    function quickSelectGroups(action) {
      if (action === 'all') {
        var all = {};
        allGroupNames.forEach(function(g){ all[g] = true; });
        setSelectedGroups(all);
      } else if (action === 'none') {
        setSelectedGroups({});
      } else if (action === 'kt+grp') {
        setSelectedGroups({ 'Kuveyt Türk': true, 'KT Hariç Katılım Bankaları': true, 'Mevduat Bankaları': true });
      }
    }

    // ----------------------------------------------------
    // TREE — CASCADE LOGIC
    // ----------------------------------------------------
    function getCategoryAvailableMeasures(kategori) {
      var hr = hierarchy[kategori];
      if (!hr) return [];
      var out = [];
      hr._order.forEach(function(s){
        hr[s].forEach(function(m){
          if (availableIds[m.id]) out.push(m.id);
        });
      });
      return out;
    }
    function getSubCategoryAvailableMeasures(kategori, alt) {
      var ms = (hierarchy[kategori] && hierarchy[kategori][alt]) || [];
      return ms.filter(function(m){ return availableIds[m.id]; }).map(function(m){ return m.id; });
    }

    function categoryCheckState(kategori) {
      var ids = getCategoryAvailableMeasures(kategori);
      if (ids.length === 0) return 'unchecked';
      var checked = ids.filter(function(id){ return selectedMeasures[id]; }).length;
      if (checked === 0) return 'unchecked';
      if (checked === ids.length) return 'checked';
      return 'indeterminate';
    }
    function subCategoryCheckState(kategori, alt) {
      var ids = getSubCategoryAvailableMeasures(kategori, alt);
      if (ids.length === 0) return 'unchecked';
      var checked = ids.filter(function(id){ return selectedMeasures[id]; }).length;
      if (checked === 0) return 'unchecked';
      if (checked === ids.length) return 'checked';
      return 'indeterminate';
    }

    function toggleCategory(kategori) {
      var ids = getCategoryAvailableMeasures(kategori);
      var n = Object.assign({}, selectedMeasures);
      var allChecked = ids.every(function(id){ return n[id]; });
      ids.forEach(function(id){
        if (allChecked) delete n[id];
        else n[id] = true;
      });
      setSelectedMeasures(n);
    }
    function toggleSubCategory(kategori, alt) {
      var ids = getSubCategoryAvailableMeasures(kategori, alt);
      var n = Object.assign({}, selectedMeasures);
      var allChecked = ids.every(function(id){ return n[id]; });
      ids.forEach(function(id){
        if (allChecked) delete n[id];
        else n[id] = true;
      });
      setSelectedMeasures(n);
    }
    function toggleMeasure(id) {
      var n = Object.assign({}, selectedMeasures);
      if (n[id]) delete n[id]; else n[id] = true;
      setSelectedMeasures(n);
    }
    function toggleExpand(key) {
      var n = Object.assign({}, expanded);
      n[key] = !n[key];
      setExpanded(n);
    }

    function clearAllMeasures() {
      setSelectedMeasures({});
    }

    // ----------------------------------------------------
    // GENERATE TABLE
    // ----------------------------------------------------
    var selectedEntityNames = entityMode === 'banks'
      ? Object.keys(selectedBanks)
      : Object.keys(selectedGroups);
    var selectedMeasureIds = Object.keys(selectedMeasures);
    var dateStartIdx = dates.indexOf(dateStart);
    var dateEndIdx = dates.indexOf(dateEnd);
    var dateRangeValid = dateStartIdx >= 0 && dateEndIdx >= 0 && dateStartIdx <= dateEndIdx;
    var canGenerate = selectedEntityNames.length > 0
      && selectedMeasureIds.length > 0 && dateRangeValid;

    var validationMsg = '';
    if (selectedEntityNames.length === 0) validationMsg = 'En az bir banka/grup seçin';
    else if (selectedMeasureIds.length === 0) validationMsg = 'En az bir kalem seçin';
    else if (!dateRangeValid) validationMsg = 'Geçersiz tarih aralığı';

    function generateTable() {
      if (!canGenerate) return;

      // Tarih aralığında düşen tüm dönemler
      var dateRange = dates.slice(dateStartIdx, dateEndIdx + 1);

      // Seçili measure'ların catalog metadata'sı (kolonlarda göstermek için)
      var measureMeta = selectedMeasureIds.map(function(id){
        return DATA.catalog.filter(function(m){ return m.id === id; })[0];
      }).filter(Boolean);
      // Catalog sırasında olsun (kategori → alt_kat → ad)
      measureMeta.sort(function(a, b){
        if (a.kategori !== b.kategori) {
          var ko = ['Bilanço', 'Gelir Tablosu', 'Şube & Personel'];
          return ko.indexOf(a.kategori) - ko.indexOf(b.kategori);
        }
        var sa = a.alt_kategori || 'zz', sb = b.alt_kategori || 'zz';
        if (sa !== sb) return sa.localeCompare(sb, 'tr');
        return a.ad.localeCompare(b.ad, 'tr');
      });

      // Veri kaynağı: bankalar için bank_data, gruplar için group_data
      var src = entityMode === 'banks' ? DATA.bank_data : DATA.group_data;

      // Satırları oluştur (Banka/Grup × Tarih)
      var rows = [];
      selectedEntityNames.forEach(function(entity){
        dateRange.forEach(function(d){
          var row = { entity: entity, tarih: d, values: {} };
          var hasAny = false;
          measureMeta.forEach(function(m){
            var series = (src[m.id] || {})[entity];
            var v = series ? series[d] : null;
            if (v !== null && v !== undefined) hasAny = true;
            row.values[m.id] = v == null ? null : v;
          });
          // Tüm hücreler boşsa satırı atla (banka o dönemde yok)
          if (hasAny) rows.push(row);
        });
      });

      var maxDisplay = 1000;
      setTable({
        rows: rows,
        displayedRows: rows.slice(0, maxDisplay),
        measures: measureMeta,
        totalRows: rows.length,
        clipped: rows.length > maxDisplay,
        entityMode: entityMode
      });
    }

    function clearTable() { setTable(null); }

    // ----------------------------------------------------
    // EXPORT
    // ----------------------------------------------------
    function buildExportArray(includeAll) {
      if (!table) return [];
      var entLabel = table.entityMode === 'banks' ? 'Banka' : 'Banka Grubu';
      var headers = [entLabel, 'Tarih'];
      table.measures.forEach(function(m){
        var unitLabel = m.tip === 'rasyo' ? ' (%)' :
                       (m.birim === 'TL' ? ' (TL)' :
                       (m.birim === 'adet' ? ' (Adet)' :
                       (m.birim ? ' (' + m.birim + ')' : '')));
        headers.push(m.ad + unitLabel);
      });
      var aoa = [headers];
      var src = includeAll ? table.rows : table.displayedRows;
      src.forEach(function(r){
        var line = [r.entity, r.tarih];
        table.measures.forEach(function(m){
          line.push(rawExportValue(r.values[m.id], m));
        });
        aoa.push(line);
      });
      return aoa;
    }

    function downloadXLSX() {
      if (!table || typeof XLSX === 'undefined') return;
      var aoa = buildExportArray(true);
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      // Kolon genişlikleri
      var colWidths = [{ wch: 22 }, { wch: 12 }];
      table.measures.forEach(function(m){
        colWidths.push({ wch: Math.min(Math.max(m.ad.length + 6, 14), 36) });
      });
      ws['!cols'] = colWidths;
      ws['!freeze'] = { xSplit: 2, ySplit: 1 };
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Veri');
      // Metadata sheet
      var metaAoa = [
        ['Rapor', 'KT Stratejik Kokpit — Veri Export'],
        ['Oluşturulma', new Date().toLocaleString('tr-TR')],
        ['Tarih aralığı', dateStart + ' → ' + dateEnd],
        [(table.entityMode === 'banks' ? 'Banka sayısı' : 'Grup sayısı'), selectedEntityNames.length],
        ['Kalem sayısı', table.measures.length],
        ['Toplam satır', table.totalRows],
      ];
      var wsMeta = XLSX.utils.aoa_to_sheet(metaAoa);
      wsMeta['!cols'] = [{ wch: 18 }, { wch: 50 }];
      XLSX.utils.book_append_sheet(wb, wsMeta, 'Bilgi');
      var fname = 'KT_Cockpit_Export_' + new Date().toISOString().slice(0, 10) + '.xlsx';
      XLSX.writeFile(wb, fname);
    }

    function downloadCSV() {
      if (!table) return;
      var aoa = buildExportArray(true);
      // Türkçe Excel için ; separator + UTF-8 BOM
      var sep = ';';
      var lines = aoa.map(function(row){
        return row.map(function(c){
          if (c === null || c === undefined) return '';
          var s = String(c);
          // Sayılarda virgül kullan (Türk Excel için)
          if (typeof c === 'number') s = s.replace('.', ',');
          if (s.indexOf(sep) >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) {
            s = '"' + s.replace(/"/g, '""') + '"';
          }
          return s;
        }).join(sep);
      });
      var csv = '\uFEFF' + lines.join('\n');
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'KT_Cockpit_Export_' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ----------------------------------------------------
    // RENDER — TREE NODE
    // ----------------------------------------------------
    function renderMeasureNode(m) {
      var isAvail = !!availableIds[m.id];
      var isFiltered = filteredTree && !filteredTree[m.id];
      if (isFiltered) return null;
      var checked = !!selectedMeasures[m.id];
      var tipBadge = m.tip === 'rasyo' ? '%' : '#';
      return h('div', {
        key: m.id,
        className: 'tree-node-row' + (isAvail ? '' : ' disabled'),
        onClick: function(e){
          e.stopPropagation();
          if (isAvail) toggleMeasure(m.id);
        }
      },
        h('span', { className: 'tree-toggle-icon' }, ''),
        h('input', {
          type: 'checkbox', className: 'tree-checkbox',
          checked: checked, disabled: !isAvail,
          onChange: function(){},  // controlled by row click
          onClick: function(e){ e.stopPropagation(); if (isAvail) toggleMeasure(m.id); }
        }),
        h('span', { className: 'tree-label' }, m.ad),
        h('span', { className: 'tree-counter' }, tipBadge + (isAvail ? '' : ' • veri yok'))
      );
    }

    function renderSubCategoryNode(kategori, alt) {
      var key = 'sub:' + kategori + ':' + alt;
      var ms = hierarchy[kategori][alt];

      // Filter: sub-kategoride hiç eşleşme yoksa gizle
      if (filteredTree) {
        var anyMatch = ms.some(function(m){ return filteredTree[m.id]; });
        if (!anyMatch) return null;
      }

      var isExpanded = expanded[key] !== false;
      // Filtre varsa otomatik aç
      if (filteredTree) isExpanded = true;
      var st = subCategoryCheckState(kategori, alt);
      var availCount = ms.filter(function(m){ return availableIds[m.id]; }).length;
      var selCount = ms.filter(function(m){ return selectedMeasures[m.id]; }).length;

      return h('div', { key: key, className: 'tree-node' },
        h('div', { className: 'tree-node-row', onClick: function(){ toggleExpand(key); } },
          h('span', { className: 'tree-toggle-icon' }, isExpanded ? '▼' : '▶'),
          h('input', {
            type: 'checkbox', className: 'tree-checkbox',
            checked: st === 'checked',
            ref: function(el){ if (el) el.indeterminate = (st === 'indeterminate'); },
            onChange: function(){},
            onClick: function(e){ e.stopPropagation(); toggleSubCategory(kategori, alt); }
          }),
          h('span', { className: 'tree-label subcat' }, alt),
          h('span', { className: 'tree-counter' }, selCount + '/' + availCount)
        ),
        isExpanded && h('div', { className: 'tree-children' },
          ms.map(function(m){ return renderMeasureNode(m); })
        )
      );
    }

    function renderCategoryNode(kategori) {
      var key = 'cat:' + kategori;

      // Filter: kategoride hiç eşleşme yoksa gizle
      if (filteredTree) {
        var hr = hierarchy[kategori];
        var anyMatch = false;
        hr._order.forEach(function(s){
          hr[s].forEach(function(m){ if (filteredTree[m.id]) anyMatch = true; });
        });
        if (!anyMatch) return null;
      }

      var isExpanded = expanded[key] !== false;
      if (filteredTree) isExpanded = true;
      var st = categoryCheckState(kategori);
      var totalMeasures = hierarchy[kategori]._available;
      var selCount = 0;
      hierarchy[kategori]._order.forEach(function(s){
        hierarchy[kategori][s].forEach(function(m){
          if (selectedMeasures[m.id]) selCount++;
        });
      });

      return h('div', { key: key, className: 'tree-node' },
        h('div', { className: 'tree-node-row', onClick: function(){ toggleExpand(key); } },
          h('span', { className: 'tree-toggle-icon' }, isExpanded ? '▼' : '▶'),
          h('input', {
            type: 'checkbox', className: 'tree-checkbox',
            checked: st === 'checked',
            ref: function(el){ if (el) el.indeterminate = (st === 'indeterminate'); },
            onChange: function(){},
            onClick: function(e){ e.stopPropagation(); toggleCategory(kategori); }
          }),
          h('span', { className: 'tree-label cat' }, kategori),
          h('span', { className: 'tree-counter' }, selCount + '/' + totalMeasures)
        ),
        isExpanded && h('div', { className: 'tree-children' },
          hierarchy[kategori]._order.map(function(s){
            return renderSubCategoryNode(kategori, s);
          })
        )
      );
    }

    // ----------------------------------------------------
    // RENDER — SIDEBAR
    // ----------------------------------------------------
    var sidebar = h('div', { className: 'export-sidebar' },
      // Banka/Grup toggle
      h('div', { className: 'export-section' },
        h('div', { className: 'export-section-title' }, 'Seçim Tipi'),
        h('div', { className: 'export-toggle' },
          h('button', {
            className: entityMode === 'banks' ? 'active' : '',
            onClick: function(){ setEntityMode('banks'); }
          }, 'Bankalar'),
          h('button', {
            className: entityMode === 'groups' ? 'active' : '',
            onClick: function(){ setEntityMode('groups'); }
          }, 'Banka Grupları')
        )
      ),

      // Entity multi-select
      h('div', { className: 'export-section' },
        h('div', { className: 'export-section-title' },
          (entityMode === 'banks' ? 'Bankalar' : 'Banka Grupları') +
          ' (' + selectedEntityNames.length + ' seçili)'
        ),
        entityMode === 'banks'
          ? h(React.Fragment || 'div', null,
              h('div', { className: 'export-quick' },
                h('button', { onClick: function(){ quickSelectBanks('all'); } }, 'Tümü'),
                h('button', { onClick: function(){ quickSelectBanks('none'); } }, 'Hiçbiri'),
                h('button', { onClick: function(){ quickSelectBanks('kt'); } }, 'KT'),
                h('button', { onClick: function(){ quickSelectBanks('kt+rakip'); } }, 'KT + Rakip'),
                h('button', { onClick: function(){ quickSelectBanks('top10'); } }, 'Top 10')
              ),
              h('div', { className: 'export-chips' },
                allBankNames.map(function(b){
                  return h('div', {
                    key: b,
                    className: 'export-chip' + (selectedBanks[b] ? ' active' : ''),
                    onClick: function(){ toggleBank(b); }
                  }, b);
                })
              )
            )
          : h(React.Fragment || 'div', null,
              h('div', { className: 'export-quick' },
                h('button', { onClick: function(){ quickSelectGroups('all'); } }, 'Tümü'),
                h('button', { onClick: function(){ quickSelectGroups('none'); } }, 'Hiçbiri'),
                h('button', { onClick: function(){ quickSelectGroups('kt+grp'); } }, 'KT + KT Hariç + Mevduat')
              ),
              h('div', { className: 'export-chips' },
                allGroupNames.map(function(g){
                  return h('div', {
                    key: g,
                    className: 'export-chip' + (selectedGroups[g] ? ' active' : ''),
                    onClick: function(){ toggleGroup(g); }
                  }, g);
                })
              )
            )
      ),

      // Tarih aralığı
      h('div', { className: 'export-section' },
        h('div', { className: 'export-section-title' }, 'Tarih Aralığı'),
        h('div', { className: 'export-date-row' },
          h('select', {
            value: dateStart,
            onChange: function(e){ setDateStart(e.target.value); }
          }, dates.map(function(d){ return h('option', { key: d, value: d }, d); })),
          h('span', { className: 'export-date-sep' }, '→'),
          h('select', {
            value: dateEnd,
            onChange: function(e){ setDateEnd(e.target.value); }
          }, dates.map(function(d){ return h('option', { key: d, value: d }, d); }))
        ),
        h('div', { className: 'export-quick', style: { marginTop: '8px' } },
          h('button', {
            onClick: function(){
              setDateStart(dates[Math.max(0, dates.length - 4)]);
              setDateEnd(dates[dates.length - 1]);
            }
          }, 'Son 4Ç'),
          h('button', {
            onClick: function(){
              setDateStart(dates[Math.max(0, dates.length - 8)]);
              setDateEnd(dates[dates.length - 1]);
            }
          }, 'Son 8Ç'),
          h('button', {
            onClick: function(){
              setDateStart(dates[Math.max(0, dates.length - 12)]);
              setDateEnd(dates[dates.length - 1]);
            }
          }, 'Son 12Ç'),
          h('button', {
            onClick: function(){
              setDateStart(dates[0]);
              setDateEnd(dates[dates.length - 1]);
            }
          }, 'Tümü')
        )
      ),

      // Measure tree
      h('div', { className: 'export-section' },
        h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '6px' } },
          h('div', { className: 'export-section-title', style: { margin: 0 } },
            'Kalemler (' + selectedMeasureIds.length + ' seçili)'
          ),
          selectedMeasureIds.length > 0 && h('button', {
            onClick: clearAllMeasures,
            style: { fontSize: '11px', background: 'transparent', color: '#94a3b8',
                     border: 0, cursor: 'pointer', textDecoration: 'underline' }
          }, 'temizle')
        ),
        h('input', {
          type: 'text', className: 'tree-search',
          placeholder: 'Kalem ara...',
          value: treeFilter,
          onChange: function(e){ setTreeFilter(e.target.value); }
        }),
        h('div', { className: 'export-tree' },
          Object.keys(hierarchy).map(function(k){
            return renderCategoryNode(k);
          })
        )
      ),

      // Action buttons
      h('div', { className: 'export-action-row' },
        h('button', {
          className: 'primary',
          disabled: !canGenerate,
          onClick: generateTable,
          title: validationMsg
        }, 'Tabloyu Oluştur'),
        h('button', { className: 'secondary', onClick: clearTable }, 'Temizle')
      ),
      !canGenerate && validationMsg && h('div', { className: 'export-error' }, validationMsg)
    );

    // ----------------------------------------------------
    // RENDER — MAIN (TABLE OR EMPTY)
    // ----------------------------------------------------
    var main;
    if (!table) {
      main = h('div', { className: 'export-result' },
        h('div', { className: 'export-empty' },
          h('div', { className: 'export-empty-icon' }, '📊'),
          h('div', null, 'Soldaki filtreleri seçin ve "Tabloyu Oluştur"a tıklayın.'),
          h('div', { className: 'export-empty-hint' },
            'Banka/grup × tarih aralığı × kalem kombinasyonundaki tüm değerler tabloya gelir, Excel veya CSV olarak indirilebilir.'
          )
        )
      );
    } else {
      var entLabel = table.entityMode === 'banks' ? 'Banka' : 'Banka Grubu';
      main = h('div', { className: 'export-result' },
        h('div', { className: 'export-result-header' },
          h('div', { className: 'export-result-title-block' },
            h('div', { className: 'export-result-title' },
              'Veri Tablosu — ' + table.totalRows.toLocaleString('tr-TR') + ' satır × ' +
              (2 + table.measures.length) + ' kolon'
            ),
            h('div', { className: 'export-result-meta' },
              dateStart + ' → ' + dateEnd + '  ·  ' +
              selectedEntityNames.length + ' ' + (table.entityMode === 'banks' ? 'banka' : 'grup') +
              '  ·  ' + table.measures.length + ' kalem'
            )
          ),
          h('div', { className: 'export-result-actions' },
            h('button', {
              className: 'export-download',
              onClick: downloadXLSX,
              title: 'Tüm satırları (' + table.totalRows + ') Excel olarak indir'
            }, '📥 Excel'),
            h('button', {
              className: 'export-csv',
              onClick: downloadCSV,
              title: 'CSV olarak indir (Türkçe Excel uyumlu)'
            }, 'CSV')
          )
        ),

        table.clipped && h('div', { className: 'export-warning' },
          h('span', null, '⚠'),
          h('span', null,
            'Tabloda ilk 1.000 satır görünüyor. Tamamı (' + table.totalRows.toLocaleString('tr-TR') +
            ' satır) Excel/CSV indirmesinde mevcut.'
          )
        ),

        h('div', { className: 'export-table-wrap' },
          h('table', { className: 'export-table' },
            h('thead', null,
              h('tr', null,
                h('th', null, entLabel),
                h('th', null, 'Tarih'),
                table.measures.map(function(m){
                  var unitLabel = m.tip === 'rasyo' ? ' (%)' :
                                 (m.birim === 'TL' ? ' (TL)' :
                                 (m.birim === 'adet' ? ' (Adet)' :
                                 (m.birim ? ' (' + m.birim + ')' : '')));
                  return h('th', { key: m.id, title: m.id }, m.ad + unitLabel);
                })
              )
            ),
            h('tbody', null,
              table.displayedRows.map(function(r, i){
                return h('tr', { key: r.entity + '|' + r.tarih + '|' + i },
                  h('td', null, r.entity),
                  h('td', null, r.tarih),
                  table.measures.map(function(m){
                    var v = r.values[m.id];
                    var formatted = fmtExportValue(v, m);
                    if (formatted === null) {
                      return h('td', { key: m.id, className: 'empty' }, '—');
                    }
                    return h('td', { key: m.id, className: 'num' }, formatted);
                  })
                );
              })
            )
          )
        )
      );
    }

    return h('div', { className: 'export-wrap' },
      h('div', { className: 'export-grid' }, sidebar, main)
    );
  }


  // ===============================================================
  // APP
  // ===============================================================
  function App() {
    var themeState = useState('light');
    var theme = themeState[0];
    var setTheme = themeState[1];
    // Senkron global bayrak — darkSafeColor()'ın 'document.body.classList'
    // yerine bunu okuması için. Sebep: body.className, theme state'ine göre
    // bir useEffect içinde güncelleniyor (render SONRASI); aynı render
    // turunda document.body.classList okumak bir adım geriden geliyordu
    // (örn. karanlık moda geçince Rakip Bankalar kartlarındaki CAGR
    // yazıları bir tık sonrasına kadar eski/karanlıkta-okunmaz renkte
    // kalıyordu). Bu satır App'in HER render'ında, çocuklar render
    // edilmeden ÖNCE senkron çalışır — React burada legacy/senkron
    // ReactDOM.render kullandığı için child bileşenler aynı JS çağrı
    // yığınında hemen ardından render edilir.
    window.__KT_DARK__ = (theme === 'dark');

    var modeState = useState('snapshot');
    var mode = modeState[0];
    var setMode = modeState[1];

    var tarihState = useState(DATA.meta.default_date || DATA.meta.dates[DATA.meta.dates.length - 1]);
    var tarih = tarihState[0];
    var setTarih = tarihState[1];

    var defaultMeasure = DATA.meta.available_measures.indexOf('toplam_aktifler') >= 0
      ? 'toplam_aktifler'
      : DATA.meta.available_measures[0];
    var mState = useState(defaultMeasure);
    var activeMeasure = mState[0];
    var setActiveMeasure = mState[1];

    // Aktif kompozisyon (Kompozisyon modu)
    var compState = useState('aktif');
    var activeComposition = compState[0];
    var setActiveComposition = compState[1];

    // Oturumdaki kullanıcının admin rolü var mı (2026-08-12) — topbar'da
    // "Admin Panel" linkini sadece role='admin' kullanıcılara göstermek için.
    // AYNI kontrol periyodik (5 dk'da bir) tekrarlanır: sayfa açık kalırken
    // oturum sessizce sona ererse (çerez süresi dolarsa) — /api/data zaten
    // yüklendiği için başka hiçbir fetch tetiklenmez, kullanıcı fark etmeden
    // "canlı ama aslında oturumu kapanmış" bir sayfada kalabilirdi. Bu
    // kontrol 401 görürse otomatik /login'e yönlendirir (2026-08-12 eklendi,
    // kullanıcı isteği).
    var isAdminState = useState(false);
    var isAdmin = isAdminState[0];
    var setIsAdmin = isAdminState[1];
    useEffect(function() {
      function checkSession() {
        fetch('/api/me', { credentials: 'same-origin' })
          .then(function(r) {
            if (r.status === 401) { window.location.href = '/login'; return null; }
            return r.ok ? r.json() : null;
          })
          .then(function(me) { if (me && me.role === 'admin') setIsAdmin(true); })
          .catch(function() {});
      }
      checkSession();
      var intervalId = setInterval(checkSession, 5 * 60 * 1000);
      return function() { clearInterval(intervalId); };
    }, []);

    useEffect(function() {
      document.body.className = theme === 'dark' ? 'dark' : '';
    }, [theme]);

    return h('div', null,
      h(TopBar, {
        theme: theme, setTheme: setTheme,
        tarih: tarih, setTarih: setTarih,
        activeMeasure: activeMeasure,
        mode: mode,
        activeComposition: activeComposition,
        isAdmin: isAdmin
      }),
      h(ControlBar, {
        mode: mode, setMode: setMode,
        activeMeasure: activeMeasure,
        setActiveMeasure: setActiveMeasure,
        activeComposition: activeComposition,
        setActiveComposition: setActiveComposition
      }),
      h('div', { className: 'main-panel' },
        mode === 'snapshot' ? h(SnapshotView, { activeMeasure: activeMeasure, tarih: tarih }) :
        mode === 'trend'    ? h(TrendView, { activeMeasure: activeMeasure, tarih: tarih }) :
        mode === 'export'   ? h(ExportView, null) :
                              h(CompositionView, { activeComposition: activeComposition, tarih: tarih })
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  } // bootstrapApp sonu

  // v30: API'den veriyi cek, sonra bootstrap calistir
  // 401 (giris yapilmamis / onaysiz uye) -> /login'e yonlendir (2026-08-12,
  // uyelik sistemi eklendi, /api/data artik auth gerektiriyor).
  fetch('/api/data', {credentials: 'same-origin'})
    .then(function(r) {
      if (r.status === 401) {
        window.location.href = '/login';
        throw new Error('Giris gerekiyor, yonlendiriliyor...');
      }
      if (!r.ok) throw new Error('HTTP ' + r.status + ' - yetkisiz veya sunucu hatasi');
      return r.json();
    })
    .then(function(DATA) {
      bootstrapApp(DATA);
    })
    .catch(function(err) {
      var root = document.getElementById('root');
      root.innerHTML = '<div style="padding:40px;font-family:system-ui,sans-serif;color:#c0392b;text-align:center;max-width:600px;margin:60px auto;border:1px solid #fadbd8;border-radius:8px;background:#fef5f4"><h2 style="margin:0 0 12px">Veri yuklenemedi</h2><p style="margin:0;color:#5d2a26">' + err.message + '</p><p style="margin:16px 0 0;font-size:13px;color:#888">Lutfen sayfayi yenileyin veya yoneticinize basvurun.</p></div>';
      console.error('[KT Cockpit] /api/data fetch hatasi:', err);
    });

})();
</script>
</body>
</html>
