  /* -------- ⇄ önceki ölçü / grafik araçları (2026-09-29) -------- */
  .ctl-quick-btn {
    flex: none; height: 30px; padding: 0 10px; border-radius: 6px;
    border: 1px solid #cbd5e1; background: #fff; color: #334155;
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .ctl-quick-btn:hover:not(:disabled) { border-color: var(--kt-green); color: var(--kt-green-dark); }
  .ctl-quick-btn:disabled { opacity: 0.45; cursor: default; }
  body.dark .ctl-quick-btn { background: #0f1a24; border-color: #2a3b4d; color: #c5d3dd; }
  /* ⇄ Önceki ölçüye dön — etiketli, kısayol rozetli, ölçü adını gösteren ipucu */
  .ctl-swap {
    position: relative; flex: none; height: 30px; padding: 0 9px 0 4px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid #cbd5e1; background: #fff; color: #334155;
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: border-color .12s, background .12s, box-shadow .12s;
  }
  .ctl-swap-ico {
    width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    background: rgba(98,174,65,0.14); color: var(--kt-green-dark, #457A2E); font-size: 13px; line-height: 1;
    transition: transform .25s;
  }
  .ctl-swap-txt { display: inline-flex; align-items: baseline; gap: 4px; min-width: 0; }
  .ctl-swap-lbl { color: #64748b; font-weight: 600; }
  .ctl-swap-name { max-width: 105px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1a2635; font-weight: 700; }
  body.dark .ctl-swap-name { color: #e8eef1; }
  .ctl-swap-key {
    font: inherit; font-size: 10.5px; font-weight: 700; padding: 1px 5px; border-radius: 4px;
    border: 1px solid #cbd5e1; border-bottom-width: 2px; color: #64748b; background: #f8fafc;
  }
  .ctl-swap:hover:not(:disabled), .ctl-swap:focus-visible {
    border-color: var(--kt-green); background: rgba(98,174,65,0.07); box-shadow: 0 1px 6px rgba(15,31,47,0.10); outline: none;
  }
  .ctl-swap:hover:not(:disabled) .ctl-swap-ico { transform: rotate(180deg); }
  .ctl-swap:disabled { opacity: 0.55; cursor: default; }
  .ctl-swap:disabled .ctl-swap-ico { background: rgba(100,116,139,0.14); color: #64748b; }
  /* Özel ipucu: yalnız fare/odak ile, önceki ölçünün adını gösterir (dokunmatikte title/aria yeterli) */
  @media (hover: hover) {
    .ctl-swap::after {
      content: attr(data-tip); position: absolute; right: 0; top: calc(100% + 8px); z-index: 60;
      max-width: 280px; width: max-content; white-space: normal; text-align: left;
      padding: 7px 10px; border-radius: 8px; background: rgba(15,31,47,0.94); color: #e6edf3;
      font-size: 11.5px; font-weight: 500; line-height: 1.4; box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      opacity: 0; transform: translateY(-3px); pointer-events: none; transition: opacity .12s, transform .12s;
    }
    .ctl-swap:hover::after, .ctl-swap:focus-visible::after { opacity: 1; transform: none; }
  }
  body.dark .ctl-swap { background: #0f1a24; border-color: #2a3b4d; color: #c5d3dd; }
  body.dark .ctl-swap-key { background: #1a2635; border-color: #2a3b4d; color: #94a3b8; }
  /* Mobil özet satırı: yalnız ikon + alt yazı (Q kısayolu dokunmatikte anlamsız) */
  .ctl-swap.control-summary-swap {
    height: 48px; padding: 0 10px; border-radius: 10px; flex-direction: column; justify-content: center; gap: 1px;
  }
  .ctl-swap.control-summary-swap .ctl-swap-key { display: none; }
  .ctl-swap.control-summary-swap .ctl-swap-ico { background: none; width: auto; height: auto; font-size: 17px; }
  .ctl-swap.control-summary-swap .ctl-swap-txt { font-size: 10px; font-weight: 600; flex-direction: column; align-items: center; gap: 0; }
  .ctl-swap.control-summary-swap .ctl-swap-name { max-width: 78px; font-size: 10px; white-space: nowrap; }
  .ctl-swap.control-summary-swap::after { display: none; }

  /* -------- PDF / yazdırma (2026-09-29) --------
     Tarayıcının "PDF olarak kaydet" çıktısı: üst bar, seçiciler ve butonlar
     gizlenir, yerine tek satırlık rapor başlığı basılır. */
  .print-header { display: none; }
  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    html, body { background: #fff !important; }
    .topbar, .date-selector-bar, .control-bar, .no-print, .chat-fab, .chat-panel,
    .trend-controls, .trend-mobile-bar, .mi-popover { display: none !important; }
    .print-header {
      display: flex !important; justify-content: space-between; align-items: baseline;
      padding: 0 2px 8px; margin-bottom: 8px; border-bottom: 2px solid var(--kt-green);
      font-size: 13px; color: #334155;
    }
    .print-header b { font-size: 16px; color: #0f1f2f; }
    .main-panel { padding: 0 !important; overflow: visible !important; min-height: 0 !important; }
    /* Anında Görünüm: A4 yatayda iki sütun sığmıyor (sıralama listesi kendi
       içinde kayıyor, YtD grafiği yana taşıyordu) — tek sütun, tam boy. */
    .dashboard-grid { grid-template-columns: minmax(0, 1fr) !important; }
    .bank-rows-scroll { max-height: none !important; overflow: visible !important; }
    .ytd-scroll-wrap { overflow: visible !important; }
    .trend-chart-wrap, .panel { break-inside: avoid; box-shadow: none !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  body.pdf-slide .main-panel {

  // v30: fetch ile JSON yukle (eskiden embedded'di)
  // ===============================================================
  // ÖZEL ÖLÇÜLER — kullanıcı tanımlı, mevcut ölçüleri birleştiren ölçüler
  // (2026-09-17). Sunucu SADECE tanımı saklar (/api/my/measures); değer
  // hesaplaması burada, istemci tarafında, DATA.bank_data'daki hazır
  // ölçü değerlerinden anlık türetilir. bootstrapApp(DATA) çağrılmadan
  // ÖNCE (ilk yükleme) ve sonra da (Ölçü Oluştur modal'ından kaydet/sil
  // sonrası, aynı DATA nesnesi yerinde güncellenerek) çağrılabilir —
  // idempotent: önce önceki enjeksiyonu temizler, sonra yeniden kurar.
  // <cm-rules> ------------------------------------------------------
  // Anlam + hesap kuralları: pipeline/custom_measure_rules.py'nin JS
  // karşılığı. Sunucu aynı kuralları kayıtta doğrular; biri değişirse ikisi
  // de değişmeli. tests/test_custom_measures_js.py bu bloğu (işaretler
  // arası) node ile çalıştırıp Python'la aynı vakalarla sınar — bu yüzden
  // blok DOM'a, React'e ve DATA'ya DOKUNMAZ.
  //
  // İfade ağacı (2026-09-25): {m: id} | {k: sayı} |
  //   {op: 'add'|'sub'|'mul'|'div', l: düğüm, r: düğüm, bicim?: 'pct'|'kat'}
  // Eski kayıtlar (op: ratio|diff|sum|scale, a, b, constant, bicim)
  // cmRecordExpr ile aynı anlamdaki ağaca çevrilir.
  var CM_BICIM = {
    pct:    { etiket: 'Yüzde (%)',            birim: '%',      carpan: 100 },
    kat:    { etiket: 'Kat (x)',              birim: 'kat',    carpan: 1 },
    bin_TL: { etiket: 'Birim başına (bin TL)', birim: 'bin_TL', carpan: 0.001 },
  };
  var CM_MAX_LEAVES = 10, CM_MAX_DEPTH = 6, CM_MAX_EXPR_JSON = 4000;
  var CM_LEGACY_OP = { ratio: 'div', diff: 'sub', sum: 'add', scale: 'mul' };
  var CM_EXPR_OPS = ['add', 'sub', 'mul', 'div'];

  function cmRatioFormats(ma, mb) {
    if (ma.tip === 'rasyo' && mb.tip === 'rasyo') return ['kat', 'pct'];
    if (ma.tip !== mb.tip) return [];
    if (ma.birim === 'TL' && mb.birim === 'TL') return ['pct', 'kat'];
    if (ma.birim === 'adet' && mb.birim === 'adet') return ['kat', 'pct'];
    if (ma.birim === 'TL' && mb.birim === 'adet') return ['bin_TL'];
    return [];
  }
  function cmDonem(m) {
    if (m.tip === 'rasyo') return 'ölçünün kendi dönemi';
    return m.akim_stok === 'akim' ? 'yılbaşından kümülatif (YtD)' : 'dönem sonu bakiye';
  }
  function cmSabitMetin(k) { return String(k).replace('.', ','); }
  function birimAd(m) {
    return m.birim === 'TL' ? 'TL' : m.birim === 'bin_TL' ? 'bin TL' : m.birim === 'kat' ? 'kat' : m.birim === 'adet' ? 'adet' : '%';
  }

  function cmLegacyToExpr(op, a, b, constant, bicim) {
    if (!CM_LEGACY_OP[op]) return null;
    if (op === 'scale') return { op: 'mul', l: { m: a }, r: { k: constant == null ? 1 : constant } };
    var node = { op: CM_LEGACY_OP[op], l: { m: a }, r: { m: b } };
    if (op === 'ratio' && bicim != null) node.bicim = bicim;
    return node;
  }
  function cmRecordExpr(rec) {
    if (rec.expr != null) return rec.expr;
    return cmLegacyToExpr(rec.op, rec.a, rec.b, rec.constant, rec.bicim);
  }

  // --- Yapı doğrulaması (katalogdan bağımsız) ---
  function CmHata(msg) { this.cmMsg = msg; }
  function cmIsNum(x) { return typeof x === 'number' && isFinite(x); }
  function cmKeys(o) { return Object.keys(o).sort().join(','); }
  function cmShape(node, depth, counter) {
    if (depth > CM_MAX_DEPTH) throw new CmHata('Formül çok iç içe (en fazla ' + CM_MAX_DEPTH + ' seviye)');
    if (!node || typeof node !== 'object' || Array.isArray(node)) throw new CmHata('Geçersiz formül yapısı');
    if ('m' in node) {
      if (cmKeys(node) !== 'm' || typeof node.m !== 'string' || !node.m.trim()) throw new CmHata('Geçersiz ölçü düğümü');
      counter.n += 1;
      if (counter.n > CM_MAX_LEAVES) throw new CmHata('Formülde en fazla ' + CM_MAX_LEAVES + ' ölçü olabilir');
      return;
    }
    if ('k' in node) {
      if (cmKeys(node) !== 'k' || !cmIsNum(node.k)) throw new CmHata('Sabit geçerli bir sayı olmalı');
      return;
    }
    if (CM_EXPR_OPS.indexOf(node.op) < 0) throw new CmHata("Geçersiz işlem: '" + node.op + "'");
    var izinli = node.op === 'div' ? ['bicim', 'l', 'op', 'r'] : ['l', 'op', 'r'];
    var ok = Object.keys(node).every(function(k){ return izinli.indexOf(k) >= 0; });
    if (!ok || !('l' in node) || !('r' in node)) throw new CmHata('Geçersiz formül yapısı');
    if (node.bicim != null && node.bicim !== 'pct' && node.bicim !== 'kat') throw new CmHata("Geçersiz biçim: '" + node.bicim + "'");
    cmShape(node.l, depth + 1, counter);
    cmShape(node.r, depth + 1, counter);
  }
  function cmCheckShape(expr) {
    try {
      if (JSON.stringify(expr).length > CM_MAX_EXPR_JSON) throw new CmHata('Formül çok uzun');
      cmShape(expr, 1, { n: 0 });
    } catch (e) {
      if (e instanceof CmHata) return e.cmMsg;
      return 'Geçersiz formül yapısı';
    }
    return null;
  }

  // --- Anlam analizi → hesap planı (Python _analyze ile aynı) ---
  function cmCanon(n) {
    if (!n || typeof n !== 'object') return JSON.stringify(n);
    return '{' + Object.keys(n).sort().map(function(k){ return JSON.stringify(k) + ':' + cmCanon(n[k]); }).join(',') + '}';
  }
  function cmAnalyzeNode(node, byId) {
    if ('m' in node) {
      var M = byId[node.m];
      if (!M) throw new CmHata("'" + node.m + "' geçerli bir ölçü değil");
      return { kind: 'm', id: node.m, type: { tip: M.tip, birim: M.birim, akim_stok: M.akim_stok } };
    }
    if ('k' in node) return { kind: 'k', k: node.k, type: { tip: 'sabit' } };
    var op = node.op;
    var L = cmAnalyzeNode(node.l, byId), R = cmAnalyzeNode(node.r, byId);
    var tl = L.type, tr = R.type;
    var kl = tl.tip === 'sabit', kr = tr.tip === 'sabit';
    var out = { kind: op, l: L, r: R };
    if (op === 'add' || op === 'sub') {
      if (kl || kr) throw new CmHata('Sabit sayı yalnız çarpma ve bölmede kullanılabilir');
      if (cmCanon(node.l) === cmCanon(node.r)) throw new CmHata('A ve B aynı ölçü olamaz');
      if (tl.birim !== tr.birim) throw new CmHata('Birimler uyuşmuyor (' + tl.birim + ' ≠ ' + tr.birim + ') — fark/toplam için aynı birimde iki ölçü seçin');
      if (tl.tip !== tr.tip) throw new CmHata('Tutar ile rasyo toplanamaz/çıkarılamaz');
      if (tl.tip === 'buyukluk' && tl.akim_stok !== tr.akim_stok) {
        throw new CmHata('Gelir tablosu kalemi (yılbaşından kümülatif) ile bilanço kalemi (dönem sonu bakiye) toplanamaz/çıkarılamaz');
      }
      out.type = { tip: tl.tip, birim: tl.birim, akim_stok: tl.akim_stok };
      return out;
    }
    if (op === 'mul') {
      if (kl && kr) throw new CmHata('İki sabit sayı çarpılamaz — sonucu doğrudan yazın');
      if (!kl && !kr) throw new CmHata('İki ölçü çarpılamaz — çarpma yalnız bir sabit sayıyla yapılabilir');
      if ((kl ? L : R).k === 0) throw new CmHata('Sabit 0 olamaz (sonuç her zaman 0 olur)');
      var t = kl ? tr : tl;
      out.type = { tip: t.tip, birim: t.birim, akim_stok: t.akim_stok };
      return out;
    }
    // div
    if (kl) throw new CmHata('Sabit sayı bir ölçüye bölünemez');
    if (kr) {
      if (R.k === 0) throw new CmHata('Sıfıra bölünemez');
      if (node.bicim != null) throw new CmHata('Sabite bölmede sonuç biçimi seçilemez');
      out.scale_only = true;
      out.type = { tip: tl.tip, birim: tl.birim, akim_stok: tl.akim_stok };
      return out;
    }
    if (cmCanon(node.l) === cmCanon(node.r)) throw new CmHata('A ve B aynı ölçü olamaz');
    var formats = cmRatioFormats(tl, tr);
    if (!formats.length) throw new CmHata('Bu iki ölçünün oranı anlamlı değil (rasyo ile tutar ya da adet / TL)');
    if (node.bicim != null && formats.indexOf(node.bicim) < 0) throw new CmHata("Bu oran için geçersiz biçim: '" + node.bicim + "'");
    var bicim = node.bicim || formats[0];
    // Akım (YtD) tutar ile stok bakiye oranlanırsa PBI'daki gibi akım son 12
    // aya (TTM), stok 12 aylık ortalamaya çevrilir — aksi halde oran Mart'ta
    // küçük Aralık'ta büyük çıkar, çeyrekler kıyaslanamaz (ROAA deseni).
    var karisik = tl.tip === 'buyukluk' && tr.tip === 'buyukluk' && tl.akim_stok !== tr.akim_stok;
    out.scale_only = false;
    out.bicim = bicim;
    out.formats = formats;
    out.modes = karisik
      ? [tl.akim_stok === 'akim' ? 'ttm' : 'avg', tr.akim_stok === 'akim' ? 'ttm' : 'avg']
      : [null, null];
    out.carpan = CM_BICIM[bicim].carpan;
    out.type = { tip: 'rasyo', birim: CM_BICIM[bicim].birim,
                 akim_stok: (tl.akim_stok === 'akim' || tr.akim_stok === 'akim') ? 'akim' : 'stok' };
    return out;
  }
  function cmAnalyze(expr, byId) {
    var err = cmCheckShape(expr);
    if (err) return { error: err };
    var plan;
    try { plan = cmAnalyzeNode(expr, byId); }
    catch (e) { if (e instanceof CmHata) return { error: e.cmMsg }; throw e; }
    if (plan.type.tip === 'sabit') return { error: 'Formülde en az bir ölçü olmalı' };
    return { plan: plan };
  }
  function cmExprIds(expr) {
    var out = [];
    (function walk(n) {
      if (!n || typeof n !== 'object') return;
      if ('m' in n) { if (out.indexOf(n.m) < 0) out.push(n.m); }
      else if ('op' in n) { walk(n.l); walk(n.r); }
    })(expr);
    return out;
  }

  // --- Hesap: pipeline/lookup.py ttm_flow/avg_balance ile aynı formül
  // (yıl önceki dönem: aynı ay-gün, bir yıl önce). ---
  function cmYilOnce(t) { return (parseInt(t.slice(0, 4), 10) - 1) + t.slice(4); }
  function cmNokta(seri, t, mode) {
    var v = seri[t];
    if (v == null) return null;
    if (mode === 'ttm') {
      var ay = parseInt(t.slice(5, 7), 10);
      if (ay === 12) return v;
      var yilSonu = seri[(parseInt(t.slice(0, 4), 10) - 1) + '-12-31'];
      var gecen = seri[cmYilOnce(t)];
      return (yilSonu != null && gecen != null) ? v + yilSonu - gecen : v * 12 / ay;
    }
    if (mode === 'avg') {
      var once = seri[cmYilOnce(t)];
      return once == null ? v : (v + once) / 2;
    }
    return v;
  }
  // series(id) → {tarih: değer}
  function cmEval(plan, series, t, mode) {
    var k = plan.kind;
    if (k === 'm') return cmNokta(series(plan.id) || {}, t, mode);
    if (k === 'k') return plan.k;
    var va, vb;
    if (k === 'div' && !plan.scale_only) {
      va = cmEval(plan.l, series, t, plan.modes[0] || mode);
      if (va == null) return null;
      vb = cmEval(plan.r, series, t, plan.modes[1] || mode);
      if (vb == null || vb === 0) return null;
      return va / vb * plan.carpan;
    }
    va = cmEval(plan.l, series, t, mode);
    if (va == null) return null;
    vb = cmEval(plan.r, series, t, mode);
    if (vb == null) return null;
    return k === 'add' ? va + vb : k === 'sub' ? va - vb : k === 'mul' ? va * vb : va / vb;
  }

  // --- Metin: okunur formül (bilgi kartı/önizleme) ---
  function cmPrec(p) { return (p.kind === 'add' || p.kind === 'sub') ? 1 : (p.kind === 'mul' || p.kind === 'div') ? 2 : 3; }
  function cmExprText(plan, byId, mode, parent, sag) {
    var metin;
    if (plan.kind === 'm') {
      var ad = byId[plan.id].ad;
      if (parent && /[\/+×−]| - /.test(ad)) ad = '(' + ad + ')';
      return (mode === 'ttm' ? 'TTM ' : mode === 'avg' ? 'Ort. ' : '') + ad;
    }
    if (plan.kind === 'k') return cmSabitMetin(plan.k);
    var oran = plan.kind === 'div' && !plan.scale_only;
    var ml = oran ? (plan.modes[0] || mode) : mode, mr = oran ? (plan.modes[1] || mode) : mode;
    var isaret = { add: ' + ', sub: ' − ', mul: ' × ', div: ' / ' }[plan.kind];
    metin = cmExprText(plan.l, byId, ml, plan, false) + isaret + cmExprText(plan.r, byId, mr, plan, true);
    if (oran && plan.bicim === 'pct') metin += ' × 100';
    if (parent) {
      var pp = cmPrec(parent), cp = cmPrec(plan);
      var paren = cp < pp || (sag && cp === pp && parent.kind !== 'add') || (oran && plan.bicim === 'pct');
      if (paren) metin = '(' + metin + ')';
    }
    return metin;
  }

  // --- Metin: düzenlenebilir formül ([Ölçü Adı] belirteçleriyle) ---
  function cmFormulaText(expr, byId, parent, sag) {
    if ('m' in expr) return '[' + (byId[expr.m] ? byId[expr.m].ad : expr.m) + ']';
    if ('k' in expr) return cmSabitMetin(expr.k);
    var isaret = { add: ' + ', sub: ' − ', mul: ' × ', div: ' / ' }[expr.op];
    var metin = cmFormulaText(expr.l, byId, expr, false) + isaret + cmFormulaText(expr.r, byId, expr, true);
    if (parent) {
      var pp = cmPrec({ kind: parent.op }), cp = cmPrec({ kind: expr.op });
      if (cp < pp || (sag && cp === pp && parent.op !== 'add')) metin = '(' + metin + ')';
    }
    return metin;
  }
  function cmAdAnahtar(s) { return String(s).replace(/\s+/g, ' ').trim().toLocaleLowerCase('tr'); }
  // Serbest metin formül → ağaç. Ölçüler [köşeli parantez] içinde adıyla
  // (ya da id'siyle) yazılır; + − × / ve parantez; ondalık virgül ya da nokta.
  function cmParseFormula(text, byId) {
    var byAd = {};
    Object.keys(byId).forEach(function(id){ byAd[cmAdAnahtar(byId[id].ad)] = id; });
    var s = String(text || ''), i = 0, toks = [];
    while (i < s.length) {
      var c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (c === '[') {
        var j = s.indexOf(']', i + 1);
        if (j < 0) return { error: 'Kapanmayan köşeli parantez: ' + s.slice(i, i + 25) };
        var ad = s.slice(i + 1, j), key = cmAdAnahtar(ad);
        var id = byAd[key] || (byId[ad.trim()] ? ad.trim() : null);
        if (!id) return { error: 'Bilinmeyen ölçü: [' + ad.trim() + ']' };
        toks.push({ t: 'm', v: id }); i = j + 1; continue;
      }
      var num = /^\d+(?:[.,]\d+)?/.exec(s.slice(i));
      if (num) { toks.push({ t: 'k', v: Number(num[0].replace(',', '.')) }); i += num[0].length; continue; }
      var opMap = { '+': 'add', '-': 'sub', '−': 'sub', '–': 'sub', '*': 'mul', '×': 'mul', '/': 'div', '÷': 'div' };
      if (opMap[c]) { toks.push({ t: 'op', v: opMap[c] }); i++; continue; }
      if (c === '(' || c === ')') { toks.push({ t: c }); i++; continue; }
      return { error: /[A-Za-zÇĞİÖŞÜçğıöşü]/.test(c)
        ? 'Ölçü adlarını [köşeli parantez] içinde yazın (ör. [Krediler])'
        : "Beklenmeyen karakter: '" + c + "'" };
    }
    if (!toks.length) return { error: 'Formül boş' };
    var p = 0;
    function bak() { return toks[p]; }
    function ifade() {
      var n = terim();
      while (bak() && bak().t === 'op' && (bak().v === 'add' || bak().v === 'sub')) {
        var op = toks[p++].v; n = { op: op, l: n, r: terim() };
      }
      return n;
    }
    function terim() {
      var n = carpan();
      while (bak() && bak().t === 'op' && (bak().v === 'mul' || bak().v === 'div')) {
        var op = toks[p++].v; n = { op: op, l: n, r: carpan() };
      }
      return n;
    }
    function carpan() {
      var tk = toks[p++];
      if (!tk) throw new CmHata('Formül eksik — bir ölçü ya da sayı bekleniyordu');
      if (tk.t === 'm') return { m: tk.v };
      if (tk.t === 'k') return { k: tk.v };
      if (tk.t === 'op' && tk.v === 'sub' && bak() && bak().t === 'k') return { k: -toks[p++].v };
      if (tk.t === '(') {
        var n = ifade();
        if (!bak() || bak().t !== ')') throw new CmHata('Kapanmayan parantez');
        p++; return n;
      }
      throw new CmHata(tk.t === ')' ? 'Fazladan kapanan parantez' : 'Arka arkaya iki işlem işareti');
    }
    try {
      var expr = ifade();
      if (p < toks.length) throw new CmHata(toks[p].t === ')' ? 'Fazladan kapanan parantez' : 'İki terim arasında işlem işareti eksik');
      return { expr: expr };
    } catch (e) {
      if (e instanceof CmHata) return { error: e.cmMsg };
      throw e;
    }
  }

  // Ağaç tek işlemli basit forma (Oran/Fark/Toplam/Ölçekle) sığıyorsa onu
  // döndürür — Ölçü Oluştur düzenlemede basit sekmeyi açar; yoksa null.
  function cmSimpleForm(expr) {
    if (!expr || !expr.op || !expr.l || !expr.r || !('m' in expr.l)) return null;
    if (expr.op === 'mul' && 'k' in expr.r) return { op: 'scale', a: expr.l.m, b: null, constant: expr.r.k, bicim: null };
    if (!('m' in expr.r)) return null;
    var op = { div: 'ratio', sub: 'diff', add: 'sum' }[expr.op];
    return op ? { op: op, a: expr.l.m, b: expr.r.m, constant: null, bicim: expr.op === 'div' ? (expr.bicim || null) : null } : null;
  }

  // Kayıttan (expr ya da eski op/a/b) hesap planı + bilgi kartı metinleri.
  // Geçersizse {error}. Hem enjeksiyon hem Ölçü Oluştur önizlemesi kullanır.
  function customMeasureSpec(rec, byId) {
    var expr = cmRecordExpr(rec);
    if (!expr) return { error: 'Geçersiz işlem' };
    var an = cmAnalyze(expr, byId);
    if (an.error) return { error: an.error };
    var plan = an.plan, T = plan.type;
    var karisik = false, binTL = false;
    (function walk(p) {
      if (p.kind === 'div' && !p.scale_only) {
        if (p.modes[0]) karisik = true;
        if (p.bicim === 'bin_TL') binTL = true;
      }
      if (p.l) { walk(p.l); walk(p.r); }
    })(plan);
    var MODE_METIN = { ttm: 'son 12 ay (TTM)', avg: '12 aylık ortalama bakiye' };
    var kok = plan.kind === 'div' && !plan.scale_only;
    var donem;
    if (kok && plan.modes[0]) {
      donem = 'Pay: ' + MODE_METIN[plan.modes[0]] + ' · Payda: ' + MODE_METIN[plan.modes[1]];
    } else if (kok) {
      var tl = plan.l.type;
      donem = tl.tip === 'buyukluk' && tl.akim_stok === 'akim' ? 'Pay ve payda: yılbaşından kümülatif (YtD)'
        : tl.tip === 'buyukluk' ? 'Dönem sonu bakiye' : 'Ölçülerin kendi dönemi';
    } else {
      donem = cmDonem(T).charAt(0).toUpperCase() + cmDonem(T).slice(1);
    }
    var notlar = [];
    if (karisik) notlar.push({ type: 'info', text: 'ℹ️ Gelir tablosu kalemi son 12 aya, bilanço kalemi 12 aylık ortalamaya çevrildi (ROAA/ROAE ile aynı yöntem) — çeyrekler birbiriyle kıyaslanabilir.' });
    if (binTL) notlar.push({ type: 'info', text: 'ℹ️ TL tutarın adete bölümü: birim başına düşen tutar (ör. personel başına kredi).' });
    return {
      tip: T.tip, birim: T.birim, akim_stok: T.akim_stok,
      bicim: kok ? plan.bicim : null, formats: kok ? plan.formats : [],
      expr: expr, plan: plan, ids: cmExprIds(expr),
      formul: cmExprText(plan, byId, null, null, false),
      donem: donem, notlar: notlar,
    };
  }

  // group_data {tarih: {value}} → düz {tarih: value}
  function cmGrupSeri(g) {
    var out = {};
    Object.keys(g || {}).forEach(function(d){ if (g[d]) out[d] = g[d].value; });
    return out;
  }
  // Bir varlık (banka ya da grup) için tüm tarihlerde özel ölçü.
  // series(id) → o varlığın {tarih: değer} serisi.
  function cmSeri(spec, series) {
    var out = {}, tarihler = {};
    spec.ids.forEach(function(id){ Object.keys(series(id) || {}).forEach(function(d){ tarihler[d] = true; }); });
    Object.keys(tarihler).forEach(function(d){ out[d] = cmEval(spec.plan, series, d, null); });
    return out;
  }
  // </cm-rules> -----------------------------------------------------

  function injectCustomMeasures(DATA, customMeasures) {
    // Önceki enjeksiyonu temizle (idempotency)
    DATA.catalog = DATA.catalog.filter(function(m){ return !m.custom; });
    DATA.measureInfo = DATA.measureInfo || {};
    Object.keys(DATA.measureInfo).forEach(function(mid){
      if (mid.indexOf('custom_') === 0) delete DATA.measureInfo[mid];
    });
    if (DATA.meta && DATA.meta.available_measures) {
      DATA.meta.available_measures = DATA.meta.available_measures.filter(function(id){
        return id.indexOf('custom_') !== 0;
      });
    }
    Object.keys(DATA.bank_data).forEach(function(mid){
      if (mid.indexOf('custom_') === 0) delete DATA.bank_data[mid];
    });
    // (2026-09-18 bug düzeltmesi) Özel ölçüler eskiden SADECE bank_data
    // üretiyordu — group_data hiç yoktu, bu yüzden "Banka Grupları"
    // kartları/trend çizgileri özel ölçülerde her zaman boş/"—" kalıyordu
    // (bkz. groupVal() — DATA.group_data[mid] yoksa null döner). Aşağıda
    // bank_data'nın hemen yanında group_data de üretiliyor.
    if (DATA.group_data) {
      Object.keys(DATA.group_data).forEach(function(mid){
        if (mid.indexOf('custom_') === 0) delete DATA.group_data[mid];
      });
    }

    var byId = {};
    DATA.catalog.forEach(function(m){ byId[m.id] = m; });
    DATA.__customMeasureErrors = {};

    (customMeasures || []).forEach(function(c) {
      var spec = customMeasureSpec(c, byId);
      if (spec.error) {
        // Kaynak ölçü katalogdan kalkmış vb. — ölçü gösterilmez ama Ölçü
        // Oluştur listesinde nedeniyle birlikte uyarı olarak görünür.
        DATA.__customMeasureErrors[c.id] = spec.error;
        return;
      }
      var out = {}, banks = {};
      spec.ids.forEach(function(id){ Object.keys(DATA.bank_data[id] || {}).forEach(function(b){ banks[b] = true; }); });
      Object.keys(banks).forEach(function(banka) {
        out[banka] = cmSeri(spec, function(id){ return (DATA.bank_data[id] || {})[banka]; });
      });
      DATA.bank_data[c.id] = out;

      // Grup değerleri banka banka yeniden toplanmıyor: formüldeki ölçülerin
      // sunucuda doğru hesaplanmış grup değerlerine (kurulmamış üye / kısmi
      // veri istisnalarıyla, bkz. pipeline/groups.py) aynı formül uygulanıyor.
      // TTM/ortalama doğrusal olduğundan grup toplamı üzerinden hesap,
      // üyelerinkinin toplamıyla aynı sonucu verir.
      if (DATA.group_data) {
        var groupOut = {}, groups = {};
        spec.ids.forEach(function(id){ Object.keys(DATA.group_data[id] || {}).forEach(function(g){ groups[g] = true; }); });
        Object.keys(groups).forEach(function(grup) {
          var seri = cmSeri(spec, function(id){ return cmGrupSeri((DATA.group_data[id] || {})[grup]); });
          groupOut[grup] = {};
          Object.keys(seri).forEach(function(d){
            groupOut[grup][d] = seri[d] == null ? null : { value: seri[d] };
          });
        });
        DATA.group_data[c.id] = groupOut;
      }

      DATA.catalog.push({
        id: c.id, ad: c.ad,
        kategori: 'Özel Ölçülerim', alt_kategori: 'Kullanıcı Tanımlı',
        tip: spec.tip, birim: spec.birim, akim_stok: spec.akim_stok,
        sort_direction: c.sort_direction || 'desc',
        pazar_payi: false, custom: true,
      });
      DATA.measureInfo[c.id] = {
        id: c.id, baslik: c.ad, durum: 'Özel ölçü',
        tanim: 'Sizin tanımladığınız, hazır ölçülerden türetilmiş ölçü.',
        formul: spec.formul, donem: spec.donem,
        kaynak: spec.ids.map(function(id){ return byId[id].ad; }).join(' ; '),
        kategori: 'Özel Ölçülerim',
        tip: spec.tip === 'rasyo' ? 'Rasyo' : 'Büyüklük',
        birim: birimAd(spec),
        terimler: [], notlar: spec.notlar,
      };
      if (DATA.meta && DATA.meta.available_measures) {
        DATA.meta.available_measures.push(c.id);
      }
    });
    return DATA;
  }

  function bootstrapApp(DATA) {

  // Tek bir görünümün (el = .main-panel) resmini alır: dönen {dataUrl, cssW, cssH}. Yakalama, geniş bir sanal

    if (!bd) out = all.slice();

      var sayi = {}, enCok = 0;
      all.forEach(function(t) {
        var n = 0;
        for (var i = 0; i < names.length; i++) {

  var _kompTarihCache = {};

  // SABİT TOP-20 seti — o tarihin Toplam Aktifler sıralamasına göre

    var sortAsc = measureMeta && measureMeta.sort_direction === 'asc';
    var rows = [];
    for (var i = 0; i < allBanks.length; i++) {
      var b = allBanks[i];
      if (!bankShownForMeasure(mid, b, tarih)) continue;
      var v = bankVal(mid, b, tarih);
      rows.push({ banka: b, value: v });
    }
    rows.sort(function(a, b) {
      if (a.value == null && b.value == null) return 0;
      if (a.value == null) return 1;
      if (b.value == null) return -1;
      return sortAsc ? (a.value - b.value) : (b.value - a.value);
    });
    return rows;
  }

  // Banka hızlı filtre grupları (Katılım/Mevduat/Rakip Bankalar) —
  // DATA.meta.groups'tan (admin panelden düzenlenebilen GERÇEK grup
  // üyelikleri, "Banka Grupları" kartlarının kullandığı KAYNAKLA aynı)
  // okur. Eskiden BankRanking içinde local'di, YtDGrowthChart'ın da aynı
  // hızlı filtreleri kullanması için (2026-09-18, kullanıcı isteği: "İlk
  // 20 banka olmasın aynı sınıflandırma burada da olsun") paylaşılan
  // scope'a taşındı.
  // KT + "Rakip Bankalar" grubunun üyeleri. Grup admin panelden
  // düzenlenebildiği için liste koda sabit yazılmaz (eskiden Rakip Bankalar
  // kartları/trendi ve dipnot sabit 5 bankaydı, grup değişince yanlış
  // kalıyordu). Bilinen sıra korunur, yeni eklenenler sona gelir.
  var RAKIP_VARSAYILAN_SIRA = ['Garanti Bankası', 'Yapı Kredi', 'Akbank', 'QNB', 'Denizbank'];
  // ===============================================================
  // GÖRÜNÜMDEN ÇIKARILAN BANKALAR (2026-10-02)
  // Kullanıcı bir bankaya sağ tıklayıp onu görünümden çıkarabilir: sıralama, YtD grafiği, rakip
  // kartları/trendi, Trend ve Kompozisyon o bankayı göstermez; bar ölçekleri (ör. negatif taraf)
  // kalan bankalara göre yeniden hesaplanır. Seçim bu tarayıcıda saklanır (localStorage), üstteki
  // şeritten tek tek ya da topluca geri alınır. Grup değerleri (Banka Grupları kartları) sunucuda
  // hesaplandığı için değişmez. Odak banka çıkarılamaz.
  // ===============================================================
  var HARIC = {};
  var _haricDinleyici = null, _bankaMenuAc = null;
  (function() {
    try {
      var gercek = {};
      DATA.meta.banks.forEach(function(b){ gercek[b.banka_adi] = true; });
      JSON.parse(localStorage.getItem('kt_gizli_bankalar') || '[]').forEach(function(b) {
        if (gercek[b] && b !== KT_NAME) HARIC[b] = true;
      });
    } catch (e) { /* depolama kapalı: boş başlar */ }
  })();
  function bankaGizli(b) { return !!HARIC[b]; }
  function gizliBankalar() { return Object.keys(HARIC); }
  function bankaGizle(b, gizle) {
    if (gizle && b === KT_NAME) return;
    if (gizle) HARIC[b] = true; else delete HARIC[b];
    try { localStorage.setItem('kt_gizli_bankalar', JSON.stringify(Object.keys(HARIC))); } catch (e) { /* yok say */ }
    if (_haricDinleyici) _haricDinleyici();
  }
  function tumGizlileriGeriAl() {
    HARIC = {};
    try { localStorage.removeItem('kt_gizli_bankalar'); } catch (e) { /* yok say */ }
    if (_haricDinleyici) _haricDinleyici();
  }
  // Banka öğelerinin onContextMenu'sü: sağ tık menüsünü açar.
  function bankaMenusu(e, banka) {
    if (!_bankaMenuAc || !banka) return;
    e.preventDefault(); e.stopPropagation();
    _bankaMenuAc({ x: e.clientX, y: e.clientY, banka: banka });
  }

  function rakipBankList() {
    var uyeler = ((DATA.meta.groups || {})['Rakip Bankalar']) || RAKIP_VARSAYILAN_SIRA;
    var sirali = RAKIP_VARSAYILAN_SIRA.filter(function(b){ return uyeler.indexOf(b) >= 0; })
      .concat(uyeler.filter(function(b){ return RAKIP_VARSAYILAN_SIRA.indexOf(b) < 0 && b !== KT_NAME; }));
    return [KT_NAME].concat(sirali.filter(function(b){ return !bankaGizli(b); }));
  }
  function groupMemberSet(groupName) {
    var set = {};
    (((DATA.meta.groups || {})[groupName]) || []).forEach(function(b){ set[b] = true; });
    return set;
  }

  // Banka listesi panellerinin (BankRanking, YtDGrowthChart) başlığındaki
  // ÖZNE kısmı — hangi bankaların listelendiğini söyler. Kullanıcı isteği
  // (2026-09-23): "filtreleme yapılınca başlıklar da filtreye göre
  // değişsin" — önceden başlık her zaman "Tüm 27 Banka" diyordu, filtre
  // seçiliyken listedeki 7 satırla çelişiyordu. Banka sayısı başlıkta
  // gösterilmiyor (kullanıcı isteği, 2026-09-23); "İlk 20"deki 20 sayı
  // değil filtrenin adı. İki panel de aynı ifadeyi kullanır.
  // PDF banka sınıfları (2026-10-02): BankRanking/YtD filtre sekmeleriyle aynı anahtarlar.
  // 'ozel': kullanıcının PDF penceresinde tek tek seçtiği bankalar (PDF_FILTRE.set).
  var PDF_BANKA_SINIFLARI = [['all', 'Tümü'], ['katilim', 'Katılım'], ['mevduat', 'Mevduat'],
                             ['rakip', 'Rakip Bankalar'], ['top20', 'İlk 20 Banka'], ['ozel', 'Banka seç…']];
  // PDF üretimi sürerken sıralama ve YtD grafiğinin filtresini dışarıdan belirler (null = kullanıcının seçimi).
  var PDF_FILTRE = { mod: null, set: null };
  // Slayt etiketi / özet şeridi için sınıf adı ('Banka seç…' yerine 'Seçili bankalar').
  function pdfSinifAdi(mod) {
    if (mod === 'ozel') return 'Seçili bankalar';
    return (PDF_BANKA_SINIFLARI.filter(function(t){ return t[0] === mod; })[0] || [])[1] || '';
  }
  function sinifBankalari(mod, tarih) {
    var tum = DATA.meta.banks.filter(function(b){ return b.tur !== 'Grup'; }).map(function(b){ return b.banka_adi; });
    var set = null;
    if (mod === 'katilim') set = groupMemberSet('Katılım Bankaları');
    else if (mod === 'mevduat') set = groupMemberSet('Mevduat Bankaları');
    else if (mod === 'rakip') { set = groupMemberSet('Rakip Bankalar'); set[KT_NAME] = true; }
    else if (mod === 'top20') { set = {}; getFixedTop20(tarih).forEach(function(b){ set[b] = true; }); }
    else if (mod === 'ozel') set = PDF_FILTRE.set || {};
    var liste = set ? tum.filter(function(b){ return set[b]; }) : tum;
    return banksByAssetSize(liste);
  }

  function bankScopeLabel(filterMode) {
    if (filterMode === 'katilim') return 'Katılım Bankaları';
    if (filterMode === 'mevduat') return 'Mevduat Bankaları';
    if (filterMode === 'rakip') return 'Rakip Bankalar';
    if (filterMode === 'top20') return 'İlk 20 Banka';
    if (filterMode === 'ozel') return 'Seçili Banka';
    return 'Tüm Banka';
  }

  // Bir tarih pazar payı (marketShare/Bps) hesabı için GÜVENİLİR mi?
  // date_coverage (o tarihte toplam_aktifler raporlayan gerçek banka sayısı)
  // normalde zamanla artar (yeni banka kuruluşları). Ama bir çeyrek admin
  // panelden banka banka yüklenirken sayı GEÇİCİ OLARAK bir önceki tarihe
  // göre DÜŞER (ör. 26 → 7) — bu durumda payda eksik kaldığından tüm
  // bankaların payı yapay şekilde şişer. Böyle tarihler pazar payı için
  // kullanılmamalı (bkz. 2026-08-11: "pazar payı değişimlerinde bozulmalar").
  function _dateReliableForShare(tarih) {
    var dc = DATA.meta.date_coverage;
    if (!dc) return true;
    var dates = DATA.meta.dates;
    var idx = dates.indexOf(tarih);
    if (idx <= 0) return true;
    var prevDate = dates[idx - 1];
    return (dc[tarih] || 0) >= (dc[prevDate] || 0);
  }
  // universe: pazar payının hesaplandığı banka listesi (2026-09-27, kullanıcı
  // kararı). Verilmezse tüm bankalar (27); banka listesinde bir filtre
  // (Katılım / Mevduat / Rakip / İlk 20) seçiliyken o filtrenin bankaları.
  function marketShare(mid, banka, tarih, universe) {
    if (!_dateReliableForShare(tarih)) return null;
    var bv = bankVal(mid, banka, tarih);
    if (bv == null) return null;
    var total = 0;
    var banks = universe || DATA.meta.banks.map(function(b){ return b.banka_adi; });
    for (var i = 0; i < banks.length; i++) {
      var v = bankVal(mid, banks[i], tarih);
      if (v != null) total += v;
    }
    return total > 0 ? (bv / total * 100) : null;
  }
  // period: 'qoq' (varsayılan) | 'yoy' | 'ytd' — karşılaştırma dönemini seçer
  // (kullanıcı isteği, 2026-09-16: "Pazar Payı Değişimi" artık sadece
  // çeyreklik değil, YoY/YtD de seçilebilir).
  function deltaCmpTarih(period, tarih) {
    if (period === 'yoy') return yoyTarih(tarih);
    if (period === 'ytd') return ytdTarih(tarih);
    return qoqTarih(tarih);
  }
  function deltaPeriodLabel(period) {
    if (period === 'yoy') return 'YoY';
    if (period === 'ytd') return 'YtD';
    return 'QoQ';
  }
  function msDeltaBps(mid, banka, tarih, period, universe) {
    var cur = marketShare(mid, banka, tarih, universe);
    var prev = marketShare(mid, banka, deltaCmpTarih(period, tarih), universe);
    if (cur == null || prev == null) return null;
    return (cur - prev) * 100;
  }

  function ytdGrowth(mid, banka, tarih) {
    var cur = bankVal(mid, banka, tarih);
    var prev = bankVal(mid, banka, ytdTarih(tarih));
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }
  function ytdGrowthGroup(mid, grupName, tarih) {
    var cur = groupVal(mid, grupName, tarih);
    var prev = groupVal(mid, grupName, ytdTarih(tarih));
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }
  // YoY: bir önceki yılın aynı çeyreği
  function yoyGrowth(mid, banka, tarih) {
    var cur = bankVal(mid, banka, tarih);
    var prev = bankVal(mid, banka, yoyTarih(tarih));
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }
  function yoyGrowthGroup(mid, grupName, tarih) {
    var cur = groupVal(mid, grupName, tarih);
    var prev = groupVal(mid, grupName, yoyTarih(tarih));
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }
  // QoQ: bir önceki çeyrek (2026-09-18, kullanıcı isteği — YtD Büyüme
  // grafiğine YoY/QoQ seçeneği eklendi, bkz. YtDGrowthChart).
  function qoqGrowth(mid, banka, tarih) {
    var cur = bankVal(mid, banka, tarih);
    var prev = bankVal(mid, banka, qoqTarih(tarih));
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }
  function qoqGrowthGroup(mid, grupName, tarih) {
    var cur = groupVal(mid, grupName, tarih);
    var prev = groupVal(mid, grupName, qoqTarih(tarih));
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }
  // Baz dönem tarihini seçilen periyoda göre döndürür.
  function growthPeriodTarih(period, tarih) {
    if (period === 'yoy') return yoyTarih(tarih);
    if (period === 'qoq') return qoqTarih(tarih);
    return ytdTarih(tarih);
  }
  // period verilmezse eski davranış korunur: Akım kalem (Gelir Tablosu vb.)
  // için YoY, stok kalem için YtD (2026-09-18: artık `period` ile YtD/YoY/QoQ
  // arasında elle de seçilebiliyor — bkz. YtDGrowthChart'taki period toggle).
  function growthMetric(measure, banka, tarih, period) {
    var p = period || (measure.akim_stok === 'akim' ? 'yoy' : 'ytd');
    if (p === 'yoy') return yoyGrowth(measure.id, banka, tarih);
    if (p === 'qoq') return qoqGrowth(measure.id, banka, tarih);
    return ytdGrowth(measure.id, banka, tarih);
  }
  function growthMetricGroup(measure, grupName, tarih, period) {
    var p = period || (measure.akim_stok === 'akim' ? 'yoy' : 'ytd');
    if (p === 'yoy') return yoyGrowthGroup(measure.id, grupName, tarih);
    if (p === 'qoq') return qoqGrowthGroup(measure.id, grupName, tarih);
    return ytdGrowthGroup(measure.id, grupName, tarih);
  }
  function growthMetricLabel(measure, period) {
    var p = period || (measure.akim_stok === 'akim' ? 'yoy' : 'ytd');
    var e = p === 'yoy' ? 'YoY' : p === 'qoq' ? 'QoQ' : 'YtD';
    var on = bazOnEk(measure);
    return on ? on + ' ' + e : e;
  }
  // Büyümenin hesaplandığı BAZ dönem değeri (payda).
  // Baz ≤ 0 ise yüzde değişim matematiksel olarak anlamsızdır: zarardan
  // kâra geçen banka (−215 → +240) "%−211,6" gibi işareti ters bir sonuç
  // üretir. Bu tür satırlar anomali sayılıp grafikten dışlanır.
  function growthBase(measure, banka, tarih, period) {
    var p = period || (measure.akim_stok === 'akim' ? 'yoy' : 'ytd');
    return bankVal(measure.id, banka, growthPeriodTarih(p, tarih));
  }

  // Büyümenin MİKTARSAL (mutlak) hali — % yerine ölçünün kendi biriminde fark.
  // Şube&Personel grup büyüme kartlarında kullanılır (kullanıcı isteği). Baz
  // dönem stok→YtD (yıl başı), akım→YoY (geçen yıl aynı çeyrek); period
  // verilirse elle seçilen YtD/YoY/QoQ kullanılır.
  function growthMiktar(measure, banka, tarih, period) {
    var p = period || (measure.akim_stok === 'akim' ? 'yoy' : 'ytd');
    var d = growthPeriodTarih(p, tarih);
    var cur = bankVal(measure.id, banka, tarih);
    var prev = bankVal(measure.id, banka, d);
    if (cur == null || prev == null) return null;
    return cur - prev;
  }
  function growthMiktarGroup(measure, grupName, tarih, period) {
    var p = period || (measure.akim_stok === 'akim' ? 'yoy' : 'ytd');
    var d = growthPeriodTarih(p, tarih);
    var cur = groupVal(measure.id, grupName, tarih);
    var prev = groupVal(measure.id, grupName, d);
    if (cur == null || prev == null) return null;
    return cur - prev;
  }

  // Medyan (girdi dizisi sıralı OLMAK ZORUNDA değil)
  function medyan(arr) {
    if (!arr.length) return null;
    var s = arr.slice().sort(function(a, b){ return a - b; });
    var m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  // QoQ büyüme (banka ve grup için)
  function qoqGrowth(mid, banka, tarih) {
    var prevDate = qoqTarih(tarih);
    if (!prevDate) return null;
    var cur = bankVal(mid, banka, tarih);
    var prev = bankVal(mid, banka, prevDate);
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }
  function qoqGrowthGroup(mid, grupName, tarih) {
    var prevDate = qoqTarih(tarih);
    if (!prevDate) return null;
    var cur = groupVal(mid, grupName, tarih);
    var prev = groupVal(mid, grupName, prevDate);
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }

  // Grup pazar payı: grup_value / sektör_total × 100
  function groupMarketShare(mid, grupName, tarih) {
    if (!_dateReliableForShare(tarih)) return null;
    var gv = groupVal(mid, grupName, tarih);
    if (gv == null) return null;
    var total = 0;
    var banks = DATA.meta.banks.map(function(b){ return b.banka_adi; });
    for (var i = 0; i < banks.length; i++) {
      var v = bankVal(mid, banks[i], tarih);
      if (v != null) total += v;
    }
    return total > 0 ? (gv / total * 100) : null;
  }

  // Trend modu için birleşik değer hesabı
  // mode: 'value' | 'ytd' | 'yoy' | 'qoq' | 'ms'
  function trendValue(mid, name, tarih, mode, isGroup) {
    if (mode === 'value') {
      return isGroup ? groupVal(mid, name, tarih) : bankVal(mid, name, tarih);
    }
    if (mode === 'ms') {
      return isGroup ? groupMarketShare(mid, name, tarih) : marketShare(mid, name, tarih);
    }
    // Büyüme modları
    if (mode === 'ytd') return isGroup ? ytdGrowthGroup(mid, name, tarih) : ytdGrowth(mid, name, tarih);
    if (mode === 'yoy') return isGroup ? yoyGrowthGroup(mid, name, tarih) : yoyGrowth(mid, name, tarih);
    if (mode === 'qoq') return isGroup ? qoqGrowthGroup(mid, name, tarih) : qoqGrowth(mid, name, tarih);
    return null;
  }
  // Mode → başlık etiketi
  function trendModeLabel(mode) {
    if (mode === 'value') return 'Değer';
    if (mode === 'ytd') return 'YtD Büyüme';
    if (mode === 'yoy') return 'YoY Büyüme';
    if (mode === 'qoq') return 'QoQ Büyüme';
    if (mode === 'ms') return 'Pazar Payı';
    return 'Değer';
  }

  // "Rakip Bankalar Yıllık Snapshot" panelindeki 3 dönemle (t-2y, t-1y, t)
  // tutarlı: t-2 ile t arasında 2 yıl (2 bileşik adım) var, yani
  // t = (t-2) * x^2 → x = sqrt(t / (t-2)) → CAGR = x - 1 (2026-08-12 düzeltmesi;
  // önceden t-3 yılın değeriyle üs 1/3 kullanılıyordu — panelde gösterilen
  // aralıkla (t-2..t) uyuşmuyordu).
  function cagr2y(mid, banka, tarih) {
    var cur = bankVal(mid, banka, tarih);
    var two = bankVal(mid, banka, twoYearsAgoTarih(tarih));
    if (cur == null || two == null || two <= 0) return null;
    return (Math.pow(cur / two, 1/2) - 1) * 100;
  }
  // cagr2y'nin genel hali — "Son 3 Dönem" panelindeki dönemler artık elle
  // seçilebildiği için (2026-09-18, kullanıcı isteği) aradaki süre her
  // zaman 2 yıl olmayabilir; gerçek tarih farkına göre yıllıklandırır.
  function cagrBetween(mid, banka, fromDate, toDate) {
    if (!fromDate || !toDate) return null;
    var from = bankVal(mid, banka, fromDate);
    var to = bankVal(mid, banka, toDate);
    // from/to ikisi de pozitif olmalı — negatif taban (zarar) kesirli üste
    // yükseltilince NaN üretir (ör. Net Dönem Karı zarara dönerse).
    if (from == null || to == null || from <= 0 || to <= 0) return null;
    var years = (new Date(toDate) - new Date(fromDate)) / (365.25 * 24 * 3600 * 1000);
    if (years <= 0) return null;
    return (Math.pow(to / from, 1 / years) - 1) * 100;
  }

  function ratioQoQBps(mid, banka, tarih) {
    var cur = bankVal(mid, banka, tarih);
    var prev = bankVal(mid, banka, qoqTarih(tarih));
    if (cur == null || prev == null) return null;
    return (cur - prev) * 100;
  }
  function ratioQoQBpsGroup(mid, grupName, tarih) {
    var cur = groupVal(mid, grupName, tarih);
    var prev = groupVal(mid, grupName, qoqTarih(tarih));
    if (cur == null || prev == null) return null;
    return (cur - prev) * 100;
  }

  // Rasyo measure'ı için çeyreklik değişim — birime duyarlı.
  // Yüzde birimli measure  → iki yüzdenin farkı = BAZ PUAN (bps)
  // bin_TL / kat / adet    → baz puan anlamsız, YÜZDE değişim döner
  // İkinci dönüş değeri (bpsMi) çağıranın doğru formatı seçmesi içindir.
  function measureQoQDelta(measure, isim, tarih, isGroup, period) {
    var cmpT = deltaCmpTarih(period, tarih);
    var cur  = isGroup ? groupVal(measure.id, isim, tarih)
                       : bankVal(measure.id, isim, tarih);
    var prev = isGroup ? groupVal(measure.id, isim, cmpT)
                       : bankVal(measure.id, isim, cmpT);
    if (cur == null || prev == null) return null;
    if (isBpsDelta(measure)) return (cur - prev) * bpsCarpani(measure);
    return prev === 0 ? null : (cur - prev) / Math.abs(prev) * 100;
  }
  function fmtQoQDelta(v, measure) {
    if (v == null) return '—';
    return isBpsDelta(measure) ? fmtBps(v) : fmtPctPlain(v, 1);
  }
  function qoqDeltaEsik(measure) { return isBpsDelta(measure) ? 0.5 : 0.05; }

  // Şube & Personel kategorisi: çeyreklik değişim YÜZDE/BPS değil, MİKTARSAL
  // (mutlak fark) gösterilir — kullanıcı isteği (2026-08-15). Örn. Şube Sayısı
  // +2 (adet), Personel Sayısı +150, Şube Başına Krediler +45 mn TL.
  function isMiktarDelta(measure) {
    return !!(measure && measure.kategori === 'Şube & Personel');
  }
  function miktarDelta(measure, isim, tarih, isGroup, period) {
    var cmpT = deltaCmpTarih(period, tarih);
    var cur  = isGroup ? groupVal(measure.id, isim, tarih)
                       : bankVal(measure.id, isim, tarih);
    var prev = isGroup ? groupVal(measure.id, isim, cmpT)
                       : bankVal(measure.id, isim, cmpT);
    if (cur == null || prev == null) return null;
    return cur - prev;  // mutlak fark, ölçünün kendi biriminde

    // adet: sayım (büyüklük) tam sayı; oran (Şube Başına Personel) 1 ondalık
    var dec = (measure && measure.tip === 'buyukluk') ? 0 : 1;
    return pre + fmtNum(v, dec);

  // --- Renk yardımcıları (odak rengi) ---
  function _hex2rgb(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); var v = m ? parseInt(m[1], 16) : 0x62AE41;
    return [v >> 16 & 255, v >> 8 & 255, v & 255];
  }
  function _rgb2hex(c) { return '#' + c.map(function(v){ return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'); }).join(''); }
  function _lum(c) {
    var l = c.map(function(v){ v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2];
  }
  function _kontrast(a, b) { var x = _lum(a), y = _lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function _karistir(c, hedef, t) { return c.map(function(v, i){ return v + (hedef[i] - v) * t; }); }
  // Zemin üzerinde en az `oran` kontrastı sağlayana dek rengi hedefe (siyah/beyaz) doğru kaydırır.
  function _kontrastli(hex, zemin, oran, hedef) {
    var c = _hex2rgb(hex), z = _hex2rgb(zemin), h2 = _hex2rgb(hedef);
    for (var t = 0; t <= 1.0001; t += 0.04) {
      var d = _karistir(c, h2, t);
      if (_kontrast(d, z) >= oran) return _rgb2hex(d);

    return hedef;
  }
  function _lab(hex) {
    var c = _hex2rgb(hex).map(function(v){ v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    var X = (c[0] * 0.4124 + c[1] * 0.3576 + c[2] * 0.1805) / 0.95047;
    var Y = (c[0] * 0.2126 + c[1] * 0.7152 + c[2] * 0.0722);
    var Z = (c[0] * 0.0193 + c[1] * 0.1192 + c[2] * 0.9505) / 1.08883;
    function f(t){ return t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116; }
    return [116 * f(Y) - 16, 500 * (f(X) - f(Y)), 200 * (f(Y) - f(Z))];

  // Karanlık mod METİN kontrast düzeltmesi. BANK_COLORS bazı bankalar için
  // koyu tonlar içeriyor (örn. QNB lacivert #1B2D58, Denizbank mavisi
  // #003F87) — açık zeminde marka rengine sadık ve okunur, ama karanlık
  // sayfa zemininde (#1a2635) neredeyse görünmez oluyordu (ölçülen kontrast
  // oranı 1.14-1.50, WCAG minimum 4.5). Sadece METİN/etiket bağlamlarında
  // kullanılır — renk kutucukları/rozetler/bar dolguları (bankMono, seçili
  // chip arka planı vb.) marka rengine sadık kalmalı, bu yüzden onlar hâlâ
  // bankColor()'ı doğrudan kullanıyor.
  var _darkSafeColorCache = {};
  function _hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
    var n = parseInt(hex, 16);
    return { r: (n>>16)&255, g: (n>>8)&255, b: n&255 };
  }
  function _relLum(c) {
    function f(v){ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
    return 0.2126*f(c.r) + 0.7152*f(c.g) + 0.0722*f(c.b);
  }
  // Herhangi bir hex rengi, karanlık modda okunur kalacak şekilde ayarlar.
  // Marka/grup renkleri (bankColor, group_colors) bazen çok koyu tonlar
  // içeriyor (QNB lacivert, "Mevduat Bankaları" #2C3E50 gibi) — açık
  // zeminde sorun değil ama koyu sayfa zemininde (#1a2635) neredeyse
  // görünmez oluyordu. Sadece METİN bağlamlarında kullanılır; renkli
  // kutucuk/bar/çizgi gibi swatch'lar marka rengine sadık kalmalı.

    if (!window.__KT_DARK__) return hex;
    if (_darkSafeColorCache[hex]) return _darkSafeColorCache[hex];
    var rgb = _hexToRgb(hex);
    var lum = _relLum(rgb);
    var result = hex;
    if (lum < 0.35) {
      // Ne kadar koyuysa o kadar çok beyazla harmanla (max %65) — hue
      // korunur, sadece parlaklık karanlık zemine göre ayarlanır.
      var amount = Math.min(0.65, 0.35 + (0.35 - lum));
      result = '#' + [
        Math.round(rgb.r + (255-rgb.r)*amount),
        Math.round(rgb.g + (255-rgb.g)*amount),
        Math.round(rgb.b + (255-rgb.b)*amount),
      ].map(function(v){ return v.toString(16).padStart(2,'0'); }).join('');
    }
    _darkSafeColorCache[hex] = result;
    return result;
  }

  // Renkli bir zemin üzerine yazılacak metnin rengi (2026-09-08). Yeni banka

  // sınırının altında kalıyordu.

    var withWhite = 1.05 / (L + 0.05);
    var withDark  = (L + 0.05) / (DARK_L + 0.05);
    return withDark > withWhite ? '#14202b' : '#ffffff';
  }

  function bankMono(banka) {
    var logo = BANK_LOGOS[banka];
    if (logo) {
      return h('div', { className: 'bank-mono bank-mono-logo', title: banka },
        h('img', { src: logo, alt: banka })
      );
    }
    var color = bankColor(banka);
    var parts = banka.split(' ');
    var short;
    if (parts.length === 1) short = parts[0].slice(0, 2).toUpperCase();
    else short = (parts[0][0] + parts[1][0]).toUpperCase();
    return h('div', { className: 'bank-mono', style: { background: color } }, short);
  }

  // ===============================================================
  // TOPBAR
  // ===============================================================
  // Yıl+çeyrek buton seçicisi için sabit çeyrek-sonu ay listesi (veri BDDK
  // formatında çeyreklik: Mart/Haziran/Eylül/Aralık dışında dönem yok).
  // İngilizcede kısa ay adı: "September/December" dar ekranda satıra sığmıyordu.
  var QUARTER_MONTHS = [
    { label: EN ? 'Mar' : 'Mart', mm: '03' },
    { label: EN ? 'Jun' : 'Haziran', mm: '06' },
    { label: EN ? 'Sep' : 'Eylül', mm: '09' },
    { label: EN ? 'Dec' : 'Aralık', mm: '12' },
  ];

  // Yıl seçici: buton grubu yerine tıklanınca açılan liste. Dışarı
  // tıklanınca kapanır (mousedown dinleyicisi + ref ile).
  function YearDropdown(props) {
    var openState = useState(false);
    var open = openState[0], setOpen = openState[1];
    var ref = useRef(null);

    useEffect(function() {
      function onOutsideClick(e) {
        if (ref.current && !ref.current.contains(e.target)) setOpen(false);
      }
      document.addEventListener('mousedown', onOutsideClick);
      return function() { document.removeEventListener('mousedown', onOutsideClick); };
    }, []);

    return h('div', { className: 'year-dropdown', ref: ref },
      h('button', {
        className: 'year-dropdown-trigger' + (open ? ' open' : ''),
        onClick: function(){ setOpen(!open); }
      }, ikon('takvim', 15), h('span', { className: 'year-dropdown-deger' }, props.value),
         h('span', { className: 'chevron' }, ikon('asagi', 14))),
      open && h('div', { className: 'year-dropdown-list' },
        props.years.map(function(y) {
          return h('div', {
            key: y,
            className: 'year-dropdown-item' + (y === props.value ? ' active' : ''),
            onClick: function(){ props.onSelect(y); setOpen(false); }
          }, y);
        })
      )
    );
  }

  function DateSelectorBar(props) {
    // Yalnız aktif ölçü/kompozisyonun verisi olan dönemler seçilebilir (props.availDates).
    var allDates = (props.availDates && props.availDates.length) ? props.availDates : DATA.meta.dates; // sıralı, 'YYYY-MM-DD'
    // 2013 verisi (büyüme/CAGR hesaplarında baz yıl olarak) hâlâ
    // computed.json'da tutuluyor ama Yıl seçicide gösterilmiyor — kasıtlı
    // gizleme, veri kaybı değil.
    var HIDDEN_YEARS = { '2013': true };
    var years = useMemo(function() {
      var seen = {}, out = [];
      allDates.forEach(function(d) {
        var y = d.split('-')[0];
        if (!seen[y] && !HIDDEN_YEARS[y]) { seen[y] = true; out.push(y); }
      });
      return out;
    }, [allDates]);

    function dateFor(year, mm) {
      for (var i = 0; i < allDates.length; i++) {
        var p = allDates[i].split('-');
        if (p[0] === year && p[1] === mm) return allDates[i];
      }
      return null;
    }

    var parts = props.tarih.split('-');
    var curYear = parts[0], curMM = parts[1];

    function selectYear(year) {
      if (year === curYear) return;
      var target = dateFor(year, curMM);
      if (!target) {
        var candidates = allDates.filter(function(d){ return d.split('-')[0] === year; });
        if (candidates.length) target = candidates[candidates.length - 1];
      }
      if (target) props.setTarih(target);
    }
    function selectQuarter(mm) {
      if (mm === curMM) return;
      var target = dateFor(curYear, mm);
      if (target) props.setTarih(target);
    }

    // Mode butonları (Snapshot/Trend/Kompozisyon/Export) — yıl-çeyrek satırında,
    // sağa yaslı (2026-08-17). Eskiden ayrı control-bar'daydı.
    // "Görünümlerim" (my-view) kullanıcı isteğiyle (2026-09-17) GEÇİCİ olarak
    // butonlardan kaldırıldı — özellik/kod tamamen duruyor (arka planda),
    // sadece şu an üyelere gösterilmiyor. Geri açmak için alttaki satırı
    // MODES'a eklemek yeterli: ['my-view','Görünümlerim']
    // "Dışa Aktar" (export) kullanıcı isteğiyle (2026-09-18) buradan
    // kaldırılıp topbar'ın hamburger menüsüne taşındı — bkz. TopBar'daki
    // 📤 Dışa Aktar butonu (props.setMode('export')).
    var MODES = [['snapshot','Anında Görünüm'], ['trend','Trend'], ['composition','Kompozisyon']].filter(function(m){
      return (m[0] !== 'trend' || can('sekme_trend')) && (m[0] !== 'composition' || can('sekme_kompozisyon'));
    });
    var MOD_IKON = { snapshot: 'anlik', trend: 'trend', composition: 'komp' };

    // Dışa Aktar'da tarih aralığı kendi filtrelerinden seçiliyor; yıl/çeyrek
    // seçici bu modda hiçbir şeyi etkilemediği için gizlenir.
    var hideDate = props.mode === 'export';
    return h('div', { className: 'date-selector-bar' },
      !hideDate && h('div', { className: 'date-selector-group' },
        h('span', { className: 'date-selector-label' }, 'Yıl'),
        h(YearDropdown, { years: years, value: curYear, onSelect: selectYear })
      ),
      !hideDate && h('div', { className: 'date-selector-group' },
        h('span', { className: 'date-selector-label' }, 'Çeyrek'),
        h('div', { className: 'seg-track' }, QUARTER_MONTHS.map(function(q) {
          var exists = !!dateFor(curYear, q.mm);
          return h('button', {
            key: q.mm,
            className: 'date-pill' + (q.mm === curMM ? ' active' : '') + (exists ? '' : ' disabled'),
            disabled: !exists,
            onClick: exists ? function(){ selectQuarter(q.mm); } : undefined
          }, q.label);
        }))
      ),
      props.setMode && MODES.length > 1 && h('div', { className: 'mode-toggle' },
        MODES.map(function(m) {
          return h('button', {
            key: m[0],
            className: 'mode-btn' + (props.mode === m[0] ? ' active' : ''),
            onClick: function(){ props.setMode(m[0]); }
          }, ikon(MOD_IKON[m[0]], 15), h('span', null, m[1]));
        })
      )
    );
  }

  // Şifre değiştirme modal'ı — giriş yapmış kullanıcı kendi şifresini değiştirir.
  // Env-senkron admin hesapları (…@admin.local) için sunucu 400 döner; mesaj
  // kullanıcıyı start.sh'a yönlendirir.
  function PasswordModal(props) {
    var curState = useState(''); var newState = useState(''); var confState = useState('');
    var msgState = useState(null);   // null | { type:'err'|'ok', text }
    var busyState = useState(false);
    function submit() {
      var cur = curState[0], nw = newState[0], cf = confState[0];
      if (!cur || !nw) { msgState[1]({ type:'err', text:'Tüm alanları doldurun' }); return; }
      if (nw.length < 8) { msgState[1]({ type:'err', text:'Yeni şifre en az 8 karakter olmalı' }); return; }
      if (nw !== cf) { msgState[1]({ type:'err', text:'Yeni şifreler eşleşmiyor' }); return; }
      busyState[1](true); msgState[1](null);
      fetch('/api/change-password', {
        method:'POST', credentials:'same-origin',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ current_password: cur, new_password: nw })
      }).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
        .then(function(res){
          busyState[1](false);
          if (res.ok) {
            msgState[1]({ type:'ok', text: (res.j && res.j.message) || 'Şifreniz güncellendi.' });
            curState[1](''); newState[1](''); confState[1]('');
          } else {
            msgState[1]({ type:'err', text: (res.j && res.j.detail) || 'Bir hata oluştu' });
          }
        })
        .catch(function(){ busyState[1](false); msgState[1]({ type:'err', text:'Sunucuya ulaşılamadı' }); });
    }
    var msg = msgState[0];
    return h('div', {
      className: 'pw-modal-overlay',
      onClick: function(e){ if (e.target.className === 'pw-modal-overlay') props.onClose(); }
    },
      h('div', { className: 'pw-modal' },
        h('div', { className: 'pw-modal-title' }, 'Şifre Değiştir'),
        h('div', { className: 'pw-modal-sub' }, 'En az 8 karakterli yeni bir şifre belirleyin.'),
        h('label', { className: 'pw-label' }, 'Mevcut Şifre'),
        h('input', { className: 'pw-input', type: 'password', value: curState[0],
          onInput: function(e){ curState[1](e.target.value); } }),
        h('label', { className: 'pw-label' }, 'Yeni Şifre'),

  function BankaBaglamMenusu(props) {
    var m = props.menu, ref = useRef(null);
    var posSt = useState({ left: m.x, top: m.y });
    useEffect(function() {
      // Pencere kenarından taşmasın
      var el = ref.current; if (!el) return;
      var r = el.getBoundingClientRect();
      posSt[1]({ left: Math.max(8, Math.min(m.x, window.innerWidth - r.width - 8)),
                 top: Math.max(8, Math.min(m.y, window.innerHeight - r.height - 8)) });
      function kapat(e) { if (!el.contains(e.target)) props.onClose(); }
      function tus(e) { if (e.key === 'Escape') props.onClose(); }
      document.addEventListener('mousedown', kapat, true);
      document.addEventListener('keydown', tus);
      window.addEventListener('scroll', props.onClose, true);
      return function() {
        document.removeEventListener('mousedown', kapat, true);
        document.removeEventListener('keydown', tus);
        window.removeEventListener('scroll', props.onClose, true);
      };
    }, []);
    var gizli = bankaGizli(m.banka), odak = m.banka === KT_NAME, n = gizliBankalar().length;

      h('div', { className: 'banka-menu-baslik' }, bankMono(m.banka), h('span', null, m.banka)),

  function measureOptionGroups(excludeCustom) {

  function MeasureBuilderModal(props) {
    var listState = useState((DATA.__customMeasures || []).slice());
    var editIdState = useState(null);
    var adState = useState('');
    var opState = useState('ratio');
    var aState = useState('');
    var bState = useState('');
    var constantState = useState('');
    var bicimState = useState(null);
    var sortDirState = useState('desc');
    var fAState = useState('');
    var fBState = useState('');
    var formulState = useState('');
    var fEkleState = useState('');
    var eklenecekState = useState('');
    var formulRef = useRef(null);
    var msgState = useState(null);
    var busyState = useState(false);

    var byId = {};
    DATA.catalog.forEach(function(m){ if (!m.custom) byId[m.id] = m; });

    function resetForm() {
      editIdState[1](null); adState[1](''); opState[1]('ratio');
      aState[1](''); bState[1](''); constantState[1](''); bicimState[1](null);
      sortDirState[1]('desc'); fAState[1](''); fBState[1]('');
      formulState[1](''); fEkleState[1](''); eklenecekState[1]('');
    }

    // Tek işleme sığan tanım (eski kayıtlar dahil) basit sekmede, diğerleri
    // Formül sekmesinde [Ölçü Adı] metniyle açılır.
    function loadForEdit(rec) {
      var expr = cmRecordExpr(rec);
      var basit = cmSimpleForm(expr);
      editIdState[1](rec.id); adState[1](rec.ad);
      if (basit) {
        opState[1](basit.op); aState[1](basit.a); bState[1](basit.b || '');
        constantState[1](basit.constant == null ? '' : cmSabitMetin(basit.constant));
        bicimState[1](basit.bicim || null); formulState[1]('');
      } else {
        opState[1]('expr'); aState[1](''); bState[1](''); constantState[1]('');
        formulState[1](expr ? cmFormulaText(expr, byId) : '');
        bicimState[1](expr && expr.op === 'div' ? (expr.bicim || null) : null);
      }
      sortDirState[1](rec.sort_direction || 'desc');
      fAState[1](''); fBState[1](''); fEkleState[1](''); eklenecekState[1](''); msgState[1](null);
    }

    // Formül kutusuna imlecin olduğu yere [Ölçü Adı] ekler.
    function formuleEkle(id) {
      var M = byId[id];
      if (!M) return;
      var metin = formulState[0], el = formulRef.current;
      var bas = el && typeof el.selectionStart === 'number' ? el.selectionStart : metin.length;
      var son = el && typeof el.selectionEnd === 'number' ? el.selectionEnd : metin.length;
      var parca = '[' + M.ad + ']';
      if (bas > 0 && !/[\s(]$/.test(metin.slice(0, bas))) parca = ' ' + parca;
      formulState[1](metin.slice(0, bas) + parca + metin.slice(son));
      eklenecekState[1](''); msgState[1](null);
    }

    // Tanım → ifade ağacı → plan (hesap kuralları: customMeasureSpec —
    // sunucu da aynısını doğrular). Basit sekmeler tek işlemli ağaç kurar,
    // Formül sekmesi metni ayrıştırır. Sabit Türkçe ondalıkla ("1,5") da
    // girilebilir.
    var op = opState[0];
    var constantRaw = String(constantState[0]).trim();
    var constant = constantRaw === '' ? null : Number(constantRaw.replace(',', '.'));
    var def = {
      op: op, a: aState[0], b: op === 'scale' ? null : bState[0],
      constant: op === 'scale' ? constant : null,
    };
    var parseHata = null, expr = null;
    if (op === 'expr') {
      var ayr = cmParseFormula(formulState[0], byId);
      if (ayr.error) parseHata = ayr.error; else expr = ayr.expr;
    } else {
      expr = cmLegacyToExpr(op, def.a, def.b, def.constant, null);
    }
    // Sonuç biçimi (yalnız kökteki oran için seçilebilir): seçilen biçim
    // yeni ölçü çiftinde geçerli değilse sessizce varsayılana dönülür.
    var spec = expr ? customMeasureSpec({ expr: expr }, byId) : { error: parseHata };
    if (expr && !spec.error && bicimState[0] && spec.formats.indexOf(bicimState[0]) >= 0) {
      expr = Object.assign({}, expr, { bicim: bicimState[0] });
      spec = customMeasureSpec({ expr: expr }, byId);
    }
    var secimTamam = op === 'expr' ? formulState[0].trim() !== ''
      : !!def.a && (op === 'scale' ? constantRaw !== '' : !!def.b);

    // Ad önerisi 60 karaktere sığmalı: önce ölçülerin sondaki kısa adı
    // ("... (ROAA)" → "ROAA") kullanılır, yine uzunsa kelime sınırında kesilir.
    function kisaAd(m) {
      var k = /\(([^()]{2,20})\)\s*$/.exec(m.ad);
      return k ? k[1] : m.ad;
    }
    function sigdir(metin) {
      if (metin.length <= 60) return metin;
      var kes = metin.slice(0, 59);
      var bosluk = kes.lastIndexOf(' ');
      return (bosluk > 30 ? kes.slice(0, bosluk) : kes) + '…';
    }
    function oneriAd() {
      if (op === 'expr') return spec.error ? '' : sigdir(spec.formul);
      var A = byId[def.a];
      if (!A) return '';
      if (op === 'scale') {
        if (constant == null || !isFinite(constant)) return '';
        var tekli = A.ad + ' × ' + cmSabitMetin(constant);
        return sigdir(tekli.length <= 60 ? tekli : kisaAd(A) + ' × ' + cmSabitMetin(constant));
      }
      var B = byId[def.b];
      if (!B) return '';
      var isaret = op === 'ratio' ? ' / ' : op === 'diff' ? ' − ' : ' + ';
      var tam = A.ad + isaret + B.ad;
      return sigdir(tam.length <= 60 ? tam : kisaAd(A) + isaret + kisaAd(B));
    }
    var oneri = oneriAd();
    var adFinal = (adState[0].trim() || oneri).replace(/\s+/g, ' ');
    var adAnahtar = adFinal.toLocaleLowerCase('tr');
    var adHata = !adFinal ? null
      : adFinal.length > 60 ? 'Ölçü adı en fazla 60 karakter olabilir'
      : listState[0].some(function(m){ return m.id !== editIdState[0] && m.ad.toLocaleLowerCase('tr') === adAnahtar; })
        ? 'Bu adla bir özel ölçünüz zaten var'
      : Object.keys(byId).some(function(id){ return byId[id].ad.toLocaleLowerCase('tr') === adAnahtar; })
        ? (adState[0].trim()
            ? 'Bu ad hazır bir ölçüde kullanılıyor, farklı bir ad seçin'
            : 'Bu ölçü zaten hazır ölçüler arasında var (“' + adFinal + '”) — ölçü seçiciden açabilirsiniz. Yine de oluşturmak için farklı bir ad yazın.')
      : null;
    var hata = !secimTamam ? null : (parseHata || spec.error || adHata);

    function refreshList() {
      return fetch('/api/my/measures', { credentials: 'same-origin' })
        .then(function(r){ return r.ok ? r.json() : { measures: [] }; })
        .then(function(j) {
          var list = j.measures || [];
          DATA.__customMeasures = list;
          injectCustomMeasures(DATA, list);
          listState[1](list);
          // Aktif ölçü silinen özel ölçüyse güvenli bir varsayılana dön.
          if (props.activeMeasure && props.activeMeasure.indexOf('custom_') === 0 &&
              !list.some(function(m){ return m.id === props.activeMeasure; })) {
            props.setActiveMeasure && props.setActiveMeasure('toplam_aktifler');
          }
          props.onDataChanged();
        });
    }

    function goster(id) {
      if (props.setMode && props.mode !== 'snapshot' && props.mode !== 'trend') props.setMode('snapshot');
      props.setActiveMeasure && props.setActiveMeasure(id);
      props.onClose();
    }

    function submit() {
      if (!secimTamam) {
        msgState[1]({ type: 'err', text: op === 'expr' ? 'Formül yazılmalı' : op === 'scale' ? 'Ölçü A ve sabit sayı girilmeli' : 'Ölçü A ve Ölçü B seçilmeli' });
        return;
      }
      if (hata) { msgState[1]({ type: 'err', text: hata }); return; }
      if (!adFinal) { msgState[1]({ type: 'err', text: 'Ölçü adı boş olamaz' }); return; }
      busyState[1](true); msgState[1](null);
      var editId = editIdState[0];
      fetch(editId ? ('/api/my/measures/' + editId) : '/api/my/measures', {
        method: editId ? 'PUT' : 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ad: adFinal, expr: expr, sort_direction: sortDirState[0] }),
      }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
        .then(function(res) {

  function NewViewModal(props) {
    var adState = useState('');
    var selectedState = useState({});
    var msgState = useState(null);
    var busyState = useState(false);
    var mg = measureOptionGroups(false);

    function toggle(id) {
      selectedState[1](function(prev) {
        var next = Object.assign({}, prev);
        if (next[id]) delete next[id]; else next[id] = true;
        return next;
      });
    }

    function submit() {
      var ad = adState[0].trim();
      var ids = Object.keys(selectedState[0]);
      if (!ad) { msgState[1]({ type: 'err', text: 'Görünüm adı boş olamaz' }); return; }
      if (ids.length === 0) { msgState[1]({ type: 'err', text: 'En az 1 ölçü seçin' }); return; }
      busyState[1](true); msgState[1](null);
      fetch('/api/my/views', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ad: ad, measure_ids: ids }),
      }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
        .then(function(res) {
          busyState[1](false);
          if (res.ok) { props.onCreated(res.j.view); }
          else { msgState[1]({ type: 'err', text: (res.j && res.j.detail) || 'Bir hata oluştu' }); }
        })
        .catch(function(){ busyState[1](false); msgState[1]({ type: 'err', text: 'Sunucuya ulaşılamadı' }); });
    }

    var selCount = Object.keys(selectedState[0]).length;
    return h('div', {
      className: 'pw-modal-overlay',
      onClick: function(e){ if (e.target.className === 'pw-modal-overlay') props.onClose(); }
    },
      h('div', { className: 'mb-modal' },
        h('div', { className: 'wn-modal-head' },
          h('div', { className: 'wn-modal-title' }, '+ Yeni Görünüm'),
          h('button', { className: 'wn-modal-close', onClick: props.onClose, title: 'Kapat' }, '✕')
        ),
        h('div', { className: 'wn-modal-body' },
          h('label', { className: 'pw-label' }, 'Görünüm Adı'),
          h('input', { className: 'pw-input', value: adState[0],
            onInput: function(e){ adState[1](e.target.value); } }),

            })

          msgState[0] && h('div', { className: 'pw-msg ' + (msgState[0].type === 'ok' ? 'ok' : 'err') }, msgState[0].text),

            h('button', { className: 'pw-btn primary', disabled: busyState[0], onClick: submit },

        )
      )
    );
  }

  function MyViewMode(props) {
    var tarih = props.tarih;
    var viewsState = useState((DATA.__savedViews || []).slice());
    var views = viewsState[0];
    var selState = useState(views.length ? views[0].id : null);
    var selId = selState[0];
    var newOpenState = useState(false);

    function refreshViews() {
      return fetch('/api/my/views', { credentials: 'same-origin' })
        .then(function(r){ return r.ok ? r.json() : { views: [] }; })
        .then(function(j) {
          var list = j.views || [];
          DATA.__savedViews = list;
          viewsState[1](list);
          if (!list.some(function(v){ return v.id === selId; })) {
            selState[1](list.length ? list[0].id : null);
          }
        });
    }

    function deleteView(id) {
      if (!window.confirm(cevir('Bu görünümü silmek istediğinize emin misiniz?'))) return;
      fetch('/api/my/views/' + id, { method: 'DELETE', credentials: 'same-origin' }).then(refreshViews);
    }

    var activeView = views.filter(function(v){ return v.id === selId; })[0];
    var measures = activeView ? activeView.measure_ids.map(function(mid){
      return DATA.catalog.filter(function(m){ return m.id === mid; })[0];
    }).filter(Boolean) : [];

    return h('div', null,
      h('div', { className: 'myview-header' },
        h('select', { className: 'myview-select', value: selId || '',
          onChange: function(e){ selState[1](e.target.value); } },

          views.map(function(v){

          })

        activeView && h('button', { className: 'myview-del-btn',
          onClick: function(){ deleteView(activeView.id); } }, '🗑 Sil'),
        h('button', { className: 'myview-new-btn',
          onClick: function(){ newOpenState[1](true); } }, '+ Yeni Görünüm')

      !activeView
        ? h('div', { className: 'empty-state' }, 'Bir görünüm seçin veya "+ Yeni Görünüm" ile oluşturun.')
        : h('div', { className: 'myview-stack' },
            measures.map(function(m) {
              return h(BankRanking, { key: m.id, measure: m, tarih: tarih });
            })
          ),
      newOpenState[0] && h(NewViewModal, {
        onClose: function(){ newOpenState[1](false); },
        onCreated: function(newView) {
          newOpenState[1](false);
          refreshViews().then(function(){ selState[1](newView.id); });
        },
      })
    );
  }

                }, measureList.map(function(m){

                    key: m.id, value: m.id,

                  }, m.ad + (m.tip === 'rasyo' ? '  (' + birimLabel(m) + ')' : '  (#)') + (isAvail ? '' : ' — veri yok'));
