    if (abs >= 1e12) return (tl/1e12).toFixed(2).replace('.', ',') + ' T TL';
    if (abs >= 1e9)  return (tl/1e9).toFixed(2).replace('.', ',') + ' mlr TL';
    if (abs >= 1e6)  return (tl/1e6).toFixed(1).replace('.', ',') + ' mn TL';
    if (abs >= 1e3)  return (tl/1e3).toFixed(0) + ' bin TL';
    return fmtNum(tl, 0) + ' TL';
  }

  // MERKEZİ değer formatı — measure.birim'e göre.
  // ÖNEMLİ: tip === 'rasyo' olması değerin YÜZDE olduğu anlamına GELMEZ.
  // 'Şube Başına Net Kar' (bin_TL) bir oran değil, şube başına düşen TL
  // tutarıdır; 'Şube Başına Personel' (adet) ise kişi sayısıdır. Eskiden
  // her yerde sadece 'kat' istisna tutulup gerisi % basıldığı için bu 8
  // measure yanlış görünüyordu (örn. 257 mn TL → "%257004,36").
  function fmtMeasure(v, measure, decimals) {
    if (v == null) return '—';
    var birim = measure && measure.birim;
    if (birim === 'bin_TL') return fmtBinTL(v);
    if (birim === 'kat')    return fmtKat(v, decimals == null ? 2 : decimals);
    if (birim === 'adet')   return fmtNum(v, decimals == null ? 1 : decimals);
    return fmtPct(v, decimals == null ? 2 : decimals);
  }

  // Büyüklük (tip='buyukluk') measure formatı — birime duyarlı.
  // Değerler TL cinsindendir ve milyon TL olarak gösterilir; ANCAK
  // 'Şube Sayısı' / 'Personel Sayısı' (birim='adet') TL değildir —
  // 1e6'ya bölünürse 1770 şube "0" görünürdü.
  function fmtBuyukluk(v, measure) {
    if (v == null) return '—';
    if (measure && measure.birim === 'adet') return fmtNum(v, 0);
    return fmtNum(v / 1e6, 0);
  }
  function buyuklukLabel(measure) {
    return (measure && measure.birim === 'adet') ? 'adet' : 'Milyon TL';
  }

  // Panel başlıklarındaki birim etiketi
  function birimLabel(measure) {
    var birim = measure && measure.birim;
    if (birim === 'bin_TL') return 'TL';
    if (birim === 'kat')    return 'kat';
    if (birim === 'adet')   return 'adet';
    return '%';
  }

  // Yüzde-tabanlı mı? (Bps değişim yalnızca yüzde birimli measure'lar için
  // anlamlıdır — TL tutarının "baz puan" değişimi diye bir şey yoktur.)
  function isPctBirim(measure) {
    var birim = measure && measure.birim;
    return birim !== 'bin_TL' && birim !== 'kat' && birim !== 'adet';
  }

  // YtD/YoY büyüme grafiğindeki DAR etiket hücreleri için kompakt format.
  // Hücre ~41px ve 9,5px fontta ancak 5 karakter sığıyor; "%249,9" (6 kr) ya
  // da "%-249100,0" (10 kr) taşıp komşu etiketlerin üstüne biniyordu.
  // İki önlem: (1) '%' işareti YAZILMAZ — panel başlığı zaten "(%)" diyor,
  // (2) büyüklüğe göre ondalık azaltılır. Tam değer tooltip'te korunur.
  //   81,1  |  250  (3 hane, ondalıksız)  |  -249b  (b = bin, ×1000)
  function fmtGrowthCompact(v) {
    if (v == null) return '—';
    var a = Math.abs(v);
    if (a >= 1000) return Math.round(v / 1000) + 'b';
    if (a >= 100)  return v.toFixed(0);
    return v.toFixed(1).replace('.', ',');
  }

  function fmtPctPlain(v, decimals) {
    if (v == null) return '—';
    decimals = decimals == null ? 1 : decimals;
    return '%' + v.toFixed(decimals).replace('.', ',');
  }
  // 'kat' birimli rasyolar için: "2,05 kat" (Türkçe virgül). Yüzde DEĞİL.
  function fmtKat(v, decimals) {
    if (v == null) return '—';
    decimals = decimals == null ? 2 : decimals;
    return v.toFixed(decimals).replace('.', ',') + ' kat';
  }
  function fmtTL_tr(v) {
    // DÜZELTME (Faz 5): küçük değerlerde de 'T' kullanılıyordu ("0,01T").
    // Artık büyüklüğe göre dinamik birim: T (≥1e12) / mlr (≥1e9) / mn (≥1e6).
    if (v == null) return '—';
    var abs = Math.abs(v);
    if (abs >= 1e12) return (v/1e12).toFixed(2).replace('.', ',') + 'T';
    if (abs >= 1e9)  return (v/1e9).toFixed(0) + ' mlr';
    if (abs >= 1e6)  return (v/1e6).toFixed(0) + ' mn';
    if (abs >= 1e3)  return (v/1e3).toFixed(0) + ' bin';
    return fmtNum(v, 0);
  }
  function fmtBps(v) {
    if (v == null) return '—';
    return Math.round(v).toLocaleString('tr-TR');
  }
  // Compact TL formatı: 1,22 T / 470 mlr / 12 mn
  function fmtTLAbbr(v) {
    if (v == null) return '—';
    var abs = Math.abs(v);
    if (abs >= 1e12) return (v/1e12).toFixed(2).replace('.', ',') + ' T TL';
    if (abs >= 1e9)  return (v/1e9).toFixed(0) + ' mlr TL';
    if (abs >= 1e6)  return (v/1e6).toFixed(0) + ' mn TL';
    return fmtNum(v, 0) + ' TL';
  }
  function qoqTarih(t) {
    var parts = t.split('-'); var y = +parts[0]; var m = +parts[1];
    if (m === 3)  return (y - 1) + '-12-31';
    if (m === 6)  return y + '-03-31';
    if (m === 9)  return y + '-06-30';
    if (m === 12) return y + '-09-30';
    return null;
  }
  function ytdTarih(t) {
    var y = parseInt(t.split('-')[0]);
    return (y - 1) + '-12-31';
  }
  function yoyTarih(t) {
    // Bir önceki yılın aynı çeyreği (örn: 2025-09-30 → 2024-09-30)
    var parts = t.split('-');
    var y = parseInt(parts[0]) - 1;
    return y + '-' + parts[1] + '-' + parts[2];
  }
  function twoYearsAgoTarih(t) {
    var parts = t.split('-');
    return (parseInt(parts[0]) - 2) + '-' + parts[1] + '-' + parts[2];
  }
  function tarihLabel(t) {
    var AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
    var parts = t.split('-');
    return AY[parseInt(parts[1]) - 1] + ' ' + parts[0];
  }
  function tarihLabelShort(t) {
    var AY = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
    var parts = t.split('-');
    return AY[parseInt(parts[1]) - 1] + ' ' + parts[0];
  }

  // --- Data accessors ---
  function bankVal(mid, banka, tarih) {
    if (!DATA.bank_data[mid]) return null;
    if (!DATA.bank_data[mid][banka]) return null;
    var v = DATA.bank_data[mid][banka][tarih];
    return (v == null) ? null : v;
  }
  function groupVal(mid, grupName, tarih) {
    if (!DATA.group_data[mid]) return null;
    if (!DATA.group_data[mid][grupName]) return null;
    var obj = DATA.group_data[mid][grupName][tarih];
    return obj ? obj.value : null;
  }

  // Şube-bazlı ölçüler: şubesi olmayan (dijital) bankalar bu ölçülerde
  // LİSTEDE/GRAFİKTE HİÇ gösterilmez (Enpara, TOM Bank, Hayat Finans — 0 şube;
  // "şube başına" bir metrik onlar için anlamsız, "–"/0 satırı olarak da kalmaz).
  // Personel-bazlı ölçüler ETKİLENMEZ (bu bankaların personeli var).
  var SUBE_MEASURES = {
    'sube_sayisi': true,
    'sube_basina_krediler': true,
    'sube_basina_mevduat': true,
    'sube_basina_net_kar': true,
    'sube_basina_personel': true
  };
  function bankHasBranches(banka, tarih) {
    var s = bankVal('sube_sayisi', banka, tarih);
    return s != null && s > 0;
  }
  // Bir ölçü + banka + tarih listede gösterilecek mi? (şubesiz banka + şube ölçüsü → hayır)
  function bankShownForMeasure(mid, banka, tarih) {
    if (SUBE_MEASURES[mid] && !bankHasBranches(banka, tarih)) return false;
    return true;
  }

  // 2026-09-08: Banka chip listesi sıralaması (Trend + Kompozisyon).
  // Kuveyt Türk HER ZAMAN başta, gerisi Toplam Aktifler büyüklüğüne göre
  // (büyükten küçüğe). Referans dönem SABİT (kullanıcı kararı): üstteki
  // yıl/çeyrek seçimi değişince chip'lerin yeri oynamasın diye "seçili
  // dönem" değil, her bankanın EN SON veri verdiği dönem kullanılır —
  // böylece son çeyreği henüz raporlamamış bir banka listenin dibine
  // düşmez. Hiç verisi olmayan banka sona, kendi arasında alfabetik (TR).
  var _bankSizeRankCache = null;
  function bankSizeRank() {
    if (_bankSizeRankCache) return _bankSizeRankCache;
    var dates = DATA.meta.dates;
    var rank = {};
    DATA.meta.banks.forEach(function(b) {
      var name = b.banka_adi, v = null;
      for (var i = dates.length - 1; i >= 0; i--) {
        v = bankVal('toplam_aktifler', name, dates[i]);
        if (v != null) break;
      }
      rank[name] = (v == null) ? -1 : v;
    });
    _bankSizeRankCache = rank;
    return rank;
  }
  function banksByAssetSize(list) {
    var rank = bankSizeRank();
    return list.slice().sort(function(a, b) {
      if (a === b) return 0;
      if (a === KT_NAME) return -1;
      if (b === KT_NAME) return 1;
      var ra = rank[a] == null ? -1 : rank[a];
      var rb = rank[b] == null ? -1 : rank[b];
      if (ra !== rb) return rb - ra;
      return a.localeCompare(b, 'tr');
    });
  }

  // SABİT TOP-20 seti — o tarihin Toplam Aktifler sıralamasına göre
  function getFixedTop20(tarih) {
    return (DATA.meta.top20_by_date && DATA.meta.top20_by_date[tarih]) || [];
  }

  // KT'nin sektör içindeki rank'i — TÜM 27 banka üzerinden, measure bazlı
  function ktRankFull(mid, tarih) {
    var allBanks = DATA.meta.banks.map(function(b){ return b.banka_adi; });
    var rows = [];
    for (var i = 0; i < allBanks.length; i++) {
      var b = allBanks[i];
      if (!bankShownForMeasure(mid, b, tarih)) continue;  // şubesiz banka + şube ölçüsü
      var v = bankVal(mid, b, tarih);
      if (v != null) rows.push({ banka: b, value: v });
    }
    rows.sort(function(a, b) { return b.value - a.value; });
    for (var j = 0; j < rows.length; j++) {
      if (rows[j].banka === KT_NAME) return [j + 1, rows.length];
    }
    return null;
  }

  // KT'nin SABIT TOP-20 içindeki rank'i — chart'ta gösterilen listedeki konumu
  // DÜZELTME (Faz 5): Sayaç, gösterilen listenin (top20SortedByMeasure) sıralama yönüyle
  // birebir aynı olmalı. Eskiden burada sabit azalan (b.value-a.value) sıralanıyordu;
  // liste ise sort_direction'a göre sıralandığı için sayaç ters yönden sayıyordu.
  function ktRankInTop20(mid, tarih) {
    var rows = top20SortedByMeasure(mid, tarih);
    if (!rows || rows.length === 0) return null;
    for (var j = 0; j < rows.length; j++) {
      if (rows[j].banka === KT_NAME) return [j + 1, rows.length];
    }
    return null;
  }

  // KT'nin TÜM bankalar arasındaki rank'i — allBanksSortedByMeasure ile aynı
  // sıralama yönünü kullanır (kullanıcı isteği, 2026-09-17: "İlk 20 Banka"
  // artık tüm bankaları gösteriyor, rozet de buna göre "X / 27" olmalı).
  function ktRankAll(mid, tarih) {
    var rows = allBanksSortedByMeasure(mid, tarih);
    if (!rows || rows.length === 0) return null;
    for (var j = 0; j < rows.length; j++) {
      if (rows[j].banka === KT_NAME) return [j + 1, rows.length];
    }
    return null;
  }

  // Top20 sabit set içinde measure'a göre sıralama
  function top20SortedByMeasure(mid, tarih) {
    var top20Set = getFixedTop20(tarih);
    var measureMeta = DATA.catalog.filter(function(m){return m.id === mid;})[0];
    var sortAsc = measureMeta && measureMeta.sort_direction === 'asc';
    var rows = [];
    for (var i = 0; i < top20Set.length; i++) {
      var b = top20Set[i];
      if (!bankShownForMeasure(mid, b, tarih)) continue;  // şubesiz banka + şube ölçüsü
      var v = bankVal(mid, b, tarih);
      rows.push({ banka: b, value: v });
    }
    // Sort: null'lar her zaman sona; aksi durum sort_direction'a göre
    rows.sort(function(a, b) {
      if (a.value == null && b.value == null) return 0;
      if (a.value == null) return 1;
      if (b.value == null) return -1;
      return sortAsc ? (a.value - b.value) : (b.value - a.value);
    });
    return rows;
  }

  // TÜM bankalar (sabit top-20 seti DEĞİL) measure'a göre sıralı — kullanıcı
  // isteği (2026-09-17): "İlk 20 Banka" listesi artık ilk görünüşte 20
  // banka gösterse de, aşağı kaydırınca TÜM bankalara ulaşılabiliyor
  // (bkz. BankRanking + .bank-rows-scroll). top20SortedByMeasure ile aynı
  // mantık, sadece kaynak set DATA.meta.banks (tüm bankalar).
  function allBanksSortedByMeasure(mid, tarih) {
    var allBanks = DATA.meta.banks.map(function(b){ return b.banka_adi; });
    var measureMeta = DATA.catalog.filter(function(m){return m.id === mid;})[0];
    var sortAsc = measureMeta && measureMeta.sort_direction === 'asc';
    var rows = [];
    for (var i = 0; i < allBanks.length; i++) {
      var b = allBanks[i];
      if (!bankShownForMeasure(mid, b, tarih)) continue;
      var v = bankVal(mid, b, tarih);
      rows.push({ banka: b, value: v });
    }
    rows.sort(function(a, b) {
      if (a.value == null && b.value == null) return 0;
      if (a.value == null) return 1;
      if (b.value == null) return -1;
      return sortAsc ? (a.value - b.value) : (b.value - a.value);
    });
    return rows;
  }

  // Bir tarih pazar payı (marketShare/Bps) hesabı için GÜVENİLİR mi?
  // date_coverage (o tarihte toplam_aktifler raporlayan gerçek banka sayısı)
  // normalde zamanla artar (yeni banka kuruluşları). Ama bir çeyrek admin
  // panelden banka banka yüklenirken sayı GEÇİCİ OLARAK bir önceki tarihe
  // göre DÜŞER (ör. 26 → 7) — bu durumda payda eksik kaldığından tüm
  // bankaların payı yapay şekilde şişer. Böyle tarihler pazar payı için
  // kullanılmamalı (bkz. 2026-08-11: "pazar payı değişimlerinde bozulmalar").
  function _dateReliableForShare(tarih) {
    var dc = DATA.meta.date_coverage;
    if (!dc) return true;
    var dates = DATA.meta.dates;
    var idx = dates.indexOf(tarih);
    if (idx <= 0) return true;
    var prevDate = dates[idx - 1];
    return (dc[tarih] || 0) >= (dc[prevDate] || 0);
  }
  function marketShare(mid, banka, tarih) {
    if (!_dateReliableForShare(tarih)) return null;
    var bv = bankVal(mid, banka, tarih);
    if (bv == null) return null;
    var total = 0;
    var banks = DATA.meta.banks.map(function(b){ return b.banka_adi; });
    for (var i = 0; i < banks.length; i++) {
      var v = bankVal(mid, banks[i], tarih);
      if (v != null) total += v;
    }
    return total > 0 ? (bv / total * 100) : null;
  }
  // period: 'qoq' (varsayılan) | 'yoy' | 'ytd' — karşılaştırma dönemini seçer
  // (kullanıcı isteği, 2026-09-16: "Pazar Payı Değişimi" artık sadece
  // çeyreklik değil, YoY/YtD de seçilebilir).
  function deltaCmpTarih(period, tarih) {
    if (period === 'yoy') return yoyTarih(tarih);
    if (period === 'ytd') return ytdTarih(tarih);
    return qoqTarih(tarih);
  }
  function deltaPeriodLabel(period) {
    if (period === 'yoy') return 'YoY';
    if (period === 'ytd') return 'YtD';
    return 'Çeyreklik';
  }
  function msDeltaBps(mid, banka, tarih, period) {
    var cur = marketShare(mid, banka, tarih);
    var prev = marketShare(mid, banka, deltaCmpTarih(period, tarih));
    if (cur == null || prev == null) return null;
    return (cur - prev) * 100;
  }

  function ytdGrowth(mid, banka, tarih) {
    var cur = bankVal(mid, banka, tarih);
    var prev = bankVal(mid, banka, ytdTarih(tarih));
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }
  function ytdGrowthGroup(mid, grupName, tarih) {
    var cur = groupVal(mid, grupName, tarih);
    var prev = groupVal(mid, grupName, ytdTarih(tarih));
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }
  // YoY: bir önceki yılın aynı çeyreği
  function yoyGrowth(mid, banka, tarih) {
    var cur = bankVal(mid, banka, tarih);
    var prev = bankVal(mid, banka, yoyTarih(tarih));
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }
  function yoyGrowthGroup(mid, grupName, tarih) {
    var cur = groupVal(mid, grupName, tarih);
    var prev = groupVal(mid, grupName, yoyTarih(tarih));
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }
  // Akım kalem (Gelir Tablosu vb.) için YoY, stok kalem için YtD
  function growthMetric(measure, banka, tarih) {
    if (measure.akim_stok === 'akim') return yoyGrowth(measure.id, banka, tarih);
    return ytdGrowth(measure.id, banka, tarih);
  }
  function growthMetricGroup(measure, grupName, tarih) {
    if (measure.akim_stok === 'akim') return yoyGrowthGroup(measure.id, grupName, tarih);
    return ytdGrowthGroup(measure.id, grupName, tarih);
  }
  function growthMetricLabel(measure) {
    return measure.akim_stok === 'akim' ? 'YoY' : 'YtD';
  }
  // Büyümenin hesaplandığı BAZ dönem değeri (payda).
  // Baz ≤ 0 ise yüzde değişim matematiksel olarak anlamsızdır: zarardan
  // kâra geçen banka (−215 → +240) "%−211,6" gibi işareti ters bir sonuç
  // üretir. Bu tür satırlar anomali sayılıp grafikten dışlanır.
  function growthBase(measure, banka, tarih) {
    var d = measure.akim_stok === 'akim' ? yoyTarih(tarih) : ytdTarih(tarih);
    return bankVal(measure.id, banka, d);
  }

  // Büyümenin MİKTARSAL (mutlak) hali — % yerine ölçünün kendi biriminde fark.
  // Şube&Personel grup büyüme kartlarında kullanılır (kullanıcı isteği). Baz
  // dönem stok→YtD (yıl başı), akım→YoY (geçen yıl aynı çeyrek).
  function growthMiktar(measure, banka, tarih) {
    var d = measure.akim_stok === 'akim' ? yoyTarih(tarih) : ytdTarih(tarih);
    var cur = bankVal(measure.id, banka, tarih);
    var prev = bankVal(measure.id, banka, d);
    if (cur == null || prev == null) return null;
    return cur - prev;
  }
  function growthMiktarGroup(measure, grupName, tarih) {
    var d = measure.akim_stok === 'akim' ? yoyTarih(tarih) : ytdTarih(tarih);
    var cur = groupVal(measure.id, grupName, tarih);
    var prev = groupVal(measure.id, grupName, d);
    if (cur == null || prev == null) return null;
    return cur - prev;
  }

  // Medyan (girdi dizisi sıralı OLMAK ZORUNDA değil)
  function medyan(arr) {
    if (!arr.length) return null;
    var s = arr.slice().sort(function(a, b){ return a - b; });
    var m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  // QoQ büyüme (banka ve grup için)
  function qoqGrowth(mid, banka, tarih) {
    var prevDate = qoqTarih(tarih);
    if (!prevDate) return null;
    var cur = bankVal(mid, banka, tarih);
    var prev = bankVal(mid, banka, prevDate);
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }
  function qoqGrowthGroup(mid, grupName, tarih) {
    var prevDate = qoqTarih(tarih);
    if (!prevDate) return null;
    var cur = groupVal(mid, grupName, tarih);
    var prev = groupVal(mid, grupName, prevDate);
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }

  // Grup pazar payı: grup_value / sektör_total × 100
  function groupMarketShare(mid, grupName, tarih) {
    if (!_dateReliableForShare(tarih)) return null;
    var gv = groupVal(mid, grupName, tarih);
    if (gv == null) return null;
    var total = 0;
    var banks = DATA.meta.banks.map(function(b){ return b.banka_adi; });
    for (var i = 0; i < banks.length; i++) {
      var v = bankVal(mid, banks[i], tarih);
      if (v != null) total += v;
    }
    return total > 0 ? (gv / total * 100) : null;
  }

  // Trend modu için birleşik değer hesabı
  // mode: 'value' | 'ytd' | 'yoy' | 'qoq' | 'ms'
  function trendValue(mid, name, tarih, mode, isGroup) {
    if (mode === 'value') {
      return isGroup ? groupVal(mid, name, tarih) : bankVal(mid, name, tarih);
    }
    if (mode === 'ms') {
      return isGroup ? groupMarketShare(mid, name, tarih) : marketShare(mid, name, tarih);
    }
    // Büyüme modları
    if (mode === 'ytd') return isGroup ? ytdGrowthGroup(mid, name, tarih) : ytdGrowth(mid, name, tarih);
    if (mode === 'yoy') return isGroup ? yoyGrowthGroup(mid, name, tarih) : yoyGrowth(mid, name, tarih);
    if (mode === 'qoq') return isGroup ? qoqGrowthGroup(mid, name, tarih) : qoqGrowth(mid, name, tarih);
    return null;
  }
  // Mode → başlık etiketi
  function trendModeLabel(mode) {
    if (mode === 'value') return 'Değer';
    if (mode === 'ytd') return 'YtD Büyüme';
    if (mode === 'yoy') return 'YoY Büyüme';
    if (mode === 'qoq') return 'QoQ Büyüme';
    if (mode === 'ms') return 'Pazar Payı';
    return 'Değer';
  }

  // "Rakip Bankalar Yıllık Snapshot" panelindeki 3 dönemle (t-2y, t-1y, t)
  // tutarlı: t-2 ile t arasında 2 yıl (2 bileşik adım) var, yani
  // t = (t-2) * x^2 → x = sqrt(t / (t-2)) → CAGR = x - 1 (2026-08-12 düzeltmesi;
  // önceden t-3 yılın değeriyle üs 1/3 kullanılıyordu — panelde gösterilen
  // aralıkla (t-2..t) uyuşmuyordu).
  function cagr2y(mid, banka, tarih) {
    var cur = bankVal(mid, banka, tarih);
    var two = bankVal(mid, banka, twoYearsAgoTarih(tarih));
    if (cur == null || two == null || two <= 0) return null;
    return (Math.pow(cur / two, 1/2) - 1) * 100;
  }

  function ratioQoQBps(mid, banka, tarih) {
    var cur = bankVal(mid, banka, tarih);
    var prev = bankVal(mid, banka, qoqTarih(tarih));
    if (cur == null || prev == null) return null;
    return (cur - prev) * 100;
  }
  function ratioQoQBpsGroup(mid, grupName, tarih) {
    var cur = groupVal(mid, grupName, tarih);
    var prev = groupVal(mid, grupName, qoqTarih(tarih));
    if (cur == null || prev == null) return null;
    return (cur - prev) * 100;
  }

  // Rasyo measure'ı için çeyreklik değişim — birime duyarlı.
  // Yüzde birimli measure  → iki yüzdenin farkı = BAZ PUAN (bps)
  // bin_TL / kat / adet    → baz puan anlamsız, YÜZDE değişim döner
  // İkinci dönüş değeri (bpsMi) çağıranın doğru formatı seçmesi içindir.
  function measureQoQDelta(measure, isim, tarih, isGroup, period) {
    var cmpT = deltaCmpTarih(period, tarih);
    var cur  = isGroup ? groupVal(measure.id, isim, tarih)
                       : bankVal(measure.id, isim, tarih);
    var prev = isGroup ? groupVal(measure.id, isim, cmpT)
                       : bankVal(measure.id, isim, cmpT);
    if (cur == null || prev == null) return null;
    if (isPctBirim(measure)) return (cur - prev) * 100;
    return prev === 0 ? null : (cur - prev) / Math.abs(prev) * 100;
  }
  function fmtQoQDelta(v, measure) {
    if (v == null) return '—';
    return isPctBirim(measure) ? fmtBps(v) : fmtPctPlain(v, 1);
  }
  function qoqDeltaEsik(measure) { return isPctBirim(measure) ? 0.5 : 0.05; }

  // Şube & Personel kategorisi: çeyreklik değişim YÜZDE/BPS değil, MİKTARSAL
  // (mutlak fark) gösterilir — kullanıcı isteği (2026-08-15). Örn. Şube Sayısı
  // +2 (adet), Personel Sayısı +150, Şube Başına Krediler +45 mn TL.
  function isMiktarDelta(measure) {
    return !!(measure && measure.kategori === 'Şube & Personel');
  }
  function miktarDelta(measure, isim, tarih, isGroup, period) {
    var cmpT = deltaCmpTarih(period, tarih);
    var cur  = isGroup ? groupVal(measure.id, isim, tarih)
                       : bankVal(measure.id, isim, tarih);
    var prev = isGroup ? groupVal(measure.id, isim, cmpT)
                       : bankVal(measure.id, isim, cmpT);
    if (cur == null || prev == null) return null;
    return cur - prev;  // mutlak fark, ölçünün kendi biriminde
  }
  function fmtMiktarDelta(v, measure) {
    if (v == null) return '—';
    var pre = v > 0 ? '+' : '';  // negatifin '-'i fmtBinTL/fmtNum'dan gelir
    if (measure && measure.birim === 'bin_TL') return pre + fmtBinTL(v);
    // adet: sayım (büyüklük) tam sayı; oran (Şube Başına Personel) 1 ondalık
    var dec = (measure && measure.tip === 'buyukluk') ? 0 : 1;
    return pre + fmtNum(v, dec);
  }
  function miktarDeltaEsik(measure) {
    return (measure && measure.birim === 'bin_TL') ? 1 : 0.5;
  }
  // Bir satır için gösterilecek çeyreklik delta değeri — kategori/tipe göre
  // kaynağı seçer: Şube&Personel → miktarsal fark; diğer rasyolar → bps/%;
  // Bilanço büyüklükleri → pazar payı bps.
  function rowQoQDelta(measure, banka, tarih, period) {
    if (isMiktarDelta(measure)) return miktarDelta(measure, banka, tarih, false, period);
    return (measure.tip === 'rasyo')
      ? measureQoQDelta(measure, banka, tarih, false, period)
      : msDeltaBps(measure.id, banka, tarih, period);
  }

  // YEŞİL TONU SADECE KT'YE AYRILMIŞ. Diğer bankalar farklı renk paletinden.
  // Banka renkleri (2026-09-08 yeniden tasarlandı — kullanıcı isteği).

  // kırmızı, mor, turuncu), aynı ailedeki bankalar PARLAKLIK kademeleriyle
  // ayrılır — ton marka kimliğini taşıdığı için korunur. Palet CIELAB'da
  // doğrulandı: 27 rengin birbirine en yakın çifti ΔE 15,9 (ayırt
  // edilebilirlik eşiği ~15), yani hiçbir iki banka karışmıyor.
  // Kuveyt Türk rengi kullanıcı tarafından sabitlendi, DEĞİŞTİRİLMEMELİ.
  // Repoda logosu bulunan 4 banka (KT, TEB, Vakıf Katılım, Ziraat Katılım)

  function bankColor(b) { return BANK_COLORS[b] || '#64748b'; }

  // Karanlık mod METİN kontrast düzeltmesi. BANK_COLORS bazı bankalar için
  // koyu tonlar içeriyor (örn. QNB lacivert #1B2D58, Denizbank mavisi
  // #003F87) — açık zeminde marka rengine sadık ve okunur, ama karanlık
  // sayfa zemininde (#1a2635) neredeyse görünmez oluyordu (ölçülen kontrast
  // oranı 1.14-1.50, WCAG minimum 4.5). Sadece METİN/etiket bağlamlarında
  // kullanılır — renk kutucukları/rozetler/bar dolguları (bankMono, seçili
  // chip arka planı vb.) marka rengine sadık kalmalı, bu yüzden onlar hâlâ
  // bankColor()'ı doğrudan kullanıyor.
  var _darkSafeColorCache = {};
  function _hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
    var n = parseInt(hex, 16);
    return { r: (n>>16)&255, g: (n>>8)&255, b: n&255 };
  }
  function _relLum(c) {
    function f(v){ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
    return 0.2126*f(c.r) + 0.7152*f(c.g) + 0.0722*f(c.b);
  }
  // Herhangi bir hex rengi, karanlık modda okunur kalacak şekilde ayarlar.
  // Marka/grup renkleri (bankColor, group_colors) bazen çok koyu tonlar
  // içeriyor (QNB lacivert, "Mevduat Bankaları" #2C3E50 gibi) — açık
  // zeminde sorun değil ama koyu sayfa zemininde (#1a2635) neredeyse
  // görünmez oluyordu. Sadece METİN bağlamlarında kullanılır; renkli
  // kutucuk/bar/çizgi gibi swatch'lar marka rengine sadık kalmalı.
  function darkSafeColor(hex) {
    if (!window.__KT_DARK__) return hex;
    if (_darkSafeColorCache[hex]) return _darkSafeColorCache[hex];
    var rgb = _hexToRgb(hex);
    var lum = _relLum(rgb);
    var result = hex;
    if (lum < 0.35) {
      // Ne kadar koyuysa o kadar çok beyazla harmanla (max %65) — hue
      // korunur, sadece parlaklık karanlık zemine göre ayarlanır.
      var amount = Math.min(0.65, 0.35 + (0.35 - lum));
      result = '#' + [
        Math.round(rgb.r + (255-rgb.r)*amount),
        Math.round(rgb.g + (255-rgb.g)*amount),
        Math.round(rgb.b + (255-rgb.b)*amount),
      ].map(function(v){ return v.toString(16).padStart(2,'0'); }).join('');
    }
    _darkSafeColorCache[hex] = result;
    return result;
  }
  function bankTextColor(b) { return darkSafeColor(bankColor(b)); }

  // Renkli bir zemin üzerine yazılacak metnin rengi (2026-09-08). Yeni banka
  // paletinde hem çok koyu (#0B2E63) hem çok açık (#FFB600, #5EEAD4) tonlar
  // var; seçili chip'lerde sabit beyaz yazı açık zeminlerde okunmuyordu.
  // Sabit bir parlaklık eşiği yerine İKİ adayın (beyaz / koyu) gerçek WCAG
  // kontrast oranı hesaplanıp yüksek olan seçilir — eşik yöntemi orta
  // parlaklıktaki renklerde (ör. KT yeşili #62AE41: beyazla 2,7:1) AA
  // sınırının altında kalıyordu.
  function contrastTextOn(hex) {
    var c = _hexToRgb(hex);
    function ch(v){ v/=255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
    var L = 0.2126*ch(c.r) + 0.7152*ch(c.g) + 0.0722*ch(c.b);
    var DARK_L = 0.0146;                       // #14202b
    var withWhite = 1.05 / (L + 0.05);
    var withDark  = (L + 0.05) / (DARK_L + 0.05);
    return withDark > withWhite ? '#14202b' : '#ffffff';
  }

  function bankMono(banka) {
    var logo = BANK_LOGOS[banka];
    if (logo) {
      return h('div', { className: 'bank-mono bank-mono-logo', title: banka },
        h('img', { src: logo, alt: banka })
      );
    }
    var color = bankColor(banka);
    var parts = banka.split(' ');
    var short;
    if (parts.length === 1) short = parts[0].slice(0, 2).toUpperCase();
    else short = (parts[0][0] + parts[1][0]).toUpperCase();
    return h('div', { className: 'bank-mono', style: { background: color } }, short);
  }

  // ===============================================================
  // TOPBAR
  // ===============================================================
  // Yıl+çeyrek buton seçicisi için sabit çeyrek-sonu ay listesi (veri BDDK
  // formatında çeyreklik: Mart/Haziran/Eylül/Aralık dışında dönem yok).
  var QUARTER_MONTHS = [
    { label: 'Mart', mm: '03' },
    { label: 'Haziran', mm: '06' },
    { label: 'Eylül', mm: '09' },
    { label: 'Aralık', mm: '12' },
  ];

  // Yıl seçici: buton grubu yerine tıklanınca açılan liste. Dışarı
  // tıklanınca kapanır (mousedown dinleyicisi + ref ile).
  function YearDropdown(props) {
    var openState = useState(false);
    var open = openState[0], setOpen = openState[1];
    var ref = useRef(null);

    useEffect(function() {
      function onOutsideClick(e) {
        if (ref.current && !ref.current.contains(e.target)) setOpen(false);
      }
      document.addEventListener('mousedown', onOutsideClick);
      return function() { document.removeEventListener('mousedown', onOutsideClick); };
    }, []);

    return h('div', { className: 'year-dropdown', ref: ref },
      h('button', {
        className: 'year-dropdown-trigger' + (open ? ' open' : ''),
        onClick: function(){ setOpen(!open); }
      }, props.value, h('span', { className: 'chevron' }, '▾')),
      open && h('div', { className: 'year-dropdown-list' },
        props.years.map(function(y) {
          return h('div', {
            key: y,
            className: 'year-dropdown-item' + (y === props.value ? ' active' : ''),
            onClick: function(){ props.onSelect(y); setOpen(false); }
          }, y);
        })
      )
    );
  }

  function DateSelectorBar(props) {
    var allDates = DATA.meta.dates; // sıralı, 'YYYY-MM-DD'
    // 2013 verisi (büyüme/CAGR hesaplarında baz yıl olarak) hâlâ
    // computed.json'da tutuluyor ama Yıl seçicide gösterilmiyor — kasıtlı
    // gizleme, veri kaybı değil.
    var HIDDEN_YEARS = { '2013': true };
    var years = useMemo(function() {
      var seen = {}, out = [];
      allDates.forEach(function(d) {
        var y = d.split('-')[0];
        if (!seen[y] && !HIDDEN_YEARS[y]) { seen[y] = true; out.push(y); }
      });
      return out;
    }, [allDates]);

    function dateFor(year, mm) {
      for (var i = 0; i < allDates.length; i++) {
        var p = allDates[i].split('-');
        if (p[0] === year && p[1] === mm) return allDates[i];
      }
      return null;
    }

    var parts = props.tarih.split('-');
    var curYear = parts[0], curMM = parts[1];

    function selectYear(year) {
      if (year === curYear) return;
      var target = dateFor(year, curMM);
      if (!target) {
        var candidates = allDates.filter(function(d){ return d.split('-')[0] === year; });
        if (candidates.length) target = candidates[candidates.length - 1];
      }
      if (target) props.setTarih(target);
    }
    function selectQuarter(mm) {
      if (mm === curMM) return;
      var target = dateFor(curYear, mm);
      if (target) props.setTarih(target);
    }

    // Mode butonları (Snapshot/Trend/Kompozisyon/Export) — yıl-çeyrek satırında,
    // sağa yaslı (2026-08-17). Eskiden ayrı control-bar'daydı.
    // "Görünümlerim" (my-view) kullanıcı isteğiyle (2026-09-17) GEÇİCİ olarak
    // butonlardan kaldırıldı — özellik/kod tamamen duruyor (arka planda),
    // sadece şu an üyelere gösterilmiyor. Geri açmak için alttaki satırı
    // MODES'a eklemek yeterli: ['my-view','Görünümlerim']
    var MODES = [['snapshot','Anında Görünüm'], ['trend','Trend'], ['composition','Kompozisyon'], ['export','Dışa Aktar']];

    return h('div', { className: 'date-selector-bar' },
      h('div', { className: 'date-selector-group' },
        h('span', { className: 'date-selector-label' }, 'Yıl'),
        h(YearDropdown, { years: years, value: curYear, onSelect: selectYear })
      ),
      h('div', { className: 'date-selector-group' },
        h('span', { className: 'date-selector-label' }, 'Çeyrek'),
        QUARTER_MONTHS.map(function(q) {
          var exists = !!dateFor(curYear, q.mm);
          return h('button', {
            key: q.mm,
            className: 'date-pill' + (q.mm === curMM ? ' active' : '') + (exists ? '' : ' disabled'),
            disabled: !exists,
            onClick: exists ? function(){ selectQuarter(q.mm); } : undefined
          }, q.label);
        })
      ),
      props.setMode && h('div', { className: 'mode-toggle' },
        MODES.map(function(m) {
          return h('button', {
            key: m[0],
            className: 'mode-btn' + (props.mode === m[0] ? ' active' : ''),
            onClick: function(){ props.setMode(m[0]); }
          }, m[1]);
        })
      )
    );
  }

  // Şifre değiştirme modal'ı — giriş yapmış kullanıcı kendi şifresini değiştirir.
  // Env-senkron admin hesapları (…@admin.local) için sunucu 400 döner; mesaj
  // kullanıcıyı start.sh'a yönlendirir.
  function PasswordModal(props) {
    var curState = useState(''); var newState = useState(''); var confState = useState('');
    var msgState = useState(null);   // null | { type:'err'|'ok', text }
    var busyState = useState(false);
    function submit() {
      var cur = curState[0], nw = newState[0], cf = confState[0];
      if (!cur || !nw) { msgState[1]({ type:'err', text:'Tüm alanları doldurun' }); return; }
      if (nw.length < 8) { msgState[1]({ type:'err', text:'Yeni şifre en az 8 karakter olmalı' }); return; }
      if (nw !== cf) { msgState[1]({ type:'err', text:'Yeni şifreler eşleşmiyor' }); return; }
      busyState[1](true); msgState[1](null);
      fetch('/api/change-password', {
        method:'POST', credentials:'same-origin',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ current_password: cur, new_password: nw })
      }).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
        .then(function(res){
          busyState[1](false);
          if (res.ok) {
            msgState[1]({ type:'ok', text: (res.j && res.j.message) || 'Şifreniz güncellendi.' });
            curState[1](''); newState[1](''); confState[1]('');
          } else {
            msgState[1]({ type:'err', text: (res.j && res.j.detail) || 'Bir hata oluştu' });
          }
        })
        .catch(function(){ busyState[1](false); msgState[1]({ type:'err', text:'Sunucuya ulaşılamadı' }); });
    }
    var msg = msgState[0];
    return h('div', {
      className: 'pw-modal-overlay',
      onClick: function(e){ if (e.target.className === 'pw-modal-overlay') props.onClose(); }
    },

  function measureOptionGroups(excludeCustom) {
    var groups = {}; var order = [];
    DATA.catalog.forEach(function(m) {
      if (excludeCustom && m.custom) return;
      if (!groups[m.kategori]) { groups[m.kategori] = []; order.push(m.kategori); }
      groups[m.kategori].push(m);
    });
    return { groups: groups, order: order };
  }

        ),
        h('div', { className: 'wn-modal-body' },
          h('div', { className: 'pw-modal-sub' },
            'Mevcut ölçüleri birleştirerek kendi ölçünüzü oluşturun — sadece sizin profilinizde saklanır.'),

          h('label', { className: 'pw-label' }, 'Ölçü Adı'),
          h('input', { className: 'pw-input', value: adState[0],
            onInput: function(e){ adState[1](e.target.value); } }),

          h('label', { className: 'pw-label' }, 'İşlem'),
          h('div', { className: 'mb-op-group' },
            CUSTOM_MEASURE_OPS.map(function(pair) {

            mg.order.map(function(k){
