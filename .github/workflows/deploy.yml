name: Deploy

# main'e her push'ta sunucuya SSH ile bağlanıp en son kodu çeker ve
# Docker Compose ile yeniden build+restart eder. data/ klasörüne hiç
# dokunmaz (git'te değil, bkz. .gitignore) — canlı veri her zaman korunur.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH ile sunucuda güncelle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kt-kokpit
            git pull
            docker compose up -d --build
